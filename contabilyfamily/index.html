<title>ContabilyFamily</title>
<style>
/* ContabilyFamily — scadenze e spese della famiglia. Tutto nel telefono, niente rete. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f7fb; --text: #16203a; --muted: #5b6684; --line: #e2e8f3;
  --c: #1f6fe6; --c-t: #eaf2fe; --c-scuro: #1430c4; --c-fondo: #1f6fe6; --green: #2c9b3c; --green-t: #ecf7ee; --red: #e2393a; --red-t: #fdeced; --toast: #16203a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1420; --surface: #171e2d; --surface-2: #1c2436; --text: #e9eefa; --muted: #9aa6c2; --line: #2a3448; --c: #5b9bff; --c-t: #1a2a47; --c-scuro: #8fa6ff; --c-fondo: #2457c5; --green: #4cc463; --green-t: #173022; --red: #ff6466; --red-t: #3c1d22; --toast: #33405e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1420; --surface: #171e2d; --surface-2: #1c2436; --text: #e9eefa; --muted: #9aa6c2; --line: #2a3448; --c: #5b9bff; --c-t: #1a2a47; --c-scuro: #8fa6ff; --c-fondo: #2457c5; --green: #4cc463; --green-t: #173022; --red: #ff6466; --red-t: #3c1d22; --toast: #33405e; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.35; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.top { background: var(--c-fondo); color: #fff; padding-block: 10px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--c-fondo); }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; }
.top small { display: block; opacity: .9; font-size: 14px; margin-top: 2px; }
main { padding-block: 12px calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h3 span { color: var(--muted); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.riga { display: grid; grid-template-columns: 78px 1fr 92px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.riga:last-child { border-bottom: 0; }
.nota { height: 42px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #1b2433; border: 1px solid rgba(0,0,0,.12); }
.moneta { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #3a2a00; margin: 0 auto; border: 1px solid rgba(0,0,0,.15); }
.step { display: flex; align-items: center; gap: 4px; min-width: 0; }
.step button { width: 40px; height: 42px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 22px; font-weight: 700; color: var(--c); padding: 0; }
.step input { width: 100%; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; background: var(--surface); }
.riga .sub { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.totale { position: sticky; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 8px); background: var(--c-fondo); color: #fff; border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.2); margin-bottom: 12px; z-index: 5; }
.totale span { font-weight: 700; letter-spacing: .03em; }
.totale b { font-size: 26px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.campo { display: grid; gap: 4px; margin-bottom: 10px; }
.campo label { font-weight: 600; color: var(--muted); font-size: 14px; }
.soldi { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; height: 46px; }
.soldi span { color: var(--muted); margin-right: 6px; }
.soldi input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 18px; font-weight: 700; }
.campo textarea, .campo input.testo { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 46px; width: 100%; }
.conto { background: var(--c-t); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.conto .r { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.conto .r b { white-space: nowrap; }
.su { color: var(--green); } .giu { color: var(--red); }
.tasti { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.btn { flex: 1 1 auto; white-space: nowrap; min-height: 48px; border-radius: 12px; border: 0; background: var(--c-fondo); color: #fff; font-weight: 700; font-size: 16px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: var(--surface); color: var(--c); border: 1.5px solid var(--line); }
.btn.rosso { background: var(--red-t); color: var(--red); }
.btn svg { width: 20px; height: 20px; flex: none; }
.lista { display: grid; gap: 8px; }
.voce { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.voce .data { flex: none; width: 56px; min-height: 52px; padding: 6px 0; align-content: center; gap: 1px; border-radius: 12px; background: var(--c-t); color: var(--c); display: grid; place-items: center; line-height: 1.05; text-align: center; }
.voce .data b { font-size: 18px; } .voce .data small { font-size: 12px; font-weight: 700; } .voce .data small.anno { font-size: 11.5px; font-weight: 600; opacity: .85; }
.voce .mid { flex: 1; min-width: 0; } .voce .mid b { display: block; } .voce .mid small { color: var(--muted); display: block; }
.voce .imp { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vuoto { text-align: center; color: var(--muted); padding: 30px 10px; border: 1.5px dashed var(--line); border-radius: 14px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(5, 1fr); z-index: 20; }
.tabbar button { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--c); }
.foglio-ov { position: fixed; inset: 0; background: rgba(10,15,30,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.foglio { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.foglio .fh { background: var(--c-fondo); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.foglio .fh b { font-size: 18px; }
.foglio .fh button { border: 0; background: none; color: #fff; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }
.foglio .fb { padding: 14px 16px; overflow: auto; }
.foglio .ff { padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
table.dett { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.dett td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.dett td:nth-child(2), table.dett td:nth-child(3) { text-align: right; white-space: nowrap; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); background: var(--toast); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 60; max-width: 86vw; text-align: center; }
.prosa p { margin: 0 0 10px; } .prosa h4 { margin: 14px 0 6px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
/* intestazione: ora, calcolatrice, nome dell'app e data (come ContabilyTab) */
.marca { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, var(--bg)), var(--bg)); padding-block: 10px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
.marca .barra { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
.marca .pill { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(20,30,60,.10); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.marca button.pill { font-size: 16px; }
.marca .pill svg { width: 22px; height: 22px; flex: none; color: var(--c); }
.marca button.pill:active { background: var(--c-t); }
.marca h2 { margin: 0; font-size: clamp(34px, 9.5vw, 52px); line-height: 1; font-weight: 800; letter-spacing: -.02em; color: var(--c-scuro); }
.marca h2 span { color: var(--c); }
.marca .oggi { margin: 6px 0 0; font-size: 16px; color: var(--muted); text-transform: capitalize; }
/* calendario */
.mesenav { display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-bottom: 12px; }
.mesenav button { border: 0; background: none; height: 48px; font-size: 26px; font-weight: 700; color: var(--c); }
.mesenav .lbl { font-size: 18px; color: var(--text); text-transform: capitalize; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.cal .gs, .cal .gg { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.cal .gs div { background: var(--c-fondo); color: #fff; text-align: center; font-size: 13px; font-weight: 700; padding: 7px 0; }
.cal .gg > * { min-height: 58px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 4px 3px; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; background: var(--surface); }
.cal .gg > *:nth-child(7n) { border-right: 0; }
.cal .gg button { border-top: 0; border-left: 0; font: inherit; color: inherit; }
.cal .gg .n { font-weight: 700; font-size: 15px; width: 26px; height: 26px; border-radius: 13px; display: grid; place-items: center; }
.cal .gg .oggi .n { background: var(--c-fondo); color: #fff; }
.cal .gg .dom .n { color: var(--muted); }
.cal .gg .imp { font-size: 11px; font-weight: 700; color: var(--c); background: var(--c-t); border-radius: 6px; padding: 2px 3px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
.cal .gg .piu { font-size: 11px; color: var(--muted); }
.cal-nota { margin: 10px 2px 0; }
/* calcolatrice a scomparsa (come ContabilyTab) */
.calcpad { position: fixed; z-index: 50; right: 12px; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px); width: min(340px, calc(100vw - 24px)); background: #1e2433; color: #fff; border-radius: 20px; box-shadow: 0 14px 40px rgba(0,0,0,.4); padding: 12px; }
.calcpad .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; }
.calcpad .bar span { font-size: 14px; opacity: .75; }
.calcpad .bar button { border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; height: 36px; padding: 0 12px; font-size: 14px; }
.calcpad .disp { text-align: right; padding: 4px 6px 10px; min-height: 76px; }
.calcpad .expr { font-size: 15px; opacity: .65; min-height: 20px; overflow-wrap: anywhere; }
.calcpad .res { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.calcpad .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calcpad .keys button { height: 54px; border: 0; border-radius: 14px; background: #2f3748; color: #fff; font-size: 22px; padding: 0; }
.calcpad .keys button.op { background: #3c4a6b; color: #9ec1ff; }
.calcpad .keys button.eq { background: #1f6fe6; color: #fff; }
.calcpad .keys button.fn { background: #444c5c; font-size: 18px; }
.calcpad .keys button:active { filter: brightness(1.25); }

/* stile «Contabily» (30/10/2026): stessi colori, sfondo grigio-azzurro chiaro, schede con ombra morbida, barra in alto sfumata */
:root:not([data-theme="dark"]) { --bg: #f1f4fa; --line: #e3e8f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1420; --line: #2a3448; } }
:root[data-theme="dark"] { --bg: #0f1420; --line: #2a3448; }
html, body { background: var(--bg); }
.top { background: linear-gradient(135deg, var(--c-fondo, var(--c)), color-mix(in srgb, var(--c-fondo, var(--c)) 72%, #0b1d5e)); border-radius: 0 0 20px 20px; box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 25%, transparent); }
.panel, .voce, .monthnav, .mesenav, .cal, .tbl-wrap, .griglia-wrap { border-color: transparent !important; box-shadow: 0 1px 2px rgba(20,40,90,.05), 0 6px 18px rgba(20,40,90,.07); }
.panel { border-radius: 16px; }

/* firma */
main::after{content:"by Contabily";display:block;clear:both;text-align:center;font-size:11px;letter-spacing:.04em;color:var(--muted);opacity:.85;padding:16px 0 6px}
/* ContabilyFamily */
.tabbar button { font-size: 12px; }
.chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.chips .chip { padding: 8px 6px; text-align: center; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--c-fondo); border-color: transparent; color: #fff; }
.chip .n { display: inline-block; min-width: 20px; margin-left: 6px; padding: 0 6px; border-radius: 10px; background: color-mix(in srgb, currentColor 18%, transparent); font-size: 12px; }
.grande { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 76px; padding: 12px 16px; border-radius: 18px; border: 0; color: #fff; text-align: left; box-shadow: 0 6px 18px rgba(20,40,90,.16); }
.grande svg { width: 30px; height: 30px; flex: none; }
.grande span { display: flex; flex-direction: column; min-width: 0; }
.grande b { font-size: 19px; line-height: 1.15; }
.grande small { font-size: 13px; opacity: .9; margin-top: 2px; }
.grande.blu { background: linear-gradient(135deg, var(--c-fondo), color-mix(in srgb, var(--c-fondo) 72%, #0b1d5e)); }
.grande.verde { background: linear-gradient(135deg, #2c9b3c, #1f7a2e); }
.due-tasti { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.due-tasti .grande { min-height: 92px; flex-direction: column; justify-content: center; text-align: center; gap: 6px; padding: 12px 8px; }
.due-tasti .grande span { align-items: center; }
.due-tasti .grande b { font-size: 17px; }
.kpi2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.kpi2 > div { background: var(--c-t); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kpi2 small { display: block; color: var(--muted); font-weight: 600; font-size: 13px; }
.kpi2 b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--c-scuro); }
.voce .ico { flex: none; width: 52px; height: 52px; border-radius: 12px; display: grid; place-items: center; font-size: 26px; background: var(--c-t); }
.voce .mid .stato { display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 8px; background: var(--c-t); color: var(--c); }
.stato.rosso { background: var(--red-t) !important; color: var(--red) !important; }
.stato.arancio { background: #fff1e3 !important; color: #c85b00 !important; }
.stato.verde { background: var(--green-t) !important; color: var(--green) !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .stato.arancio { background: #3a2516 !important; color: #ffab6b !important; } }
.voce.fatta { opacity: .65; }
.voce.fatta .mid b { text-decoration: line-through; }
.gruppo { margin: 16px 4px 8px; font-size: 13px; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.gruppo:first-child { margin-top: 0; }
.barre { display: grid; gap: 8px; }
.barra-cat { display: grid; grid-template-columns: 30px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.barra-cat .e { font-size: 20px; text-align: center; }
.barra-cat .t { min-width: 0; }
.barra-cat .t div:first-child { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barra-cat .bg { height: 8px; border-radius: 4px; background: var(--c-t); overflow: hidden; margin-top: 3px; }
.barra-cat .bg i { display: block; height: 100%; background: var(--c); border-radius: 4px; }
.barra-cat b { font-variant-numeric: tabular-nums; white-space: nowrap; }
.scelte { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.scelte button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; min-height: 58px; padding: 6px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.15; text-align: center; }
.scelte button .e { font-size: 21px; }
.scelte button.on { border-color: var(--c); background: var(--c-t); color: var(--c-scuro); }
.campo input.testo[type="date"], .campo input.testo[type="time"], .campo select { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 46px; width: 100%; color: var(--text); font: inherit; }
.due { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.due > .campo { min-width: 0; }
.spunte { display: flex; flex-wrap: wrap; gap: 6px; }
.spunte label { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 600; }
.spunte label:has(input:checked) { border-color: var(--c); background: var(--c-t); color: var(--c-scuro); }
.spunte input { width: 18px; height: 18px; margin: 0; accent-color: var(--c); }
.riga-spunta { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 0; }
.riga-spunta input { width: 24px; height: 24px; flex: none; accent-color: var(--c); }
.cal .gg .punti { display: flex; gap: 3px; justify-content: center; }
.cal .gg .punti i { width: 7px; height: 7px; border-radius: 50%; background: var(--red); display: block; }
.cal .gg .punti i.ok { background: var(--green); }
.cal .gg .punti i.prox { background: #f08a24; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 2px 0; font-size: 13px; color: var(--muted); }
.legenda span { display: inline-flex; align-items: center; gap: 6px; }
.legenda i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
details.doc { background: var(--surface); border-radius: 16px; margin-bottom: 12px; box-shadow: 0 1px 2px rgba(20,40,90,.05), 0 6px 18px rgba(20,40,90,.07); }
details.doc summary { padding: 14px 16px; font-weight: 700; font-size: 16px; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
details.doc summary::-webkit-details-marker { display: none; }
details.doc summary::after { content: "›"; font-size: 24px; color: var(--c); transform: rotate(90deg); transition: transform .15s; }
details.doc[open] summary::after { transform: rotate(-90deg); }
details.doc .prosa { padding: 0 16px 12px; }
.sezione-top { display: flex; gap: 8px; margin-bottom: 12px; }
.sezione-top .btn { flex: 1 1 0; min-width: 0; white-space: normal; line-height: 1.15; padding-left: 10px; padding-right: 10px; }
.punti { margin: 0 0 10px; padding-left: 20px; } .punti li { margin-bottom: 6px; }
.agg { color: var(--muted); font-size: 13px; }
.docs { display: grid; gap: 8px; }
.docs details.doc { margin-bottom: 0; }
.prosa ul { margin: 0 0 10px; padding-left: 20px; } .prosa li { margin-bottom: 4px; }
.scelte button.nuova { border-style: dashed; color: var(--c); }
.scelte button.nuova .e { font-size: 22px; font-weight: 700; }
.icone-cat { display: grid; grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); gap: 6px; }
.icone-cat button { height: 46px; border: 1.5px solid var(--line); background: var(--surface); border-radius: 12px; font-size: 22px; padding: 0; }
.icone-cat button.on { border-color: var(--c); background: var(--c-t); box-shadow: 0 0 0 2px var(--c) inset; }
.mie-cat { padding: 8px 0; border-top: 1px solid var(--line); }
.mie-cat:first-of-type { border-top: 0; }
.mie-cat > b { display: block; margin-bottom: 6px; }
.mie-cat-l { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.mie-cat-l .chip.nuova { border-style: dashed; color: var(--c); }
/* blocco con PIN */
.pin-ov { position: fixed; inset: 0; z-index: 1000; background: var(--pin-bg, var(--bg, #0f1420)); color: var(--pin-fg, var(--text, var(--fg, #16203a))); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow: auto; }
.pin-box { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.pin-marca { font-size: 26px; font-weight: 800; letter-spacing: -.01em; color: var(--pin-c, var(--c-scuro, var(--c, var(--gold, #1430c4)))); }
.pin-app { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.22); display: block; margin-bottom: 2px; }
.pin-ic { width: 40px; height: 40px; color: var(--pin-c, var(--c, var(--gold, #1f6fe6))); }
.pin-titolo { font-size: 20px; font-weight: 700; }
.pin-msg { margin: 0; min-height: 2.6em; font-size: 14.5px; color: var(--muted, #5b6684); max-width: 300px; }
.pin-punti { display: flex; gap: 18px; justify-content: center; margin: 4px 0 10px; }
.pin-punti i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--pin-c, var(--c, var(--gold, #1f6fe6))); display: block; }
.pin-punti i.on { background: var(--pin-c, var(--c, var(--gold, #1f6fe6))); }
.pin-punti.scuoti { animation: pin-scuoti .4s; }
@keyframes pin-scuoti { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pin-tast { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; justify-content: center; }
.pin-k { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line, #e2e8f3); background: var(--surface, #fff); color: inherit; font-size: 28px; font-weight: 600; display: grid; place-items: center; padding: 0; font-family: inherit; cursor: pointer; }
.pin-k:active { background: var(--c-t, rgba(127,127,127,.2)); }
.pin-k.pin-del { border-color: transparent; background: transparent; font-size: 24px; }
.pin-link { margin-top: 6px; border: 0; background: none; color: var(--pin-c, var(--c, var(--gold, #1f6fe6))); font-weight: 700; font-size: 15px; padding: 8px 12px; font-family: inherit; cursor: pointer; }
.pin-aiuto { width: 100%; }
.pin-det { text-align: left; font-size: 14px; color: var(--muted, #5b6684); display: grid; gap: 8px; }
.pin-det[hidden] { display: none; }
.pin-det p { margin: 0; }
.pin-inp { width: 100%; min-height: 44px; border: 1px solid var(--line, #e2e8f3); border-radius: 10px; padding: 0 12px; background: var(--surface, #fff); color: inherit; font: inherit; }
.pin-canc { min-height: 44px; border: 0; border-radius: 10px; background: var(--red-t, #fdeced); color: var(--red, #e2393a); font-weight: 700; font: inherit; font-weight: 700; cursor: pointer; }
.pin-toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); background: var(--toast, #16203a); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 1001; max-width: 86vw; text-align: center; }
.pin-panel .pin-stato { margin: 0 0 10px; color: var(--muted, #5b6684); font-size: 14px; }
.pin-panel .pin-tasti { display: flex; flex-wrap: wrap; gap: 8px; }
.pin-panel .pin-tasti > * { flex: 1 1 auto; }
@media (max-width: 340px) { .pin-tast { grid-template-columns: repeat(3, 66px); } .pin-k { width: 66px; height: 66px; } }
.pin-codice { font: 700 26px/1.2 ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .06em; padding: 14px 16px; border-radius: 14px; border: 2px dashed var(--pin-c, var(--c, var(--gold, #1f6fe6))); background: var(--surface, #fff); white-space: nowrap; max-width: 100%; }
.pin-riga { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; font-weight: 600; padding: 4px 2px; }
.pin-spunta { width: 26px; height: 26px; flex: none; accent-color: var(--pin-c, var(--c, var(--gold, #1f6fe6))); }
.pin-usa { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--pin-c, var(--c-fondo, var(--c, var(--gold, #1f6fe6)))); color: var(--pin-on, #fff); font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
.pin-usa:disabled { opacity: .45; }
.pin-err { margin: 0; min-height: 1.3em; color: var(--red, #e2393a); font-size: 14px; }
.pin-sep { border-top: 1px solid var(--line, #e2e8f3); padding-top: 10px; margin-top: 4px !important; }
@media (max-width: 340px) { .pin-codice { font-size: 22px; } }
/* confronta prezzi */
.prezzi-top { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
.cerca-p { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 12px; min-height: 48px; margin-bottom: 12px; }
.cerca-p svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.cerca-p input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--text); font: inherit; min-height: 46px; outline: none; }
.indietro { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; color: var(--c); font-weight: 700; font-size: 15px; padding: 4px 2px 10px; }
.voce .ico.bar { font-size: 0; color: var(--c); } .voce .ico.bar svg { width: 28px; height: 28px; }
.riga-prezzo { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 4px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); width: 100%; text-align: left; color: var(--text); }
.riga-prezzo.top { border-color: var(--green); background: var(--green-t); }
.riga-prezzo b.neg { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 16px; }
.riga-prezzo .pr { font-weight: 800; font-size: 17px; font-variant-numeric: tabular-nums; white-space: nowrap; text-align: right; }
.riga-prezzo small { color: var(--muted); font-size: 12.5px; }
.riga-prezzo .diff { text-align: right; font-weight: 700; font-size: 12.5px; color: var(--red); white-space: nowrap; }
.riga-prezzo.top .diff { color: var(--green); }
.prezzi-lista { display: grid; gap: 8px; }
.negozi-chip { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.negozi-chip button { border: 1.5px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.negozi-chip button.on { border-color: var(--c); background: var(--c-t); color: var(--c-scuro); }
.codice-riga { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.codice-riga .btn { min-height: 46px; padding: 0 14px; }
.simili { display: grid; gap: 6px; margin-top: 8px; }
.simili button { border: 1.5px dashed var(--c); background: var(--c-t); color: var(--c-scuro); border-radius: 12px; padding: 10px 12px; text-align: left; font-weight: 600; font-size: 14px; }
video.scan { width: 100%; border-radius: 12px; background: #000; max-height: 50vh; object-fit: cover; }
.swipe { position: relative; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 2px rgba(20,40,90,.05), 0 6px 18px rgba(20,40,90,.07); }
.swipe > .voce { box-shadow: none !important; }
.swipe > .voce { position: relative; z-index: 1; touch-action: pan-y; }
.swipe-cest { position: absolute; top: 0; right: 0; bottom: 0; width: 92px; border: 0; background: var(--red); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-weight: 700; font-size: 13px; visibility: hidden; }
.swipe.su .swipe-cest { visibility: visible; }
.swipe-cest svg { width: 24px; height: 24px; }

  const MANUALE = `<h4>Le scadenze</h4><p>Tocca <b>+ Scadenza</b> (in Oggi o in Scadenze) e scrivi che cosa scade: bollo auto, revisione, assicurazione, visita medica, vaccino, vaccino del cane, carta d'identità, IMU… Scegli il tipo, la data, se si ripete (ogni anno, ogni 2 anni…) e quando vuoi la notifica.</p><p>Quando l'hai fatta, apri la scadenza e tocca <b>Fatta</b>: se si ripete, l'app prepara da sola la prossima (per esempio il bollo dell'anno dopo).</p><p>Per eliminare una scadenza, <b>scorri il dito da destra a sinistra</b> e tocca il cestino rosso (oppure aprila e tocca il cestino in basso).</p><p>In <b>Scadenze</b> le trovi divise in «Da fare», «Scadute» e «Fatte», mese per mese. I colori ti dicono quanto manca: arancione nell'ultima settimana, rosso se scade oggi o è già passata.</p><h4>Le spese</h4><p>Tocca <b>+ Spesa</b>, scrivi quanto hai speso e tocca per cosa (spesa, bollette, carburante…).</p><p>Se ti serve una voce che non c'è, tocca <b>＋ Nuova categoria</b> (nelle scadenze o nelle spese): scegli il nome e l'icona. Le categorie create le rinomini o le elimini in Info → Le tue categorie.</p><p> In <b>Spese</b> vedi il totale del mese, il confronto con il mese prima e quanto hai speso per ogni voce.</p><h4>Confronta prezzi</h4><p>In <b>Spese → Confronta prezzi</b> tocca <b>Scansiona</b> e inquadra il codice a barre del prodotto (oppure tocca <b>Prodotto</b> e scrivi il nome). Scrivi il negozio e il prezzo e salva.</p><p>Quando sei in un altro negozio, scansiona lo stesso prodotto: l'app lo riconosce dal codice, scrivi il prezzo di quel negozio e ti dice subito <b>dove conviene</b> e quanto risparmi. Se il prodotto non ha il codice, cercalo per nome. In ogni prodotto vedi i prezzi di tutti i negozi, dal più basso: tocca un negozio per aggiornare il suo prezzo.</p><h4>Il calendario</h4><p>Ogni giorno mostra i pallini delle scadenze e le spese in euro. Tocca un giorno per vederle o aggiungerne.</p><h4>Le notifiche</h4><p>Nell'app installata arrivano anche ad app chiusa, all'orario che scegli qui sotto. Se non arrivano, controlla nelle impostazioni del telefono che le notifiche di ${NOME} siano permesse.</p><h4>Il backup</h4><p>I dati stanno solo in questo telefono: ogni tanto salva un backup e tienilo al sicuro. Se cambi telefono, lo ricarichi con «Carica backup».</p><h4>Il blocco con PIN</h4><p>In <b>Info → Blocco con PIN</b> tocca <b>Imposta PIN</b> e scegli 4 cifre: l'app le chiede ogni volta che la apri o ci torni. Ti viene dato anche un <b>codice di ripristino</b> da scrivere: se dimentichi il PIN, tocca «PIN dimenticato?», scrivi il codice e scegline uno nuovo senza perdere niente. Da Info puoi anche cambiarlo o toglierlo.</p>`;
  const PRIVACY = `<p class="agg">Versione del 1° novembre 2026 · secondo il Regolamento (UE) 2016/679 («GDPR») e il Codice in materia di protezione dei dati personali (D.Lgs. 196/2003, aggiornato dal D.Lgs. 101/2018).</p><h4>1. In breve</h4><ul><li><b>I dati restano sul telefono.</b> ${NOME} non ha il permesso di usare Internet: Android stesso le impedisce di collegarsi alla rete.</li><li>Nessun server, nessun account, nessuna pubblicità, nessuna statistica, nessun cookie, nessuna profilazione.</li><li>Lo sviluppatore <b>non riceve e non può vedere</b> nessuno dei dati che inserisci: nessuno può accedere alle tue informazioni senza il tuo telefono.</li><li>I dati escono dal telefono solo quando li mandi tu (backup).</li></ul><h4>2. Chi tratta i dati</h4><p>Le scadenze e le spese che scrivi riguardano te e la tua famiglia e le usi per motivi personali e domestici: per questo uso il GDPR non si applica (art. 2, par. 2, lett. c GDPR). Lo sviluppatore non tratta i tuoi dati: non li raccoglie, non li conserva e non li riceve, quindi non è né titolare né responsabile del trattamento.</p><h4>3. Quali dati si possono inserire</h4><ul><li>Scadenze: che cosa scade, la data, la ripetizione, per chi o per cosa (per esempio un familiare, un animale, un'auto), un importo e una nota.</li><li>Spese: importo, categoria, giorno e una nota.</li><li>Confronto prezzi: nome del prodotto, codice a barre, negozio, prezzo e giorno.</li><li>Visite mediche e vaccini sono <b>dati relativi alla salute</b> (art. 9 GDPR): scrivi solo quello che ti serve per ricordarti la scadenza (per esempio «Visita oculistica»), mai diagnosi, referti o terapie.</li></ul><h4>4. Dove sono e quanto restano</h4><ul><li>Nella memoria privata dell'app sul telefono, che le altre app non possono leggere. È esclusa dal backup automatico di Google, quindi non finisce su cloud.</li><li>Il <b>backup in file</b> è cifrato (AES-256) con la password che scegli tu: senza password nessuno può leggerlo.</li><li>I dati restano finché li tieni tu: puoi cancellare ogni scadenza o spesa con il cestino. Se disinstalli l'app, tutti i dati vengono cancellati.</li></ul><h4>5. Sicurezza</h4><p>Proteggi il telefono con il blocco schermo (PIN, impronta o volto) e usa una password robusta per i backup. Le <b>notifiche</b> mostrano il nome della scadenza: se non vuoi che si legga a telefono bloccato, nelle impostazioni del telefono scegli di nascondere il contenuto delle notifiche di ${NOME}.</p><h4>Blocco con PIN</h4><p>Puoi proteggere l'apertura dell'app con un <b>PIN di 4 cifre</b> (Info → Blocco con PIN): viene chiesto ogni volta che apri l'app e ogni volta che ci torni. Quando lo scegli ricevi un <b>codice di ripristino</b> di 12 caratteri: se dimentichi il PIN, con il codice ne scegli uno nuovo senza perdere i dati. Il PIN e il codice non vengono salvati: sul telefono resta solo un'impronta cifrata (PBKDF2-SHA256 con sale casuale), da cui non si può risalire a loro. Lo sviluppatore <b>non può sbloccare l'app</b> né recuperare il PIN, perché non vede i tuoi dati: se perdi sia il PIN sia il codice di ripristino devi cancellare i dati dell'app e ricaricare un backup con la sua password.</p><h4>6. Trasferimenti</h4><p>L'app non trasferisce dati a nessuno, né in Italia né all'estero. Sei tu a decidere se salvare o mandare un backup.</p><h4>7. I tuoi diritti</h4><p>Hai sempre il pieno controllo: puoi vedere, correggere ed eliminare ogni dato dall'app. Per qualsiasi dubbio sulla protezione dei dati puoi rivolgerti al <b>Garante per la protezione dei dati personali</b> (www.garanteprivacy.it), o all'autorità di controllo del tuo paese nell'Unione Europea.</p><h4>8. Permessi del telefono</h4><ul><li><b>Notifiche</b>: solo per avvisarti delle scadenze, nei giorni e all'ora che scegli tu; puoi spegnerle in Info.</li><li><b>Fotocamera</b>: solo per leggere il codice a barre dei prodotti, quando tocchi «Scansiona». La lettura avviene nel telefono, senza Internet: nessuna foto viene salvata o inviata.</li><li><b>File</b>: solo per salvare e caricare il backup nella cartella Download.</li><li><b>Internet</b>: <b>non richiesto</b>.</li></ul><h4>9. Modifiche</h4><p>Se questa informativa cambia, l'app te lo mostra alla prima apertura dopo l'aggiornamento e ti chiede di leggerla di nuovo.</p>`;
  const CONDIZIONI = `<p class="agg">Versione del 1° novembre 2026.</p><h4>1. Cosa fa l'app</h4><p>${NOME} serve a ricordare le scadenze (casa, auto, salute, vaccini, animali, documenti, tasse), ad annotare le spese di tutti i giorni e a confrontare i prezzi dei prodotti nei negozi. È uno strumento di promemoria e di calcolo.</p><h4>2. Cosa non fa</h4><p>L'app <b>non dà consigli</b> medici, veterinari, legali o fiscali e non sostituisce le comunicazioni ufficiali (ASL, medico, veterinario, ACI, Comune, Agenzia delle Entrate). Le date, gli importi e i prezzi sono <b>solo quelli che inserisci tu</b>: controlla sempre le scadenze reali. I prezzi dei negozi possono cambiare: il confronto vale per i prezzi che hai annotato, nel giorno in cui li hai annotati.</p><h4>3. Le notifiche</h4><p>Le notifiche dipendono anche dal telefono (permessi, risparmio energetico, modalità non disturbare) e potrebbero non arrivare o arrivare in ritardo: <b>non affidarti solo all'app</b> per le scadenze importanti.</p><h4>4. La tua responsabilità</h4><p>Sei responsabile dei dati che inserisci, della loro correttezza, del rispetto delle scadenze, della custodia del telefono, del PIN, dei backup e della loro password.</p><h4>5. Limiti di responsabilità</h4><p>L'app è fornita «così com'è». Nei limiti consentiti dalla legge (art. 1229 c.c.), lo sviluppatore non risponde di scadenze dimenticate o mancate, notifiche non arrivate, errori di inserimento, perdite di dati (per esempio per guasto, smarrimento o disinstallazione), sanzioni, more o danni derivanti dall'uso dell'app. Restano salvi i casi di dolo o colpa grave e i diritti che la legge riconosce ai consumatori (D.Lgs. 206/2005, Codice del Consumo).</p><h4>6. Dati e backup</h4><p>I dati sono solo sul tuo telefono: lo sviluppatore non può recuperarli. Fai backup regolari (Info → Salva backup) e conservane una copia fuori dal telefono.</p><h4>7. Uso consentito</h4><p>Puoi usare l'app per te e per la tua famiglia. Non è consentito copiarla, mod         db.notifiche.attive ? campo('A che ora', oraIn, 'I giorni (30, 7, 3, 1 giorno prima o il giorno stesso) li scegli in ogni scadenza.') : null),
      h('div', { class: 'panel' }, h('h3', null, 'Le tue categorie'),
        h('p', { class: 'muted small', style: { margin: '0 0 8px' } }, 'Crea le categorie che ti servono; tocca una categoria per rinominarla, cambiarle l’icona o eliminarla.'),
        [['scad', 'Scadenze'], ['spese', 'Spese']].map(([t, l]) => h('div', { class: 'mie-cat' }, h('b', null, l),
          h('div', { class: 'mie-cat-l' }, db.mieCat[t].length ? db.mieCat[t].map((c) => h('button', { type: 'button', class: 'chip', onclick: () => apriCategoria(t, c, () => disegna()) }, c.e + ' ' + c.l)) : h('span', { class: 'muted small' }, 'Nessuna categoria creata'),
            h('button', { type: 'button', class: 'chip nuova', onclick: () => apriCategoria(t, null, () => disegna()) }, '＋ Nuova'))))),
      window.ContabilyPin ? ContabilyPin.pannello({ ridisegna: disegna }) : null,
      doc('Privacy e GDPR', PRIVACY),
      doc('Condizioni d’uso', CONDIZIONI + (db.accettatoIl ? '<p class="muted small">Accettate il ' + new Date(db.accettatoIl).toLocaleDateString('it-IT') + '.</p>' : '')),
      h('div', { class: 'panel' }, h('h3', null, 'Backup'), h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, 'Salva scadenze e spese in un file protetto da password e ricaricale su questo o su un altro telefono.'),
        h('div', { class: 'tasti', style: { margin: 0 } },
          h('button', { class: 'btn ghost', onclick: esporta }, svg('giu'), 'Salva backup'),
          h('button', { class: 'btn ghost', onclick: importa }, svg('su'), 'Carica backup'))),
      h('p', { class: 'muted small', style: { textAlign: 'center' } }, NOME + ' · versione ' + VERSIONE));
  }

  // ---------- file e backup cifrato (AES-256-GCM, chiave dalla password con PBKDF2) ----------
  const enc = new TextEncoder();
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function chiaveDa(password, salt) {
    const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function cifra(obj, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await chiaveDa(password, salt), enc.encode(JSON.stringify(obj)));
    return { app: NOME, encrypted: true, kdf: 'PBKDF2-SHA256-200000', cipher: 'AES-256-GCM', salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)), exportedAt: new Date().toISOString() };
  }
  async function decifra(w, password) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(w.iv) }, await chiaveDa(password, unb64(w.salt)), unb64(w.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  async function salvaFile(nome, testo) {
    const Cap = window.Capacitor;
    if (Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Filesystem) {
      const FS = Cap.Plugins.Filesystem; const dati = b64(enc.encode(testo)); let res, dove;
      try {
        try { if (FS.requestPermissions) await FS.requestPermissions(); res = await FS.writeFile({ path: 'Download/ContabilyFamily/' + nome, data: dati, directory: 'EXTERNAL_STORAGE', recursive: true }); dove = 'Download/ContabilyFamily'; }
        catch (e) { res = await FS.writeFile({ path: 'ContabilyFamily/' + nome, data: dati, directory: 'DOCUMENTS', recursive: true }); dove = 'Documenti/ContabilyFamily'; }
        toast('Salvato in ' + dove, 3000);
        if (Cap.Plugins.Share) { try { await Cap.Plugins.Share.share({ title: nome, url: res.uri, dialogTitle: 'Condividi ' + nome }); } catch (e) { /* annullato */ } }
        return true;
      } catch (e) { toast('Non riesco a salvare il file'); return false; }
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([testo], { type: 'application/json' })), download: nome, style: { display: 'none' } });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast('Backup salvato'); return true;
  }
  const chiediPassword = (titolo, conferma) => new Promise((res) => {
    const p1 = h('input', { type: 'password', class: 'testo', autocomplete: 'new-password', placeholder: 'Almeno 8 caratteri', 'aria-label': 'Password' });
    const p2 = conferma ? h('input', { type: 'password', class: 'testo', autocomplete: 'new-password', placeholder: 'Scrivila di nuovo', 'aria-label': 'Ripeti la password' }) : null;
    let fatto = false; const fine = (v) => { if (fatto) return; fatto = true; chiudi(); res(v); };
    const chiudi = foglio(titolo, [h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, conferma ? 'Il backup viene cifrato: senza questa password nessuno può leggerlo, nemmeno tu. Segnatela in un posto sicuro.' : 'Scrivi la password con cui hai salvato il backup.'), campo('Password', p1), p2 ? campo('Ripeti la password', p2) : null],
      () => [h('button', { class: 'btn ghost', onclick: () => fine(null) }, 'Annulla'), h('button', { class: 'btn', onclick: () => { if (p1.value.length < 8) return toast('La password deve avere almeno 8 caratteri'); if (p2 && p2.value !== p1.value) return toast('Le due password non sono uguali'); fine(p1.value); } }, svg('salva'), 'Conferma')], { alChiudere: () => fine(null) });
    setTimeout(() => p1.focus(), 60);
  });
  async function esporta() {
    const pw = await chiediPassword('Backup protetto da password', true); if (!pw) return;
    const w = await cifra({ app: NOME, tipo: 'backup', data: new Date().toISOString(), scadenze: db.scadenze, spese: db.spese, prodotti: db.prodotti, notifiche: db.notifiche, mieCat: db.mieCat }, pw);
    salvaFile('ContabilyFamily_backup_' + oggi() + '.json', JSON.stringify(w));
  }
  function importa() {
    const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
      if (f.size > 10 * 1024 * 1024) return toast('Il file è troppo grande per essere un backup di ' + NOME);
      try {
        let o = JSON.parse(await f.text());
        if (o && o.encrypted) { const pw = await chiediPassword('Backup protetto', false); if (!pw) return; try { o = await decifra(o, pw); } catch (e) { return toast('Password sbagliata'); } }
        if (!o || o.app !== NOME || !Array.isArray(o.scadenze) || !Array.isArray(o.spese)) return toast('Non è un backup di ' + NOME);
        const idS = new Set(db.scadenze.map((x) => x.id)), idP = new Set(db.spese.map((x) => x.id));
        // prima si controlla tutto, poi si tocca l'archivio: un file sbagliato non lascia dati a metà
        const ns = o.scadenze.map(pulisciScad).filter((x) => x && !idS.has(x.id)), np = o.spese.map(pulisciSpesa).filter((x) => x && !idP.has(x.id));
        const idR = new Set(db.prodotti.map((x) => x.id)); const nr = (Array.isArray(o.prodotti) ? o.prodotti : []).map(pulisciProd).filter((x) => x && !idR.has(x.id));
        const nc = { scad: [], spese: [] }; if (o.mieCat && typeof o.mieCat === 'object') ['scad', 'spese'].forEach((t) => (Array.isArray(o.mieCat[t]) ? o.mieCat[t] : []).map(pulisciCat).forEach((c) => { if (c && !db.mieCat[t].some((x) => x.v === c.v) && !nc[t].some((x) => x.v === c.v)) nc[t].push(c); }));
        db.scadenze.push(...ns); db.spese.push(...np); db.prodotti.push(...nr); db.mieCat.scad.push(...nc.scad); db.mieCat.spese.push(...nc.spese);
        if (!salvaDb()) return; programmaNotifiche(); toast(ns.length + ' scadenze e ' + np.length + ' spese caricate'); disegna();
      } catch (e) { toast('File non leggibile'); }
    });
    document.body.append(inp); inp.click();
  }

  // ---------- primo avvio: accettazione delle condizioni ----------
  if (db.accettato < TERMINI_VER) {
    const spunta = h('input', { type: 'checkbox', id: 'accetto' });
    const ok = h('button', { class: 'btn', disabled: true, style: { opacity: '.5' }, onclick: () => { if (!spunta.checked) return; db.accettato = TERMINI_VER; db.accettatoIl = new Date().toISOString(); salvaDb(); chiudi(); disegna(); if (window.ContabilyPin) ContabilyPin.proponi(); } }, svg('salva'), 'Accetto e inizio');
    spunta.addEventListener('change', () => { ok.disabled = !spunta.checked; ok.style.opacity = spunta.checked ? '1' : '.5'; });
    const chiudi = foglio(db.accettato ? 'Privacy e condizioni aggiornate' : 'Benvenuto in ' + NOME, [
      h('p', { style: { margin: '0 0 8px' } }, db.accettato ? 'Abbiamo aggiornato l’informativa privacy e le condizioni d’uso per il confronto prezzi (la fotocamera serve solo a leggere i codici a barre). Le quattro cose chiare restano queste:' : 'Prima di iniziare, quattro cose chiare:'),
      h('ul', { class: 'punti' },
        h('li', null, h('b', null, 'I dati restano sul telefono.'), ' L’app non usa Internet e non ha server: nessuno, nemmeno lo sviluppatore, riceve o vede i tuoi dati.'),
        h('li', null, h('b', null, 'Per visite e vaccini'), ' scrivi solo quello che ti serve per ricordare la scadenza, mai diagnosi o referti.'),
        h('li', null, h('b', null, 'L’app è un promemoria:'), ' le notifiche possono non arrivare, controlla sempre le scadenze importanti.'),
        h('li', null, h('b', null, 'Fai backup regolari:'), ' se perdi il telefono o disinstalli l’app, i dati non si possono recuperare. I backup sono protetti dalla password che scegli tu.')),
      h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, 'Subito dopo potrai scegliere un PIN di 4 cifre che verrà chiesto ogni volta che apri l’app.'),
      h('div', { class: 'docs' }, doc('Leggi l’informativa privacy e GDPR', PRIVACY), doc('Leggi le condizioni d’uso', CONDIZIONI))],
    () => [h('label', { class: 'riga-spunta', for: 'accetto', style: { width: '100%', padding: '2px 2px 4px', fontWeight: '600' } }, h('span', null, 'Ho letto l’informativa privacy e accetto le condizioni d’uso.'), spunta), ok], { fisso: true });
  }
  try { disegna(); } catch (e) { app.replaceChildren(h('div', { class: 'vuoto', style: { padding: '24px' } }, h('b', null, 'Qualcosa non va nei dati salvati.'), h('br'), 'Puoi ricaricare un backup o azzerare l’archivio.', h('br'), h('button', { class: 'btn', style: { marginTop: '12px' }, onclick: () => { scheda = 'info'; disegna(); } }, 'Vai a Info'), h('button', { class: 'btn ghost', style: { marginTop: '8px' }, onclick: async () => { if (await chiedi('Azzerare tutto l’archivio di ' + NOME + '?', 'Azzera')) { try { localStorage.removeItem(CHIAVE); } catch (x) { /* */ } location.reload(); } } }, 'Azzera i dati'))); }
  if (db.accettato >= TERMINI_VER) programmaNotifiche();
  // al ritorno nell'app (anche il giorno dopo): notifiche riprogrammate e schermata aggiornata se è cambiato il giorno
  let giornoDisegnato = oggi();
  document.addEventListener('visibilitychange', () => { if (document.visibilityState !== 'visible') return; programmaNotifiche(); if (oggi() !== giornoDisegnato) { giornoDisegnato = oggi(); try { disegna(); } catch (e) { /* */ } } });
})();
</script>
