      const ps = sh.landscape ? '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>' : '';
      const maxCols = Math.max(1, ...sh.rows.map((r) => r.length));
      const dim = `<dimension ref="A1:${colName(maxCols - 1)}${Math.max(1, sh.rows.length)}"/>`;
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${pr}${dim}<sheetViews><sheetView workbookViewId="0"${sh.freeze ? '><pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) + '" activePane="bottomLeft" state="frozen"/></sheetView' : '/'}></sheetViews><cols>${cols}</cols><sheetData>${rows}</sheetData>${merges}${ps}</worksheet>`;
    };
    // i fogli vanno generati prima di styles.xml, che contiene gli stili creati al volo
    const sheetXmls = sheets.map(sheetXml);
    const files = [];
    files.push({ name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>` });
    files.push({ name: '_rels/.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/package/2006/relationships/metadata/core-properties" Target="docProps/core.xml"/><Relationship Id="rId3" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/extended-properties" Target="docProps/app.xml"/></Relationships>` });
    files.push({ name: 'docProps/app.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>ContabilyTab</Application></Properties>` });
    files.push({ name: 'docProps/core.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>ContabilyTab</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString()}</dcterms:created></cp:coreProperties>` });
    files.push({ name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` });
    files.push({ name: 'xl/_rels/workbook.xml.rels', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${sheets.map((s, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${sheets.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/><Relationship Id="rId${sheets.length + 2}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/sharedStrings" Target="sharedStrings.xml"/></Relationships>` });
    files.push({ name: 'xl/styles.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="3"><numFmt numFmtId="164" formatCode="#,##0.00\\ &quot;€&quot;"/><numFmt numFmtId="165" formatCode="dd/mm/yyyy"/><numFmt numFmtId="166" formatCode="0.0%"/></numFmts><fonts count="${fonts.length}">${fonts.join('')}</fonts><fills count="${fills.length}">${fills.join('')}</fills><borders count="${borders.length}">${borders.join('')}</borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="${xfs.length}">${xfs.join('')}</cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles><dxfs count="0"/><tableStyles count="0" defaultTableStyle="TableStyleMedium2" defaultPivotStyle="PivotStyleLight16"/></styleSheet>` });
    sheetXmls.forEach((x, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: x }));
    files.push({ name: 'xl/sharedStrings.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><sst xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" count="${sst.length}" uniqueCount="${sst.length}">${sst.map((s) => `<si><t xml:space="preserve">${xmlEsc(s)}</t></si>`).join('')}</sst>` });
    return CT.zip(files);
  };

  // ---------- PDF (testo + tabelle, font Helvetica WinAnsi) ----------
  const WIN = { '€': 0x80, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '–': 0x96, '—': 0x97, '…': 0x85 };
  const pdfStr = (s) => { let out = ''; for (const ch of String(s)) { let c = ch.charCodeAt(0); if (WIN[ch] != null) c = WIN[ch]; else if (c > 255) c = 63; out += c === 0x28 || c === 0x29 || c === 0x5c ? '\\' + ch : c < 32 || c > 126 ? '\\' + c.toString(8).padStart(3, '0') : ch; } return '(' + out + ')'; };
  // larghezze Helvetica approssimate (per allineamento a destra)
  const HW = { ' ': 278, '!': 278, '"': 355, '#': 556, '$': 556, '%': 889, '&': 667, "'": 191, '(': 333, ')': 333, '*': 389, '+': 584, ',': 278, '-': 333, '.': 278, '/': 278, ':': 278, ';': 278, '<': 584, '=': 584, '>': 584, '?': 556, '@': 1015, '[': 278, ']': 278, '_': 556, '€': 556, 'i': 222, 'j': 222, 'l': 222, 'f': 278, 't': 278, 'r': 333, 'I': 278, 'm': 833, 'w': 722, 'M': 833, 'W': 944 };
  const tw = (s, size) => { let w = 0; for (const ch of String(s)) w += HW[ch] != null ? HW[ch] : /[0-9a-z]/.test(ch) ? 556 : /[A-Z]/.test(ch) ? 667 : 556; return (w / 1000) * size; };
  CT.pdfWidth = tw;

  // doc: {title, subtitle, meta:[], sections:[{heading, lines:[], table:{head:[], rows:[[]], align:[], widths:[]}}], footer}
  CT.pdf = function (doc) {
    const PW = 595.28, PH = 841.89, M = 40;
    const pages = []; let ops = []; let y = PH - M;
    const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = PH - M; };
    const ensure = (h) => { if (y - h < M + 20) { newPage(); } };
    const text = (s, x, yy, size = 10, bold = false, color = '0 0 0') => ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${color} rg ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
    const line = (x1, y1, x2, y2, w = 0.5, color = '0.8 0.8 0.8') => ops.push(`${color} RG ${w} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    const rect = (x, yy, w, h, color) => ops.push(`${color} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    const wrap = (s, size, maxW) => { const words = String(s).split(/\s+/); const lines = []; let cur = ''; words.forEach((w) => { const t = cur ? cur + ' ' + w : w; if (tw(t, size) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }); if (cur) lines.push(cur); return lines; };
    newPage();
    // intestazione
    rect(0, PH - 70, PW, 70, '0.918 0.949 0.996');
    text('ContabilyTab', M, PH - 32, 20, true, '0.078 0.188 0.769');
    text(doc.title || '', M, PH - 52, 13, true, '0.09 0.125 0.227');
    if (doc.subtitle) text(doc.subtitle, PW - M - tw(doc.subtitle, 10), PH - 32, 10, false, '0.3 0.3 0.3');
    y = PH - 90;
    (doc.meta || []).forEach((m) => { text(m, M, y, 9, false, '0.35 0.35 0.35'); y -= 12; });
    y -= 6;
    (doc.sections || []).forEach((sec) => {
      if (sec.heading) { ensure(30); y -= 8; text(sec.heading, M, y, 12, true, '0.078 0.188 0.769'); y -= 6; line(M, y, PW - M, y, 1, '0.078 0.188 0.769'); y -= 14; }
      (sec.lines || []).forEach((l) => { wrap(l, 10, PW - 2 * M).forEach((ln) => { ensure(14); text(ln, M, y, 10); y -= 13; }); });
      if (sec.table) {
        const t = sec.table; const ncol = t.head.length; const totalW = PW - 2 * M;
        const widths = t.widths ? t.widths.map((w) => (w / t.widths.reduce((a, b) => a + b, 0)) * totalW) : t.head.map(() => totalW / ncol);
        const align = t.align || t.head.map((_, i) => (i === 0 ? 'l' : 'r'));
        const drawHead = () => { rect(M, y - 4, totalW, 16, '0.918 0.949 0.996'); let x = M; t.head.forEach((h, i) => { const s = String(h); text(s, align[i] === 'r' ? x + widths[i] - 4 - tw(s, 9) : x + 4, y, 9, true); x += widths[i]; }); y -= 16; };
        ensure(40); drawHead();
        t.rows.forEach((r, ri) => {
          ensure(15); if (y === PH - M) drawHead();
          const bold = t.boldLast && ri === t.rows.length - 1;
          if (bold) rect(M, y - 4, totalW, 15, '0.95 0.95 0.95');
          let x = M; r.forEach((c, i) => { let s = String(c == null ? '' : c); while (tw(s, 9) > widths[i] - 8 && s.length > 3) s = s.slice(0, -2) + '…'; text(s, align[i] === 'r' ? x + widths[i] - 4 - tw(s, 9) : x + 4, y, 9, bold); x += widths[i]; });
          line(M, y - 4, PW - M, y - 4, 0.3, '0.88 0.88 0.88'); y -= 15;
        });
        y -= 6;
      }
    });
    if (ops.length) pages.push(ops);
    // assemblaggio
    const objs = [];
    const add = (s) => { objs.push(s); return objs.length; };
    const fontN = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const fontB = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesIdx = add('');
    const pageIds = pages.map((p, i) => {
      const footer = (doc.footer || 'Generato con ContabilyTab') + ' · pagina ' + (i + 1) + ' di ' + pages.length;
      const content = p.join('\n') + `\nBT /F1 8 Tf 0.45 0.45 0.45 rg ${M} 22 Td ${pdfStr(footer)} Tj ET`;
      const cid = add(`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream`);
      return add(`<< /Type /Page /Parent ${pagesIdx} 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${fontN} 0 R /F2 ${fontB} 0 R >> >> /Contents ${cid} 0 R >>`);
    });
    objs[pagesIdx - 1] = `<< /Type /Pages /Kids [${pageIds.map((i) => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    const catalog = add(`<< /Type /Catalog /Pages ${pagesIdx} 0 R >>`);
    const info = add(`<< /Producer (ContabilyTab) /Title ${pdfStr(doc.title || 'Documento')} /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`);
    let out = '%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'; const offsets = [];
    const bytes = (s) => { let n = 0; for (const ch of s) n += ch.charCodeAt(0) > 127 ? 1 : 1; return n; };
    objs.forEach((o, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('') + `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    void bytes;
    const u8 = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) u8[i] = out.charCodeAt(i) & 0xff;
    return u8;
  };

  // ---------- Cifratura backup (AES-256-GCM, chiave da password con PBKDF2) ----------
  const b64 = (u8) => { let s = ''; u8.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function deriveKey(password, salt) {
    const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  CT.encryptBackup = async function (obj, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    return JSON.stringify({ app: 'ContabilyTab', encrypted: true, kdf: 'PBKDF2-SHA256-200000', cipher: 'AES-256-GCM', salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)), exportedAt: new Date().toISOString() });
  };
  CT.decryptBackup = async function (wrapper, password) {
    const key = await deriveKey(password, unb64(wrapper.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(wrapper.iv) }, key, unb64(wrapper.data));
    return JSON.parse(new TextDecoder().decode(pt));
  };

  // ---------- salvataggio / condivisione file ----------
  const MIME = { xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', pdf: 'application/pdf', json: 'application/json', ctab: 'application/json', csv: 'text/csv', txt: 'text/plain' };
  CT.saveFile = async function (filename, data, { share = true } = {}) {
    const ext = filename.split('.').pop().toLowerCase();
    const mime = MIME[ext] || 'application/octet-stream';
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    // 1) App nativa (Capacitor): scrive nella cartella Documenti e apre il foglio di condivisione
    const Cap = window.Capacitor;
    if (Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Filesystem) {
      try {
        const buf = new Uint8Array(await blob.arrayBuffer());
        const FS = Cap.Plugins.Filesystem; let res, where;
        if (Cap.getPlatform && Cap.getPlatform() === 'android') {
          // Android: cartella Download del telefono (visibile in "Archivio" / "I miei file")
          try { if (FS.requestPermissions) await FS.requestPermissions(); res = await FS.writeFile({ path: 'Download/ContabilyTab/' + filename, data: b64(buf), directory: 'EXTERNAL_STORAGE', recursive: true }); where = 'Download/ContabilyTab/' + filename; }
          catch (e) { res = await FS.writeFile({ path: 'ContabilyTab/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true }); where = 'Documents/ContabilyTab/' + filename; }
        } else { res = await FS.writeFile({ path: 'ContabilyTab/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true }); where = 'File/ContabilyTab/' + filename; }
        if (share) {
          // 1) apre subito il file con l'app del telefono (PDF, Excel…) se il plugin FileOpener è presente nell'app installata
          const opened = await CT.openFile(res.uri, mime).catch((e) => { console.warn('Apertura file non riuscita', e); return false; });
          // 2) altrimenti il foglio di sistema: da qui si può scegliere l'app con cui aprirlo (Acrobat, Excel, Fogli…) o condividerlo
          if (!opened && Cap.Plugins.Share) { CT.toast('Salvato in ' + where); await Cap.Plugins.Share.share({ title: filename, url: res.uri, dialogTitle: 'Apri o condividi ' + filename }); }
        }
        return { ok: true, where };
      } catch (e) { console.warn('Salvataggio nativo non riuscito', e); }
    }
    // 2) Anteprima su claude.ai: capacità downloads
    try {
      if (window.claude && window.claude.use) {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: blob }); return { ok: true, where: filename }; }
      }
    } catch (e) { if (e && e.code === 'declined') return { ok: false, declined: true }; if (e && e.code && e.code !== 'unavailable' && e.code !== 'not_granted') return { ok: false, error: e.message || e.code }; console.warn(e); }
    // 3) Browser: download diretto nella cartella Download; condivisione nativa solo se richiesta
    try {
      if (share === 'share' && navigator.canShare && navigator.share) {
        const f = new File([blob], filename, { type: mime });
        if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return { ok: true, where: filename }; }
      }
    } catch (e) { if (e && e.name === 'AbortError') return { ok: false, declined: true }; }
    const url = URL.createObjectURL(blob);
    const a = CT.h('a', { href: url, download: filename, style: { display: 'none' } });
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    return { ok: true, where: filename };
  };

  // Apre un file salvato con l'app predefinita del telefono (lettore PDF, Excel, Fogli…).
  // Richiede il plugin nativo @capacitor-community/file-opener nell'app installata; senza plugin ritorna false.
  CT.openFile = async (uri, mime) => {
    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FileOpener;
    if (!P || !uri) return false;
    let filePath = String(uri);
    if (filePath.startsWith('file://')) { try { filePath = decodeURI(filePath.slice(7)); } catch (e) { filePath = filePath.slice(7); } }
    await P.open({ filePath, contentType: mime || 'application/octet-stream', openWithDefault: true });
    return true;
  };

  // salvataggio silenzioso (solo app installata), usato dal backup automatico: nessuna finestra di condivisione
  CT.saveFileNative = async function (filename, data) {
    const Cap = window.Capacitor;
    if (!(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Filesystem)) return { ok: false };
    const FS = Cap.Plugins.Filesystem;
    const buf = typeof data === 'string' ? enc.encode(data) : data;
    try {
      if (Cap.getPlatform && Cap.getPlatform() === 'android') {
        try { if (FS.requestPermissions) await FS.requestPermissions(); await FS.writeFile({ path: 'Download/ContabilyTab/' + filename, data: b64(buf), directory: 'EXTERNAL_STORAGE', recursive: true }); return { ok: true, where: 'Download/ContabilyTab/' + filename }; }
        catch (e) { await FS.writeFile({ path: 'ContabilyTab/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true }); return { ok: true, where: 'Documents/ContabilyTab/' + filename }; }
      }
      await FS.writeFile({ path: 'ContabilyTab/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true });
      return { ok: true, where: 'File/ContabilyTab/' + filename };
    } catch (e) { console.warn('Salvataggio automatico non riuscito', e); return { ok: false, error: String((e && e.message) || e) }; }
  };

  CT.pickFile = (accept) => new Promise((res) => {
    const inp = CT.h('input', { type: 'file', accept, style: { display: 'none' } });
    inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); res(f || null); });
    document.body.appendChild(inp);
    inp.click();
    // se l'utente annulla, l'evento change non arriva: rimuovi dopo un po'
    setTimeout(() => { if (document.body.contains(inp)) { /* lasciato: alcuni browser inviano change in ritardo */ } }, 60000);
  });
  CT.readFileText = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
  CT.readFileDataURL = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(file); });
  // riduce un'immagine (allegati fattura) per non appesantire l'archivio
  CT.shrinkImage = (file, max = 1400) => new Promise((res) => {
    if (!/^image\//.test(file.type)) return CT.readFileDataURL(file).then(res);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height)); const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.8)); };
    img.onerror = () => { URL.revokeObjectURL(url); CT.readFileDataURL(file).then(res); };
    img.src = url;
  });
})();

/* ContabilyTab — integrazione con il dispositivo: notifiche locali, lettura barcode, tema */
(function () {
  'use strict';
  const CT = window.CT;
  const Cap = () => window.Capacitor;
  const isNative = () => !!(Cap() && Cap().isNativePlatform && Cap().isNativePlatform());
  CT.isNative = isNative;
  const plugin = (n) => (Cap() && Cap().Plugins && Cap().Plugins[n]) || null;

  // ---------- Notifiche locali ----------
  CT.notif = {
    async permission() {
      const LN = plugin('LocalNotifications');
      if (LN) { try { let p = await LN.checkPermissions(); if (p.display !== 'granted') p = await LN.requestPermissions(); return p.display === 'granted'; } catch (e) { return false; } }
      if ('Notification' in window) { if (Notification.permission === 'granted') return true; if (Notification.permission !== 'denied') { try { return (await Notification.requestPermission()) === 'granted'; } catch (e) { return false; } } }
      return false;

  // ---------- BACKUP ----------
  // ---------- Password dei backup ----------
  // Ogni backup (manuale o automatico) viene cifrato con questa password (AES-256-GCM). La password resta nell'area privata
  // dell'app su questo dispositivo e non viene mai scritta nei file di backup: serve per riaprirli (anche su un altro telefono).
  CT.backupPwd = () => String(S().backupPwd || '');
  CT.backupPwdSet = () => CT.backupPwd().length >= 6;
  const pwdSheet = ({ title, intro, ok }) => new Promise((res) => {
    let done = false;
    const a = h('input', { type: 'password', id: 'bkp-a', autocomplete: 'new-password', placeholder: 'Almeno 6 caratteri' });
    const b = h('input', { type: 'password', id: 'bkp-b', autocomplete: 'new-password', placeholder: 'Ripeti la password' });
    const show = h('input', { type: 'checkbox', id: 'bkp-show' });
    show.addEventListener('change', () => { a.type = b.type = show.checked ? 'text' : 'password'; });
    const err = h('p', { class: 'small', style: { color: 'var(--red)', margin: '0', minHeight: '1.3em' }, role: 'alert' });
    const go = async () => {
      const p = a.value, q = b.value;
      if (p.length < 6) { err.textContent = 'La password deve avere almeno 6 caratteri.'; a.focus(); return; }
      if (p !== q) { err.textContent = 'Le due password non coincidono.'; b.focus(); return; }
      done = true; s.close(); res(p);
    };
    [a, b].forEach((x) => x.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); go(); } }));
    const s = CT.sheet({ title, color: 'blue', body: h('div', null,
      intro ? h('p', { class: 'small muted', style: { margin: '0 0 10px' } }, intro) : null,
      h('div', { class: 'fgrid' }, h('div', { class: 'field' }, h('label', { for: 'bkp-a' }, 'Password dei backup'), a), h('div', { class: 'field' }, h('label', { for: 'bkp-b' }, 'Ripeti la password'), b)),
      h('label', { class: 'small', for: 'bkp-show', style: { display: 'flex', gap: '8px', alignItems: 'center', margin: '8px 0 6px' } }, show, 'Mostra le password'),
      err,
      h('div', { class: 'notice', style: { marginTop: '8px' } }, CT.svg('warning'), h('span', null, 'Scrivila in un posto sicuro fuori dal telefono: senza questa password i file di backup non si possono riaprire, nemmeno dallo sviluppatore.'))),
      footer: [h('button', { class: 'btn ghost', onclick: () => s.close() }, 'Annulla'), h('button', { class: 'btn', onclick: go }, ok || 'Salva')], onClose: () => { if (!done) res(null); } });
  });
  // imposta (o cambia) la password: le copie automatiche vengono riscritte subito, così in Download non resta nessuna copia leggibile
  CT.setBackupPwd = async function (opts = {}) {
    const first = !CT.backupPwdSet();
    const p = await pwdSheet({ title: first ? 'Imposta la password dei backup' : 'Cambia la password dei backup',
      intro: opts.intro || (first ? 'Da questa versione ogni backup, anche quello automatico, viene salvato cifrato: senza password nessuno può leggere i tuoi dati dal file.' : 'I backup già creati restano apribili solo con la vecchia password; le copie automatiche vengono rifatte subito con quella nuova.'),
      ok: first ? 'Attiva backup cifrati' : 'Cambia password' });
    if (p == null) return false;
    await DB().saveSettings({ backupPwd: p });
    CT.toast(first ? 'Password impostata: i backup sono cifrati' : 'Password dei backup cambiata');
    await CT.autoBackup({ force: true, both: true });
    return true;
  };
  CT.removeBackupPwd = async function () {
    if (!(await CT.confirm('Senza password l’app non salva più backup automatici e i backup manuali li dovrai cifrare uno per uno. Vuoi davvero rimuoverla?', { ok: 'Rimuovi password', danger: true }))) return false;
    await DB().saveSettings({ backupPwd: '' });
    CT.toast('Password dei backup rimossa: backup automatico in pausa');
    return true;
  };
  let pwdAsked = false;
  // chiede la password una sola volta per sessione, quando serve e quando non ci sono altre finestre aperte
  CT.askBackupPwdIfNeeded = async function () {
    if (pwdAsked || CT.backupPwdSet() || DB().isEmpty() || !S().accepted || CT.sheets.length || (CT.lock && CT.lock.isLocked())) return false;
    pwdAsked = true;
    return CT.setBackupPwd();
  };

      if (Math.random() < 0.3) rc.push(D({ date: d, tipo: Math.random() < 0.5 ? 'complementi' : 'svapo', prodotto: ['Accendino', 'Cartine', 'Filtri', 'Liquido 10ml', 'Pod ricambio'][Math.floor(Math.random() * 5)], quantita: Math.ceil(Math.random() * 10), ricavo: rnd(10, 60), costo: rnd(5, 30) }));

/* ContabilyTab — blocco dell'app con PIN (e impronta nell'app installata). Blocca l'apertura: non cifra l'archivio. */

    async available() { try { const nb = plugin('NativeBiometric'); if (nb && CT.isNative()) { const r = await nb.isAvailable(); return !!(r && r.isAvailable); } } catch (e) { /* non disponibile */ } return false; },
    async verify() { try { const nb = plugin('NativeBiometric'); if (!nb) return false; await nb.verifyIdentity({ reason: 'Sblocca ContabilyTab', title: 'Sblocca ContabilyTab' }); return true; } catch (e) { return false; } },

  CT.inserimento = (id) => CT.inserimenti().find((d) => d.id === id) || null;

        altriPos.length ? h('div', { class: 'list', style: { marginTop: 0, marginBottom: '12px' } }, altriPos.map((r) => h('button', { class: 'item c-blue', onclick: () => { st.posEdit = r.id; draw(); } }, h('div', { class: 'dot' }, CT.svg('pos')), h('div', { class: 'mid' }, h('b', null, r.terminale || 'POS'), h('small', null, 'già inserito · tocca per correggere')), h('div', { class: 'amt' }, CT.eur(r.importo))))) : null,
        form.el,
        h('div', { class: 'btn-row', style: { marginTop: '14px' } },
          st.i > 0 ? h('button', { class: 'btn ghost', style: { flex: '0 0 auto', padding: '0 12px' }, 'aria-label': 'Passo precedente', onclick: () => { st.posEdit = null; st.i--; draw(); } }, CT.svg('chevL')) : null,
          h('button', { class: 'btn ghost', onclick: () => { st.posEdit = null; st.i++; draw(); } }, rec ? 'Lascia così' : 'Salta'),
          p.k === 'pos' && prossimoPos ? h('button', { class: 'btn', onclick: async () => { if (await salva()) { st.posEdit = null; draw(); } } }, CT.svg('check'), 'Salva, poi ' + prossimoPos) : null,
          h('button', { class: 'btn' + (p.k === 'pos' && prossimoPos ? ' ghost' : ''), onclick: async () => { if (await salva()) { st.posEdit = null; st.i++; draw(); } } }, CT.svg('check'), (rec ? 'Aggiorna' : 'Salva') + ' e avanti')),
        p.k === 'pos' && !prossimoPos ? h('button', { class: 'link', style: { marginTop: '10px' }, onclick: async () => { if (form.val('importo') || rec) { if (!(await salva())) return; } const nome = await CT.chiediTesto('Nome del nuovo terminale POS', 'POS ' + (terminali.length + 1)); if (!nome) return; await DB().saveSettings({ terminaliPos: [...terminali, nome.trim()] }); st.posEdit = null; draw(); } }, '+ Aggiungi un altro terminale POS') : null));
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
    const drawRiepilogo = () => {
      const d = st.d; const stt = CT.statoGiornata(d);
      const chiusure = DB().byDate('chiusure', d).filter((r) => CT.routeOn('chiusura-' + r.tipo));
      const aggi = CT.sum(chiusure.filter((r) => r.tipo !== 'servizi'), CT.aggioDi);
      const corr = CT.sum(DB().byDate('corrispettivi', d), 'importo');
      const pos = CT.sum(DB().byDate('pos', d), 'importo');
      const q = DB().byDate('quadrature', d)[0];
      const rows = stt.passi.map((p) => {
        const r = recDi(p, d); let val = '—', sub = 'non inserito';
        if (r) {
          if (p.k === 'corrispettivi') { val = CT.eur(r.importo); sub = [r.contanti ? 'contanti ' + CT.eur(r.contanti) : null, r.pos ? 'POS ' + CT.eur(r.pos) : null].filter(Boolean).join(' · ') || 'totale del giorno'; }
          else if (p.col === 'chiusure') { val = CT.eur(r.importo); sub = (p.tipo === 'servizi' ? 'compenso ' : 'aggio ') + CT.eur(CT.aggioDi(r)) + (r.vincite ? ' · vincite ' + CT.eur(r.vincite) : ''); }
          else if (p.k === 'pos') { const tutti = DB().byDate('pos', d); val = CT.eur(CT.sum(tutti, 'importo')); const df = CT.posDiff(r); sub = (tutti.length > 1 ? tutti.map((x) => (x.terminale || 'POS') + ' ' + CT.eur(x.importo)).join(' · ') + ' · ' : '') + (df == null ? 'senza confronto' : df === 0 ? 'quadra con la cassa' : 'differenza ' + (df > 0 ? '+' : '') + CT.eur(df)); }
          else if (p.k === 'cassa') { val = CT.eur(r.contanteSera || 0); sub = 'lasciato in cassa la sera' + (r.prelievo ? ' · prelievo ' + CT.eur(r.prelievo) : ''); }
          else if (p.k === 'quadratura') { const df = r.differenza || 0; val = (df > 0 ? '+' : '') + CT.eur(df); sub = (df === 0 ? 'la cassa quadra' : df < 0 ? 'ammanco' : 'eccedenza') + ' · contati ' + CT.eur(r.contati); }
        }
        return h('button', { class: 'item c-' + p.color, onclick: () => { st.i = stt.passi.indexOf(p); draw(); } }, h('div', { class: 'dot' }, CT.svg(p.icon)), h('div', { class: 'mid' }, h('b', null, p.l), h('small', null, sub)), h('div', { class: 'amt' }, val, r ? null : h('small', null, 'tocca per inserire')));
      });
      cont.appendChild(h('div', { class: 'panel c-' + (stt.completa ? 'green' : 'orange') },
        h('div', { class: 'passo-h' }, h('div', { class: 'ic' }, CT.svg(stt.completa ? 'check' : 'clock')), h('div', null, h('small', null, 'Riepilogo'), h('h3', null, stt.completa ? 'Giornata chiusa' : stt.n + ' passi su ' + stt.tot + ' inseriti'), h('small', { style: { textTransform: 'none', letterSpacing: 0 } }, CT.dateLong(d)))),
        h('div', { class: 'kpis' },
          CT.kpi('Corrispettivi', CT.eur(corr), { main: true, color: 'blue' }),
          CT.kpi('Aggi del giorno', CT.eur(aggi), { color: 'green', sub: chiusure.length ? chiusure.map((r) => CT.TIPI[r.tipo].label).join(', ') : 'nessuna chiusura' }),
          CT.kpi('POS', CT.eur(pos)),
          CT.kpi('Quadratura', q ? ((q.differenza || 0) > 0 ? '+' : '') + CT.eur(q.differenza || 0) : '—', { sub: q ? ((q.differenza || 0) === 0 ? 'la cassa quadra' : q.differenza < 0 ? 'ammanco' : 'eccedenza') : 'da fare' })),
        h('div', { class: 'list' }, rows),
        h('div', { class: 'btn-row', style: { marginTop: '14px' } },
          h('button', { class: 'btn ghost', onclick: () => CT.condividiTesto('Chiusura del ' + CT.dateIT(d), testoRiepilogo(d)) }, CT.svg('share'), 'Condividi'),
          h('button', { class: 'btn', onclick: () => CT.go('home') }, CT.svg('check'), 'Torna alla Home'))));
    };

/* ContabilyTab — Manuale dentro l'app (richiesta del 26/10/2026): capitoli, ricerca nel testo, collegamenti alle funzioni */
(function () {
  'use strict';
  const CT = window.CT;
  const h = CT.h;

  // ogni capitolo: titolo, icona, colore, (route della funzione), testo in HTML. I link «#nome» aprono direttamente la funzione.
  CT.MANUALE = [
    { k: 'intro', t: 'Che cos’è ContabilyTab', icon: 'info', color: 'blue', html: `
<p>ContabilyTab è il gestionale per tabaccheria, bar e bar tabacchi: ogni sera inserisci in pochi tocchi gli incassi e le chiusure, e l'app tiene i conti del mese, gli aggi, le spese, i turni e tutto il resto.</p>
<p><b>I dati restano sul telefono.</b> L'app non ha server, non chiede il permesso di usare internet e non manda niente a nessuno: né a Google, né allo sviluppatore. Escono solo i file che decidi tu di esportare (backup, Excel, PDF). Per questo il <a href="#backup">backup</a> è importante: se perdi il telefono, i dati si recuperano solo da lì.</p>
<p>Il manuale è diviso in capitoli: tocca un titolo per aprirlo, oppure scrivi una parola nella ricerca qui sopra. I link azzurri aprono direttamente la funzione di cui si parla.</p>` },

    { k: 'attivita', t: 'Prima apertura: che locale hai', icon: 'store', color: 'blue', route: 'moduli', html: `
<p>Alla prima apertura scegli il tipo di attività: <b>Tabaccheria</b>, <b>Bar</b> o <b>Bar Tabacchi</b>. In Home trovi le tre tessere colorate e puoi cambiare quando vuoi: toccandone una compare «Modalità … attivata». Toccando quella già attiva si apre <a href="#moduli">Tipo di attività</a>.</p>
<p>In <a href="#moduli">Altro → Tipo di attività</a> accendi o spegni le singole voci: <b>Tabacchi</b>, <b>Lotto e giochi</b> (Lotto, SuperEnalotto, 10eLotto…), <b>Gratta e Vinci</b>, <b>Servizi</b> (ricariche, bollettini, pagamenti), <b>Bar</b>. Le voci spente spariscono da tasti, contatori, controlli dei dati mancanti e riepiloghi: un bar col Lotto accende «Lotto e giochi», un bar senza Gratta e Vinci li spegne.</p>
<p>Nella stessa pagina scrivi i <b>terminali POS</b> che hai (es. «POS 1 · tabacchi e corrispettivi, POS 2 · lotterie») e, per il bar, i nomi di <b>tavoli e banco</b>.</p>
<p>Completa poi <a href="#dati-attivita">Dati attività</a> (insegna, partita IVA, numero rivendita), <a href="#dati-titolare">Dati titolare</a> (il nome serve per il saluto in Home) e <a href="#percentuali-aggi">Percentuali aggi</a>.</p>` },

    { k: 'home', t: 'La Home', icon: 'home', color: 'blue', route: 'home', html: `
<p>In alto: l'<b>ora</b>, il tasto <b>Manuale</b> (questo), il tasto <b>Cerca</b> (scrivi una parola e trovi qualsiasi funzione), il <b>menu laterale</b> (≡) con tutte le voci e la <b>campanella</b> con gli avvisi (dati mancanti, scadenze).</p>
<p>Sotto il saluto ci sono le tre tessere dell'attività, il tasto <b>Turni</b> e il selettore <b>Oggi</b>, che sceglie il mese mostrato nel riepilogo. Poi il tasto grande <a href="#chiusura-giornata"><b>Chiudi la giornata</b></a>, con la barra dei passi già fatti.</p>
<p>Se mancano dati di un giorno di apertura compare la striscia rossa <b>«Dati mancanti»</b>: tocca «Vedi» per inserirli.</p>
<p><b>Riepilogo del mese</b>: le card con corrispettivi, aggi (tabacchi, Lotto, Gratta e Vinci), incasso bar e spese, con la variazione rispetto al mese precedente. Il pallino in alto a destra di ogni card dice se il dato di oggi è già inserito (verde) o ancora da inserire (arancione). Tocca una card per aprire la funzione.</p>
<p><b>Andamento</b>: le barre degli incassi lordi degli ultimi 7 giorni di apertura, il mese in corso rispetto allo stesso mese dell'anno scorso (corrispettivi, aggi, bar) e l'<b>obiettivo del mese</b>: tocca «Imposta un obiettivo» (o la barra) e scegli una cifra su corrispettivi, aggi, incasso lordo o bar; la barra si riempie e ti dice quanto manca e quanto serve al giorno nei giorni di apertura rimasti.</p>
<p><b>Colore</b>: la Home vira sul blu in Tabaccheria, sul marrone con il Bar e sul verde con Bar Tabacchi, così vedi subito in che modalità sei.</p>
<p><b>I tuoi preferiti</b>: fino a 8 funzioni con tasti più grandi; si scelgono con «Scegli i preferiti». <b>Azioni rapide</b>: tutti i tasti di inserimento; con «Ordina» li metti nell'ordine che vuoi (tieni premuto ⠿ e trascina).</p>
<p>La <b>barra in basso</b> ha cinque tasti: <b>Home</b>; <b>Inserisci</b> (il cerchio al centro: scegli cosa inserire, dai corrispettivi alle chiusure, POS, cassa, spese, comande e prodotti; le voci di oggi già fatte hanno la spunta e si possono correggere); <b>Chiusura</b> (la chiusura guidata della giornata, col pallino che conta i passi fatti, es. 3/8, e la spunta verde a giornata chiusa); <b>Listino</b> (listino tabacchi, listino bar o archivio prodotti secondo la modalità); <b>Altro</b>.</p>` },

    { k: 'giornata', t: 'Chiudi la giornata (la sera, in sequenza)', icon: 'moon', color: 'blue', route: 'chiusura-giornata', html: `
<p>Il tasto <a href="#chiusura-giornata"><b>Chiudi la giornata</b></a> ti porta nell'ordine giusto attraverso i dati della sera: <b>Corrispettivi → Chiusura Tabacchi → Lotto → Gratta e Vinci → Servizi → POS → Cambio in cassa → Quadratura cassa → Riepilogo</b>. Compaiono solo le voci accese nella tua modalità.</p>
<p>Ogni passo ha gli stessi campi della funzione normale. <b>Salva e avanti</b> registra e passa al successivo; <b>Salta</b> lo lascia vuoto (puoi tornarci dopo). Se un dato è già inserito te lo mostra per correggerlo («Lascia così» o «Aggiorna e avanti»). In alto i cerchietti dei passi: verde = fatto; toccane uno per andarci.</p>
<p>Con le frecce accanto alla data vai ai giorni passati per completare quello che manca. Il <b>Riepilogo</b> finale mostra corrispettivi, aggi del giorno, POS, quadratura e l'elenco dei passi; «Condividi» manda il riepilogo come testo (WhatsApp, mail).</p>
<p>Quando tutto è inserito, il tasto in Home diventa verde: «Giornata chiusa».</p>` },

    { k: 'corrispettivi', t: 'Corrispettivi serali', icon: 'register', color: 'blue', route: 'corrispettivi', html: `
<p>Il totale dei prodotti con IVA del giorno, dalla chiusura del registratore. <b>Di cui contanti</b> e <b>di cui POS</b> sono facoltativi: se non li separi, i corrispettivi contano come contanti e il POS va tutto nei tabacchi (vedi il capitolo Chiusura Tabacchi).</p>
<p>La schermata mostra il mese con totale, giornate e media al giorno; «Solo il mese / Tutto lo storico» cambia l'elenco. Tocca una riga per correggerla o eliminarla.</p>` },

    { k: 'chiusure', t: 'Chiusure / Incassi: Tabacchi, Lotto, Gratta e Vinci, Servizi', icon: 'tobacco', color: 'green', route: 'chiusura-tabacchi', html: `
<p>Ogni chiusura ha data, importo, «di cui contanti / di cui POS», e l'<b>aggio del giorno</b>: lascia il campo vuoto e l'app lo calcola con la percentuale di <a href="#percentuali-aggi">Percentuali aggi</a>; scrivilo se vuoi forzarlo.</p>
<p><b>Tabacchi</b>: puoi inserire in due modi. <b>«Dal conteggio di cassa»</b>: scrivi i <b>contanti in cassa stasera</b> (fondo compreso) e la <b>chiusura del POS usato per i tabacchi</b> (se hai più terminali scegli quale); l'app toglie il fondo lasciato ieri sera (dal Cambio in cassa) e i corrispettivi del giorno (se nei corrispettivi hai indicato la parte POS, la toglie dal POS) e trova la vendita tabacchi, riga per riga. Il POS scritto qui vale anche come chiusura di quel terminale. <b>«Solo tabacchi»</b>: scrivi direttamente la vendita tabacchi. L'app ricorda l'ultimo modo usato. Nei tabacchi puoi annotare anche la levata (acquisto) del giorno e la giacenza stimata.</p>
<p><b>Lotto</b>: raccolta, vincite pagate, numero di giocate. <b>Gratta e Vinci</b>: venduto, vincite pagate, biglietti. <b>Servizi</b>: incasso e compenso, con il dettaglio (ricariche, bollettini…).</p>
<p>Nella schermata di ogni voce vedi aggi del mese, vendite o raccolta, giornate, e la variazione rispetto al mese precedente.</p>` },

    { k: 'pos', t: 'Chiusure / Incassi POS', icon: 'pos', color: 'blue', route: 'pos', html: `
<p>La sera registri la chiusura di ogni terminale (il nome lo proponi in <a href="#moduli">Tipo di attività</a>). L'<b>importo atteso</b>, se lo lasci vuoto, è la somma dei «di cui POS» del giorno (corrispettivi + tabacchi + Lotto + Gratta e Vinci + comande bar col POS) e viene confrontato con il <b>totale di tutti i terminali</b>: «quadra» oppure «differenza». Puoi scrivere un atteso diverso a mano.</p>
<p>Nella chiusura guidata, con più terminali, li inserisci uno dopo l'altro («Salva, poi POS 2»); con «+ Aggiungi un altro terminale POS» ne crei uno nuovo.</p>` },

    { k: 'cassa', t: 'Cambio in cassa e Conta banconote', icon: 'moon', color: 'cyan', route: 'cambio-cassa', html: `
<p><a href="#cambio-cassa"><b>Cambio in cassa</b></a>: la sera scrivi il <b>contante lasciato in cassa</b> per il mattino dopo (diventa il fondo da togliere nella chiusura tabacchi e nella quadratura); al mattino puoi registrare fondo iniziale, prelievo e reintegro. L'app mostra la differenza fra sera e fondo del mattino.</p>
<p><a href="#conta-banconote"><b>Conta banconote</b></a>: tocchi + e − per ogni taglio di banconote e monete e vedi il totale; con «Usa per cambio cassa» o «Usa nei corrispettivi» il totale va nel campo giusto. Lo stesso conteggio lo trovi dentro la quadratura.</p>` },

    { k: 'quadratura', t: 'Quadratura cassa', icon: 'cash', color: 'green', route: 'quadratura', html: `
<p>Serve a scoprire se nel cassetto ci sono i soldi che dovrebbero esserci. L'app calcola il <b>contante teorico</b> da quello che hai già inserito: fondo di stamattina (dal contante lasciato ieri sera) + corrispettivi in contanti + tabacchi in contanti (già al netto) + Lotto e Gratta e Vinci in contanti − vincite pagate − spese pagate in contanti − versamenti in banca. Due campi, «altre entrate» e «altre uscite», coprono quello che non è registrato altrove.</p>
<p>Tu scrivi i <b>contanti contati</b> (fondo compreso, prima di prelevare), anche con «Conta banconote e monete», e leggi subito: <b>la cassa quadra</b>, <b>ammanco</b> o <b>eccedenza</b>. La schermata <a href="#quadratura">Quadratura Cassa</a> tiene lo storico con ammanchi ed eccedenze del mese.</p>
<p>Attenzione: ha senso se l'incasso totale della sera lo leggi dallo scontrino di chiusura del registratore. Se quel totale lo ottieni contando i contanti, la quadratura torna sempre per forza: in quel caso salta il passo.</p>` },

    { k: 'aggi', t: 'Aggi settimanali e Aggi rimanenti nel mese', icon: 'calcBox', color: 'green', route: 'aggi-rimanenti', html: `
<p><b>AGGI settimanale</b> (Tabacchi, Lotto, Gratta e Vinci, Compensi servizi): se ricevi un prospetto settimanale, inseriscilo qui con la settimana e l'importo. Per quella settimana il prospetto <b>prevale</b> sulle chiusure serali, così niente doppi conteggi.</p>
<p><a href="#aggi-rimanenti"><b>Totale AGGI rimanenti nel mese</b></a>: aggi maturati fino a oggi per ogni tipo, confronto con il mese precedente intero, giorni di apertura trascorsi e media per giorno. Da qui puoi inserire una chiusura serale o un aggio settimanale.</p>` },

    { k: 'spese', t: 'Spese, Fatture e Versamenti', icon: 'cart', color: 'red', route: 'spese', html: `
<p><a href="#spese"><b>Spese giornaliere</b></a>: data, categoria, importo, descrizione, metodo di pagamento, fornitore. Le spese pagate in contanti entrano nella quadratura cassa.</p>
<p><a href="#fatture-ricevute"><b>Fatture ricevute</b></a> (acquisti) e <a href="#fatture-inviate"><b>Fatture inviate</b></a> (vendite e compensi): numero, data, imponibile, IVA (il totale si calcola da solo), categoria, stato pagata / da pagare, <b>scadenza</b> del pagamento e allegato (foto o PDF). Le scadenze compaiono tra gli avvisi e nei promemoria.</p>
<p><a href="#versamenti"><b>Versamenti nel Conto Impresa</b></a>: data, conto, importo, causale, metodo (contanti allo sportello, ATM evoluto, bonifico…). In Home trovi il totale del mese; i versamenti in contanti si tolgono dalla cassa nella quadratura.</p>` },

    { k: 'prodotti', t: 'Prodotti, inventario e quadri ISA', icon: 'box', color: 'blue', route: 'inventario', html: `
<p><a href="#inventario"><b>Archivio Prodotti e Inventario</b></a> (anche dal tasto in Home): l'archivio dei tuoi prodotti con codice a barre (leggibile con la fotocamera: «Scansiona»), codice interno, descrizione, categoria, fornitore, prezzo di acquisto (lo inserisci senza IVA o con IVA, come preferisci: l'altro si calcola), prezzo di vendita al pubblico, quantità; l'app calcola margine, marginalità sul prezzo di vendita e ricarico sul prezzo di acquisto, tutti sui valori senza IVA. «Carico/Scarico» aggiorna la giacenza e tiene i movimenti. «Salva inventario» fa una fotografia delle giacenze (per esempio al 31/12) che resta nello storico; valore a prezzo di acquisto e di vendita, esportabile in Excel e PDF.</p>
<p><a href="#ricavi-complementi"><b>Ricavi e costi complementi di tabacchi</b></a> e <a href="#ricavi-svapo"><b>svapo</b></a>: ricavo e costo per prodotto e data, con margine; sono i dati che servono per i quadri ISA.</p>` },

    { k: 'listinotab', t: 'Listino tabacchi e codici a barre', icon: 'tobacco', color: 'green', route: 'listino-tabacchi', html: `
<p><a href="#listino-tabacchi"><b>Listino Tabacchi</b></a> contiene la tariffa ufficiale di vendita al pubblico dell'Agenzia delle Dogane e dei Monopoli (dal file della Federazione Italiana Tabaccai): sigarette, sigari, sigaretti, trinciati, altri tabacchi da fumo, fiuto e prodotti da inalazione senza combustione, con codice ADM, nome, tipo di confezione, prezzo per confezione e per chilo convenzionale, esattamente come nella tariffa. Cerca per nome o codice, filtra per categoria.</p>
<p>Tocca un prodotto: vedi il prezzo e il tuo costo (tariffa meno aggio) e puoi <b>aggiungerlo ai tuoi prodotti</b> (inventario) con prezzi già compilati, oppure <b>associargli il codice a barre</b>. I codici a barre non esistono in nessuna tariffa ufficiale: la prima volta che scansioni un pacchetto («Scansiona un pacchetto» qui, o «Scansiona» nell'inventario) scegli il prodotto dal listino e da quel momento l'app lo riconosce da sola. Dal menu ⋯ puoi condividere i codici imparati (per incorporarli nelle versioni successive dell'app) o importarli da un altro tabaccaio.</p>
<p>Quando la tariffa cambia, dal menu ⋯ <b>Importa listino da file</b> carica il file nuovo (<i>listino-tabacchi-….json</i>, lo trovi nella pagina Releases di GitHub o te lo manda chi aggiorna l'app): i tuoi prodotti collegati al codice ADM prendono il prezzo nuovo da soli, senza aspettare l'aggiornamento dallo store.</p>` },
    { k: 'analisi', t: 'Confronti, marginalità e documenti certificativi', icon: 'chart', color: 'red', route: 'confronti', html: `
<p><a href="#confronti"><b>Confronto dei dati</b></a>: giorno, settimana, mese e anno a confronto con il periodo precedente, voce per voce, con medie e totali. <a href="#marginalita"><b>Marginalità in euro</b></a>: ricavi (aggi + compensi + ricavi extra) meno costi (spese + costi extra) mese per mese, con la composizione dei ricavi e gli ultimi 12 mesi.</p>
<p><a href="#documenti"><b>Documenti certificativi AGGI fine anno</b></a>: registri per ogni anno gli aggi certificati dagli enti (Logista, Lottomatica…), con numero e data del documento, e li confronti con quanto registrato nell'app; Excel e PDF pronti per il commercialista.</p>` },

    { k: 'turni', t: 'Turni e dipendenti', icon: 'people', color: 'purple', route: 'turni', html: `
<p><a href="#turni"><b>Turni Dipendenti / Titolare</b></a>: la griglia della settimana, da lunedì a domenica, con mattina e sera per ogni persona (titolare e dipendenti). Tocca una casella per impostare ingresso, uscita, pausa o «libero»; gli orari predefiniti (es. 8–13 e 17–20,30) si cambiano con «Usa questi orari come predefiniti». «Copia settimana precedente» riporta i turni della settimana prima. In basso le ore del mese per persona, lo storico mese per mese e l'Excel.</p>
<p>I <a href="#dipendenti"><b>Dipendenti</b></a> si inseriscono in Altro: nome, ruolo, telefono, ore settimanali da contratto, in servizio sì/no.</p>` },

    { k: 'bar', t: 'Bar: listino e comande', icon: 'coffee', color: 'brown', route: 'comande', html: `
<p><a href="#listino"><b>Listino bar</b></a>: 82 voci già pronte con prezzi medi indicativi, divise per categoria (caffetteria, brioche e dolci, bibite, succhi, birre e vini, aperitivi, amari, panini, snack, gelati). Correggi i prezzi, aggiungi voci, nascondi quelle che non vendi, segna i preferiti (★). Per ogni voce: prezzo, costo, IVA, fornitore; l'app calcola margine e ricarico.</p>
<p><a href="#comande"><b>Comande</b></a>: «Nuova comanda», scegli il tavolo o il banco, cerca nel listino o usa «★ Preferiti e recenti», quantità con + e −, note per articolo e per la comanda. Stati: da preparare → pronta/da incassare → <b>pagata</b> (contanti o POS). In Home vedi l'incasso bar di oggi e del mese, i più venduti e il giorno per giorno. I corrispettivi del bar restano da compilare la sera come sempre.</p>` },

    { k: 'promemoria', t: 'Promemoria e notifiche', icon: 'bell', color: 'red', route: 'promemoria', html: `
<p><a href="#promemoria"><b>Promemoria scadenze</b></a>: titolo, tipo (fattura, scadenza, versamento, compenso periodico, inventario…), ripetizione (una volta, ogni giorno, settimana, mese, anno), data, ora della notifica e importo facoltativo. Un promemoria settimanale con importo è comodo, per esempio, per l'addebito del Lotto o dei Gratta e Vinci.</p>
<p>In <a href="#impostazioni-notifiche"><b>Notifiche e promemoria</b></a> imposti il <b>promemoria giornaliero</b> di inserimento dati (con l'ora), il riepilogo settimanale, il <b>controllo automatico dei dati mancanti</b> (avviso in Home e notifica) e le notifiche per fatture e scadenze. Le notifiche sono locali: le genera il telefono, non un server. Alla prima apertura l'app chiede il permesso; «Notifica di prova» serve a verificarle.</p>` },

    { k: 'passi', t: 'Contapassi: lavoro e benessere', icon: 'passi', color: 'green', route: 'passi', html: `
<p>In cima alla Home c'è il <b>contapassi</b>: passi e chilometri di oggi. Tocca <b>Attiva il contapassi</b> una volta: Android chiede il permesso «Attività fisica» e da lì il telefono conta da solo con il suo sensore, anche ad app chiusa, <b>senza GPS</b> e senza consumare batteria. I passi restano solo nel telefono.</p>
<p>Toccando il contatore si apre la schermata con i passi di oggi, gli ultimi 7 giorni e l'elenco <b>giorno per giorno</b>, mese per mese. I chilometri sono stimati dai passi: inserisci la tua <b>altezza</b> per una stima più precisa. Nella versione aperta dal browser (iPhone di prova) il contapassi non c'è: il browser non arriva ai sensori.</p>` },
    { k: 'backup', t: 'Backup, importazione ed esportazioni', icon: 'cloud', color: 'blue', route: 'backup', html: `
<p><a href="#backup"><b>Backup</b></a>: imposta una <b>password dei backup</b> (scrivila in un posto sicuro fuori dal telefono: senza di essa i file non si riaprono, nemmeno dallo sviluppatore). «Crea e salva backup cifrato» produce un file cifrato (AES-256) da salvare o condividere dove vuoi. Il <b>backup automatico</b> salva periodicamente un file cifrato nella cartella Download → ContabilyTab del telefono. «Importa da file» ripristina un backup: puoi aggiungere o sostituire tutto.</p>
<p><b>Esportazioni</b> (Altro → Dati): Excel di ogni sezione, PDF con i riepiloghi mensili e annuali, archivio completo in Excel o JSON. Ogni schermata ha anche il tasto di condivisione in alto a destra.</p>
<p>Quando cambi telefono: backup sul vecchio, installa l'app sul nuovo, «Importa da file» → «Sostituisci tutto».</p>` },

    { k: 'sicurezza', t: 'Sicurezza', icon: 'shield', color: 'green', route: 'blocco', html: `
<p><a href="#blocco"><b>Blocco con PIN</b></a>: protegge l'apertura dell'app; sul telefono con il lettore di impronte puoi attivare anche lo <b>sblocco con impronta</b> (il PIN resta come alternativa). Il blocco protegge l'apertura, non cifra l'archivio: per i file usa il backup cifrato.</p>
<p>L'app non chiede il permesso internet, non partecipa al backup automatico di Google e si installa solo nella memoria interna del telefono. Tutto quello che inserisci resta lì. Leggi anche <a href="#privacy">Privacy</a> e <a href="#gdpr">GDPR</a>.</p>` },

    { k: 'impostazioni', t: 'Impostazioni e personalizzazioni', icon: 'settings', color: 'grey', route: 'altro', html: `
<p><a href="#impostazioni"><b>Impostazioni</b></a>: aspetto (automatico, chiaro, scuro), IVA predefinita, <b>giorni di chiusura settimanale</b> (usati dal controllo dei dati mancanti e dalle previsioni; i turni mostrano comunque tutta la settimana).</p>
<p><a href="#categorie"><b>Categorie</b></a> di spese, fatture, prodotti, metodi di pagamento e conti. <b>Le tue categorie</b>: crei tasti di inserimento tutti tuoi (nome, tipo, colore, icona) che compaiono in Home tra le azioni rapide. <a href="#aliquote"><b>Aliquote IVA</b></a>, <a href="#percentuali-aggi"><b>Percentuali aggi</b></a> (tabacchi sul venduto lordo, Lotto sulla raccolta, Gratta e Vinci sul venduto, compenso servizi; 0 = inserisci l'importo a mano).</p>
<p><b>Modalità demo</b> (Altro → Dati): carica tre mesi di dati di esempio, contrassegnati, per provare l'app; «Esci dalla demo» li rimuove e lascia i tuoi.</p>
<p><b>Calcolatrice a scomparsa</b>: dalla ricerca o dalle azioni rapide; resta sopra l'app mentre inserisci. <b>Suggerimenti</b>: annota cosa vorresti nel prossimo aggiornamento e condividilo.</p>` },

    { k: 'faq', t: 'Domande frequenti', icon: 'help', color: 'cyan', html: `
<p><b>Non mi scrive «Ciao» col mio nome.</b> Inserisci il nome in Altro → Dati titolare.</p>
<p><b>Le card della Home non cambiano.</b> Mostrano il mese scelto col selettore «Oggi»; la variazione è rispetto al mese precedente.</p>
<p><b>Come si calcola l'aggio?</b> Se nella chiusura lasci vuoto «Aggio del giorno», l'app applica la percentuale di Percentuali aggi al venduto (o alla raccolta); se arriva il prospetto settimanale, inseriscilo in AGGI settimanale e per quella settimana prevale.</p>
<p><b>La chiusura POS segna sempre una differenza.</b> Controlla di aver scritto i «di cui POS» nelle chiusure (tabacchi, Lotto, Gratta e Vinci) e di aver inserito tutti i terminali; oppure scrivi l'atteso a mano.</p>
<p><b>Ho sbagliato un dato di ieri.</b> Apri la funzione, tocca la riga e correggi, oppure in «Chiudi la giornata» usa la freccia per tornare a ieri.</p>
<p><b>Non arrivano le notifiche.</b> Altro → Notifiche e promemoria → «Attiva», poi «Notifica di prova». Controlla anche che Android non limiti la batteria per l'app.</p>
<p><b>Ho cambiato telefono.</b> Vedi il capitolo Backup.</p>
<p><b>Dove vanno i miei dati?</b> Da nessuna parte: restano sul telefono. Nessun server, nessun account.</p>` },
  ];

  CT.route('manuale', (app) => {
    const body = CT.screen(app, { title: 'Manuale', subtitle: 'Come funziona ContabilyTab, capitolo per capitolo', color: 'blue' });
    const inp = h('input', { type: 'search', placeholder: 'Cerca nel manuale: aggio, backup, POS…', 'aria-label': 'Cerca nel manuale', autocomplete: 'off' });
    const list = h('div', { class: 'man-list' });
    const info = h('p', { class: 'muted small', style: { margin: '6px 2px 0' } });
    const draw = () => {
      const q = CT.norm(inp.value.trim()); const words = q.split(' ').filter(Boolean);
      list.replaceChildren();
      let n = 0;
      CT.MANUALE.forEach((c) => {
        if (c.route && !CT.routeOn(c.route) && !CT.hasRoute(c.route)) return;
        const plain = CT.norm(c.t + ' ' + c.html.replace(/<[^>]+>/g, ' '));
        if (words.length && !words.every((w) => plain.includes(w))) return;
        n++;
        const det = h('details', { class: 'man-cap c-' + c.color, open: words.length ? true : null },
          h('summary', null, h('span', { class: 'ic' }, CT.svg(c.icon)), h('b', null, c.t), CT.svg('chevD', 'chev')),
          h('div', { class: 'prose man-body', html: c.html }),
          c.route && CT.hasRoute(c.route) && CT.routeOn(c.route) ? h('div', { class: 'btn-row', style: { margin: '4px 0 10px' } }, h('button', { class: 'btn ghost', onclick: () => CT.go(c.route) }, CT.svg('chevR'), 'Apri ' + c.t.split(':')[0].split(' (')[0])) : null);
        list.appendChild(det);
      });
      info.textContent = words.length ? (n ? n + ' capitoli trovati' : 'Nessun capitolo contiene queste parole') : CT.MANUALE.length + ' capitoli · tocca un titolo per aprirlo';
    };
    inp.addEventListener('input', CT.debounce(draw, 120));
    body.append(h('div', { class: 'toolbar' }, h('div', { class: 'search' }, CT.svg('search'), inp)), info, list);
    draw();
  });
})();

/* ContabilyTab — Listino tabacchi: tariffa ADM incorporata (file FIT), importazione da file, codici a barre imparati (richiesta del 26/10/2026) */
(function () {
  'use strict';
  const CT = window.CT;
  const h = CT.h;
  const DB = () => CT.DB;
  const S = () => DB().settings;

  // ---- dati: listino incorporato nel blocco <script type="application/json" id="listino-tabacchi">; se ne è stato importato uno più recente, vale quello ----
  let base = null;
  const parseJsonBlock = (id, fallback) => { try { const el = document.getElementById(id); return el ? JSON.parse(el.textContent) : fallback; } catch (e) { return fallback; } };
  const baseListino = () => base || (base = parseJsonBlock('listino-tabacchi', { data: '', cat: [], tipi: [], voci: [] }));
  CT.EAN_TAB = null; // codici a barre già noti all'app (imparati dai tabaccai e incorporati nelle versioni successive)
  const eanNoti = () => CT.EAN_TAB || (CT.EAN_TAB = parseJsonBlock('ean-tabacchi', {}));
  CT.listinoTab = () => { const imp = DB().kv('listinoTabacchi'); const b = baseListino(); return imp && imp.tipo === 'listino-tabacchi' && imp.data > (b.data || '') ? imp : b; };

  const PEZZI = /da\s+(\d+)\s+pezz/i, GRAMMI = /da\s+(\d+)\s+gramm/i;
  // una voce del listino in forma leggibile
  CT.voceTab = (v, L) => {
    L = L || CT.listinoTab();
    if (typeof v === 'string') { v = L.voci.find((x) => x[1] === v); if (!v) return null; }
    const tipo = L.tipi[v[5]] || ''; const mp = PEZZI.exec(tipo), mg = GRAMMI.exec(tipo);
    const pezzi = mp ? Number(mp[1]) : null, grammi = mg ? Number(mg[1]) : null;
    return { cat: L.cat[v[0]] || '', cod: v[1], nome: v[2], kg: v[3], conf: v[4], tipo, pezzi, grammi, unit: pezzi ? CT.r2(v[4] / pezzi) : null };
  };
  const normV = (v) => CT.norm(v[2] + ' ' + v[1]);
  // ricerca: tutte le parole scritte devono comparire nel nome (o nel codice); prima i nomi che iniziano con la prima parola
  CT.cercaListinoTab = (q, cat, limit = 60) => {
    const L = CT.listinoTab(); const words = CT.norm(q || '').split(' ').filter(Boolean); const ci = cat == null ? null : L.cat.indexOf(cat);
    const out = [];
    for (const v of L.voci) {
      if (ci != null && v[0] !== ci) continue;
      if (words.length) { const t = normV(v); if (!words.every((w) => t.includes(w))) continue; out.push({ v, s: t.startsWith(words[0]) ? 0 : 1 }); } else out.push({ v, s: 0 });
    }
    const PRI = ['Sigarette', 'Trinciati per sigarette', 'Sigari', 'Sigaretti', 'Altri tabacchi da fumo', 'Inalazione senza combustione', 'Tabacco da fiuto o da mastico'];
    const pri = (v) => { const i = PRI.indexOf(L.cat[v[0]]); return i < 0 ? 99 : i; };
    out.sort((a, b) => a.s - b.s || pri(a.v) - pri(b.v) || a.v[2].localeCompare(b.v[2]));
    return { tot: out.length, voci: out.slice(0, limit).map((x) => CT.voceTab(x.v, L)) };
  };

  // ---- prodotti: una voce del listino diventa un prodotto dell'inventario (prezzo di vendita = tariffa, acquisto = tariffa meno aggio) ----
  const calc = (p) => { const netto = Number(p.prezzoNetto) || 0; const lordo = p.prezzoLordo != null && p.prezzoLordo !== '' ? Number(p.prezzoLordo) : CT.r2(netto * (1 + (Number(p.iva) || 0) / 100)); const margine = CT.r2((Number(p.prezzoVendita) || 0) - netto); return { prezzoLordo: lordo, margine, marginePct: p.prezzoVendita ? margine / p.prezzoVendita * 100 : 0, valore: CT.r2(netto * (Number(p.quantita) || 0)) }; };
  const catProdotto = () => { const c = S().categorieProdotti || []; return c.find((x) => /tabacc/i.test(x)) || c[0] || 'Tabacchi'; };
  CT.prodottoDiVoce = (cod) => DB().all('prodotti').find((p) => p.admCod === cod);
  CT.prodottoDaVoce = async (v, extra) => {
    extra = extra || {};
    const esistente = CT.prodottoDiVoce(v.cod);
    if (esistente) {
      if (extra.barcode && esistente.barcode !== extra.barcode) { const np = { ...esistente, barcode: extra.barcode }; await DB().put('prodotti', np); return np; }
      return esistente;
    }
    const aggio = Number((S().aggi || {}).tabacchi) || 0;
    const p = { descrizione: v.nome + ' · ' + v.tipo, categoria: catProdotto(), fornitore: 'Logista', codice: v.cod, admCod: v.cod, admCat: v.cat, prezzoVendita: v.conf, prezzoNetto: CT.r2(v.conf * (1 - aggio / 100)), prezzoLordo: null, iva: 0, quantita: 0, ...extra };
    Object.assign(p, calc(p));
    await DB().put('prodotti', p);
    return p;
  };
  // dopo un nuovo listino: i prodotti collegati al codice ADM prendono il prezzo nuovo
  CT.aggiornaPrezziDaListino = async () => {
    const L = CT.listinoTab(); const map = new Map(L.voci.map((v) => [v[1], v])); const aggio = Number((S().aggi || {}).tabacchi) || 0; let n = 0;
    for (const p of DB().all('prodotti')) {
      if (!p.admCod) continue; const v = map.get(p.admCod); if (!v) continue;
      if (CT.r2(p.prezzoVendita) !== CT.r2(v[4])) { const np = { ...p, prezzoVendita: v[4], prezzoNetto: CT.r2(v[4] * (1 - aggio / 100)), prezzoLordo: null }; Object.assign(np, calc(np)); await DB().put('prodotti', np); n++; }
    }
    return n;
  };
  CT.importaListinoTab = async () => {
    const f = await CT.pickFile('.json,application/json'); if (!f) return;
    let obj; try { obj = JSON.parse(await CT.readFileText(f)); } catch (e) { return CT.toast('File non leggibile'); }
    if (!obj || obj.tipo !== 'listino-tabacchi' || !Array.isArray(obj.voci) || !Array.isArray(obj.cat) || !Array.isArray(obj.tipi)) return CT.toast('Non è un file di listino tabacchi di ContabilyTab');
    const cur = CT.listinoTab();
    if (obj.data <= (cur.data || '') && !(await CT.confirm('Il listino nel file (' + CT.dateIT(obj.data) + ') non è più recente di quello in uso (' + CT.dateIT(cur.data) + '). Caricarlo comunque?', { ok: 'Carica' }))) return;
    await DB().kvSet('listinoTabacchi', { app: 'ContabilyTab', tipo: 'listino-tabacchi', data: obj.data, fonte: obj.fonte || '', cat: obj.cat, tipi: obj.tipi, voci: obj.voci });
    const n = await CT.aggiornaPrezziDaListino();
    CT.toast('Listino del ' + CT.dateIT(obj.data) + ' caricato: ' + obj.voci.length + ' prodotti' + (n ? ' · ' + n + ' prezzi aggiornati nei tuoi prodotti' : ''), 4000);
    CT.render();
  };
  // codici a barre imparati: si condividono (per incorporarli nelle versioni successive) e si importano (da un altro tabaccaio)
  CT.eanImparati = () => DB().all('prodotti').filter((p) => p.barcode && p.admCod).map((p) => ({ ean: String(p.barcode), cod: String(p.admCod), nome: p.descrizione || '' }));
  CT.condividiEan = async () => {
    const list = CT.eanImparati(); if (!list.length) return CT.toast('Nessun codice a barre imparato finora: scansiona un pacchetto e scegli il prodotto nel listino.');
    await CT.saveFile('ContabilyTab_codici_tabacchi_' + CT.today() + '.json', JSON.stringify({ app: 'ContabilyTab', tipo: 'ean-tabacchi', data: CT.today(), voci: list }, null, 1));
  };
  CT.importaEan = async () => {
    const f = await CT.pickFile('.json,application/json'); if (!f) return;
    let obj; try { obj = JSON.parse(await CT.readFileText(f)); } catch (e) { return CT.toast('File non leggibile'); }
    if (!obj || obj.tipo !== 'ean-tabacchi' || !Array.isArray(obj.voci)) return CT.toast('Non è un file di codici a barre di ContabilyTab');
    let n = 0;
    for (const x of obj.voci) { if (!x || !x.ean || !x.cod) continue; const v = CT.voceTab(String(x.cod)); if (!v) continue; const prima = CT.prodottoDiVoce(v.cod); if (prima && prima.barcode) continue; await CT.prodottoDaVoce(v, { barcode: String(x.ean) }); n++; }
    CT.toast(n ? n + ' codici a barre aggiunti ai tuoi prodotti' : 'Nessun codice nuovo'); CT.render();
  };

  // ---- interfaccia ----
  const riga = (v, onTap) => {
    const p = CT.prodottoDiVoce(v.cod);
    return h('button', { class: 'item voce c-green', onclick: () => onTap(v) },
      h('div', { class: 'dot' }, CT.svg(/sigar/i.test(v.cat) && !/sigarette/i.test(v.cat) ? 'tobacco' : /inalaz/i.test(v.cat) ? 'vape' : 'tobacco')),
      h('div', { class: 'mid' }, h('b', null, v.nome), h('small', null, v.tipo + ' · cod. ' + v.cod + (p ? (p.barcode ? ' · ✓ nei tuoi prodotti, con codice a barre' : ' · ✓ nei tuoi prodotti') : ''))),
      h('div', { class: 'amt' }, CT.eur(v.conf), h('small', null, CT.eur(v.kg) + ' al kg')));
  };
  // elenco con ricerca e categorie; usato dalla schermata e dal selettore
  const elenco = (st, onTap, { limit = 60 } = {}) => {
    const L = CT.listinoTab();
    const inp = h('input', { type: 'search', placeholder: 'Cerca: marlboro, toscano, pueblo… o il codice', value: st.q || '', autocomplete: 'off', autocapitalize: 'off', 'aria-label': 'Cerca nel listino' });
    const chips = h('div', { class: 'chips' });
    const list = h('div', { class: 'list', style: { marginTop: '8px' } });
    const info = h('p', { class: 'muted small', style: { margin: '6px 2px 0' } });
    let n = limit;
    const ORD = ['Sigarette', 'Trinciati per sigarette', 'Sigari', 'Sigaretti', 'Altri tabacchi da fumo', 'Inalazione senza combustione', 'Tabacco da fiuto o da mastico'];
    const catOrd = [...L.cat].sort((a, b) => (ORD.indexOf(a) < 0 ? 99 : ORD.indexOf(a)) - (ORD.indexOf(b) < 0 ? 99 : ORD.indexOf(b)));
    const drawChips = () => chips.replaceChildren(...[null, ...catOrd].map((c) => h('button', { class: 'chip' + ((st.cat || null) === c ? ' on' : ''), onclick: () => { st.cat = c; n = limit; draw(); } }, c == null ? 'Tutti' : c)));
    const draw = () => {
      drawChips();
      const r = CT.cercaListinoTab(st.q, st.cat, n);
      list.replaceChildren(...r.voci.map((v) => riga(v, onTap)));
      if (r.tot > r.voci.length) list.appendChild(h('button', { class: 'btn ghost', style: { width: '100%' }, onclick: () => { n += limit; draw(); } }, 'Mostra altri (' + (r.tot - r.voci.length) + ')'));
      if (!r.tot) list.appendChild(h('div', { class: 'empty c-green' }, CT.svg('search'), h('b', null, 'Nessun prodotto trovato'), h('span', null, 'Prova con meno parole o con un\'altra categoria.')));
      info.textContent = (st.q || st.cat ? CT.qty(r.tot) + ' prodotti trovati' : CT.qty(L.voci.length) + ' prodotti in listino') + ' · tariffa in vigore dal ' + CT.dateIT(L.data);
    };
    inp.addEventListener('input', CT.debounce(() => { st.q = inp.value; n = limit; draw(); }, 150));
    draw();
    return { el: h('div', null, h('div', { class: 'toolbar' }, h('div', { class: 'search' }, CT.svg('search'), inp)), chips, info, list), draw, inp };
  };
  // scheda di una voce: prezzi, prodotto collegato, codice a barre
  CT.apriVoceTab = (v, done) => {
    const p = CT.prodottoDiVoce(v.cod);
    const r = (l, x) => h('div', { class: 'r' }, h('span', null, l), h('b', null, x));
    const s = CT.sheet({ title: v.nome, color: 'green', body: [
      h('p', { class: 'muted', style: { margin: '0 0 10px' } }, v.cat + ' · ' + v.tipo + ' · codice ADM ' + v.cod),
      h('div', { class: 'calc-box c-green' }, r('Prezzo per confezione', CT.eur(v.conf)), r('Prezzo per kg convenzionale', CT.eur(v.kg)), r('Costo per te (tariffa − aggio ' + CT.qty(Number((S().aggi || {}).tabacchi) || 0) + '%)', CT.eur(CT.r2(v.conf * (1 - (Number((S().aggi || {}).tabacchi) || 0) / 100))))),
