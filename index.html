    ['suggerimenti', 'idea', 'yellow', 'Suggerimenti per il prossimo aggiornamento', 'Annota cosa vorresti migliorare'],
    ['altro', 'dots', 'grey', 'Altro', 'Strumenti e Impostazioni'],
    ['home', 'home', 'blue', 'Home', 'Schermata principale'],
  ];
  // nomi come sui tasti della Home, quando l'elenco generale usa un nome corto
  const RIC_NOMI = { versamenti: 'Versamenti nel Conto Impresa', 'aggi-rimanenti': 'Totale AGGI rimanenti nel mese', documenti: 'Documenti Certificativi AGGI Fine Anno', backup: 'Backup Manuale Dati App', turni: 'Turni Dipendenti / Titolare', promemoria: 'Promemoria Scadenze', marginalita: 'Marginalità in Euro Mensile Corrispettivi', inventario: 'Inventario Giacenza al 31/12', 'conta-banconote': 'Conta Banconote Euro' };
  CT.ricercaIndice = () => {
    const seen = {}; const out = [];
    const add = (route, icon, color, label, sub) => {
      if (!route || seen[route]) return;
      label = RIC_NOMI[route] || label;
      if (route !== 'calc' && !CT.hasRoute(route)) return;
      if (!CT.routeOn(route)) return;
      seen[route] = 1;
      out.push({ route, icon, color, label, sub: sub || '', t: CT.norm(label + ' ' + (sub || '') + ' ' + (RIC_EXTRA[route] || '')), tl: CT.norm(label) });
    };
    CT.QA_AZIONI.forEach((a) => add(a[0], a[1], a[2], a[3], a[4] || 'Inserisci / Consulta'));
    AZIONI.forEach((a) => add(a[0], a[1], a[2], a[3], 'Inserisci / Consulta'));
    (CT.inserimenti ? CT.inserimenti() : []).forEach((d) => add('ins-' + d.id, d.icona, d.colore, d.nome, 'Categoria creata da te · ' + CT.insTipoLabel(d.tipo)));
    RIC_VOCI.forEach((a) => add(a[0], a[1], a[2], a[3], a[4]));
    return out;
  };
  // ogni parola scritta deve comparire (anche in parte) nel nome, nel sottotitolo o nei sinonimi; prima i risultati con la parola nel nome
  CT.cerca = (q) => {
    const words = CT.norm(q).split(' ').filter(Boolean); if (!words.length) return [];
    return CT.ricercaIndice().map((v) => {
      if (!words.every((w) => v.t.includes(w))) return null;
      let score = 0;
      words.forEach((w) => { if (v.tl.startsWith(w)) score += 3; else if (v.tl.split(' ').some((x) => x.startsWith(w))) score += 2; else if (v.tl.includes(w)) score += 1; });
      return { v, score };
    }).filter(Boolean).sort((a, b) => b.score - a.score || a.v.label.localeCompare(b.v.label)).map((x) => x.v);
  };
  CT.openRicerca = () => {
    const inp = h('input', { type: 'search', placeholder: 'Scrivi una parola: gratta, backup, turni…', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', 'aria-label': 'Cerca una funzione', enterkeyhint: 'go' });
    const res = h('div');
    const vai = (v) => { s.close(); if (v.route === 'calc') { if (CT.current() !== 'home') CT.go('home'); setTimeout(CT.toggleCalc, 50); } else CT.go(v.route); };
    const draw = () => {
      res.replaceChildren();
      const q = inp.value.trim();
      if (!q) { res.append(h('div', { class: 'empty c-blue', style: { marginTop: '12px' } }, CT.svg('search'), h('b', null, 'Cerca per parola'), h('span', null, 'Scrivi una parola, anche solo una parte (es. «gratta», «backup», «turni»): compaiono i tasti e le funzioni che la contengono. Tocca un risultato per andarci subito.'))); return; }
      const list = CT.cerca(q);
      if (!list.length) { res.append(h('div', { class: 'empty c-blue', style: { marginTop: '12px' } }, CT.svg('search'), h('b', null, 'Nessuna funzione trovata'), h('span', null, 'Nessun tasto contiene «' + q + '». Prova con una parola diversa o più corta.'))); return; }
      res.append(h('div', { class: 'menu-h', style: { marginTop: '12px' } }, list.length + (list.length === 1 ? ' risultato' : ' risultati')),
        h('div', { class: 'menu' }, list.map((v) => h('button', { class: 'mi c-' + v.color, onclick: () => vai(v) }, h('div', { class: 'ic' }, CT.svg(v.icon)), h('span', null, v.label, v.sub ? h('small', null, v.sub) : null), CT.svg('chevR')))));
    };
    inp.addEventListener('input', draw);
    inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { const l = CT.cerca(inp.value); if (l.length) { e.preventDefault(); vai(l[0]); } } });
    const s = CT.sheet({ title: 'Cerca una funzione', color: 'blue', wide: true, body: h('div', null, h('div', { class: 'search ric', role: 'search' }, CT.svg('search'), inp), res) });
    draw(); setTimeout(() => inp.focus(), 80);
    return s;
  };

  // ---------- Menu laterale ----------
  CT.openDrawer = () => {
    const mi = (route, icon, color, label) => (CT.routeOn(route) ? h('button', { class: 'mi c-' + color, onclick: () => { ov.remove(); CT.go(route); } }, h('div', { class: 'ic' }, CT.svg(icon)), h('span', null, label), CT.svg('chevR')) : null);
    const ov = h('div', { class: 'drawer-ov', onclick: (e) => { if (e.target === ov) ov.remove(); } },
      h('div', { class: 'drawer' },
        h('div', { class: 'brandmini' }, 'Contabily', h('span', null, 'Tab')),
        h('div', { class: 'menu' },
          mi('home', 'home', 'blue', 'Home'),
          mi('moduli', 'store', 'blue', 'Tipo di attività · ' + (CT.TIPI_ATTIVITA.find((t) => t.v === CT.tipoAttivita()) || {}).l),
          h('button', { class: 'mi c-blue', onclick: () => { ov.remove(); CT.openRicerca(); } }, h('div', { class: 'ic' }, CT.svg('search')), h('span', null, 'Cerca una funzione', h('small', null, 'Per parola: tocca il risultato e ci vai')), CT.svg('chevR')),
          mi('confronti', 'compare', 'blue', 'Confronto dei dati'),
          mi('chiusura-giornata', 'moon', 'blue', 'Chiudi la giornata'),
          mi('corrispettivi', 'register', 'blue', 'Corrispettivi'),
          mi('comande', 'coffee', 'brown', 'Comande'),
          mi('listino', 'list', 'brown', 'Listino bar'),
          mi('chiusura-tabacchi', 'tobacco', 'green', 'Chiusure / Incassi Tabacchi'),
          mi('listino-tabacchi', 'tobacco', 'green', 'Listino tabacchi'),
          mi('chiusura-lotto', 'lotto', 'orange', 'Chiusure / Incassi Lotto'),
          mi('chiusura-gev', 'scratch', 'purple', 'Chiusure / Incassi Gratta e Vinci'),
          mi('chiusura-servizi', 'services', 'cyan', 'Chiusure / Incassi Servizi'),
          mi('pos', 'pos', 'blue', 'Chiusure / Incassi POS'),
          mi('quadratura', 'cash', 'green', 'Quadratura cassa'),
          mi('spese', 'cart', 'red', 'Spese'),
          mi('fatture-ricevute', 'invoice', 'cyan', 'Fatture ricevute'),
          mi('fatture-inviate', 'invoiceOut', 'orange', 'Fatture inviate'),
          mi('inventario', 'box', 'blue', 'Inventario'),
          mi('versamenti', 'bank', 'blue', 'Versamenti'),
          mi('turni', 'people', 'purple', 'Turni'),
          mi('promemoria', 'reminder', 'red', 'Promemoria'),
          (CT.inserimenti ? CT.inserimenti() : []).map((d) => mi('ins-' + d.id, d.icona, d.colore, d.nome)),
          mi('backup', 'cloud', 'blue', 'Backup'),
          mi('manuale', 'help', 'blue', 'Manuale'),
          mi('altro', 'settings', 'grey', 'Altro e impostazioni')),
        h('p', { class: 'muted small', style: { margin: '14px 6px' } }, 'ContabilyTab ' + CT.VERSION + ' · dati salvati solo su questo dispositivo')));
    document.body.appendChild(ov);
  };

  // ---------- Calcolatrice a scomparsa ----------
  let calcState = { expr: '', mini: false };
  CT.toggleCalc = () => { const ex = document.querySelector('.calcpad, .calc-mini'); if (ex) { ex.remove(); return; } calcState.mini = false; drawCalc(); };
  function evalExpr(e) {
    const s = e.replace(/,/g, '.').replace(/×/g, '*').replace(/÷/g, '/').replace(/−/g, '-').replace(/%/g, '/100');
    if (!/^[\d.+\-*/() ]*$/.test(s)) return null;
    try { const v = Function('"use strict";return (' + s + ')')(); return isFinite(v) ? CT.r2(v) : null; } catch (err) { return null; }
  }
  function drawCalc() {
    document.querySelectorAll('.calcpad, .calc-mini').forEach((e) => e.remove());
    if (calcState.mini) { document.body.appendChild(h('button', { class: 'calc-mini', onclick: () => { calcState.mini = false; drawCalc(); } }, CT.svg('calc'), calcState.expr ? (evalExpr(calcState.expr) != null ? CT.num(evalExpr(calcState.expr)) : calcState.expr) : 'Calcolatrice')); return; }
    const expr = h('div', { class: 'expr' }), res = h('div', { class: 'res' });
    const upd = () => { expr.textContent = calcState.expr; const v = evalExpr(calcState.expr); res.textContent = calcState.expr ? (v == null ? '…' : CT.num(v)) : '0,00'; };
    const press = (k) => {
      if (k === 'C') calcState.expr = '';
      else if (k === '⌫') calcState.expr = calcState.expr.slice(0, -1);
      else if (k === '=') { const v = evalExpr(calcState.expr); if (v != null) calcState.expr = String(v).replace('.', ','); }
      else calcState.expr += k;
      upd();
    };
    const keys = ['C', '⌫', '%', '÷', '7', '8', '9', '×', '4', '5', '6', '−', '1', '2', '3', '+', '00', '0', ',', '='];
    const box = h('div', { class: 'calcpad', role: 'dialog', 'aria-label': 'Calcolatrice' },
      h('div', { class: 'bar' }, h('span', null, 'Calcolatrice'), h('div', { style: { display: 'flex', gap: '6px' } },
        h('button', { onclick: () => { const v = evalExpr(calcState.expr); if (v != null) { navigator.clipboard && navigator.clipboard.writeText(CT.num(v)).then(() => CT.toast('Copiato: ' + CT.num(v))).catch(() => CT.toast(CT.num(v))); } } }, 'Copia'),
        h('button', { onclick: () => { calcState.mini = true; drawCalc(); } }, 'Riduci'),
        h('button', { 'aria-label': 'Chiudi', onclick: () => box.remove() }, '✕'))),
      h('div', { class: 'disp' }, expr, res),
      h('div', { class: 'keys' }, keys.map((k) => h('button', { class: /[÷×−+]/.test(k) ? 'op' : k === '=' ? 'eq' : /[C⌫%]/.test(k) ? 'fn' : '', onclick: () => press(k) }, k))));
    document.body.appendChild(box); upd();
  }

  // ---------- Prima apertura: responsabilità e privacy ----------
  function showAcceptance() {
    return new Promise((res) => {
      const chk = h('input', { type: 'checkbox', id: 'acc-chk' });
      const nome = h('input', { type: 'text', id: 'acc-nome', placeholder: 'Es. Mario' });
      let tipo = 'tabaccheria';
      const tipoSeg = h('div', { class: 'seg c-blue', id: 'acc-tipo' });
      const drawTipo = () => tipoSeg.replaceChildren(...CT.TIPI_ATTIVITA.map((t) => h('button', { type: 'button', class: tipo === t.v ? 'on' : '', onclick: () => { tipo = t.v; drawTipo(); } }, t.l)));
      drawTipo();
      const accSave = async () => { await CT.DB.saveSettings({ accepted: true, acceptedAt: new Date().toISOString(), titolare: nome.value.trim(), tipoAttivita: tipo, moduli: Object.assign({}, CT.PRESET_MODULI[tipo]) }); if (CT.PRESET_MODULI[tipo].bar) await CT.listinoInit(); };
      const btn = h('button', { class: 'btn', disabled: true, onclick: async () => { await accSave(); s.close(); res(true); } }, 'Accetto e inizio');
      chk.addEventListener('change', () => (btn.disabled = !chk.checked));
      const s = CT.sheet({ title: 'Benvenuto in ContabilyTab', color: 'blue', wide: true, locked: true,
        body: h('div', { class: 'prose' },
          h('p', null, h('b', null, 'I tuoi dati restano sul telefono.'), ' ContabilyTab salva tutto localmente nel dispositivo: non usa server, non invia dati a nessuno e funziona senza connessione.'),
          h('h3', null, 'Responsabilità sui dati inseriti'),
          h('p', null, 'L’app è uno strumento di annotazione e raffronto: i calcoli si basano esclusivamente sui dati che inserisci. Resta tua la responsabilità della correttezza dei dati, degli adempimenti fiscali e contabili e della conservazione dei backup. I riepiloghi non sostituiscono documenti ufficiali né la consulenza del commercialista.'),
          h('h3', null, 'Backup'),
          h('p', null, 'Se cambi telefono o disinstalli l’app, i dati non sono recuperabili senza un backup fatto da te (menu Backup). L’app ti ricorda di farlo.'),
          h('div', { class: 'field', style: { marginTop: '12px' } }, h('label', null, 'Che locale hai? (si può cambiare in Altro → Tipo di attività)'), tipoSeg),
          h('div', { class: 'field', style: { marginTop: '12px' } }, h('label', { for: 'acc-nome' }, 'Come ti chiami? (per il saluto in Home)'), nome),
          h('label', { class: 'switch', for: 'acc-chk', style: { marginTop: '8px' } }, h('span', null, 'Ho letto e accetto le condizioni d’uso e l’informativa privacy'), chk),
          h('div', { class: 'btn-row', style: { marginTop: '10px' } }, h('button', { class: 'btn ghost', onclick: async () => { await accSave(); s.close(); await CT.loadDemo(); res(true); } }, 'Prova con dati DEMO'))),
        footer: btn, onClose: () => { if (!CT.DB.settings.accepted) showAcceptance().then(res); } });
    });
  }

  // ---------- Avvio ----------
  async function boot() {
    try { await CT.DB.init(); } catch (e) { console.error(e); }
    CT.applyTheme();
    if (CT.lock && CT.lock.isOn()) await CT.lock.show();
    if (!CT.DB.settings.accepted) { CT.render(); await showAcceptance(); }
    CT.render();
    CT.DB.onChange(() => { if (CT.current() === 'home') { clearTimeout(boot._t); boot._t = setTimeout(() => { if (CT.sheets.length) CT._homeDirty = true; else CT.render(); }, 50); } clearTimeout(boot._n); boot._n = setTimeout(() => CT.notif.schedule().catch(() => {}), 1500); });
    // controllo automatico dati mancanti (una volta al giorno, ad app aperta)
    try {
      const key = 'ct.lastCheck'; const last = localStorage.getItem(key);
      if (CT.DB.settings.notifiche.controlloMancanti !== false && last !== CT.today()) {
        localStorage.setItem(key, CT.today());
        const chiusi = CT.DB.settings.avvisiChiusi || {};
        const miss = CT.datiMancanti(7).filter((m) => !chiusi['mancanti:' + m.date]);
        if (miss.length) CT.notif.now('ContabilyTab', 'Mancano dati in ' + miss.length + ' giornat' + (miss.length === 1 ? 'a' : 'e') + ': ' + (miss.length === 1 ? miss[0].miss.join(', ') : 'aprili dalla campanella') + '.');
      }
    } catch (e) { /* storage non disponibile */ }
    // permesso notifiche (Android 13+ lo richiede): chiesto subito nell'app installata, cosi' i promemoria arrivano davvero
    if (CT.isNative()) { try { await CT.notif.permission(); } catch (e) { /* */ } }
    CT.notif.schedule().catch(() => {});
    setTimeout(async () => { if (CT.askBackupPwdIfNeeded && CT.isNative() && !CT.backupPwdSet()) await CT.askBackupPwdIfNeeded(); if (CT.autoBackup) CT.autoBackup(); }, 2000);
  }
  document.addEventListener('DOMContentLoaded', boot);
})();


</script>
