<title>ContabilyTab</title>
<style>
/* ContabilyTab — layout: Home fedele alla schermata di riferimento; schermate interne a "foglio" con intestazione colorata per sezione */
:root {
  --bg: #ffffff;
  --surface: #ffffff;
  --surface-2: #f5f7fb;
  --text: #16203a;
  --muted: #5b6684;
  --line: #e2e8f3;
  --edge: #dfe5f0;
  --toast: #16203a;
  --navy: #1430c4;
  --blue: #1f6fe6;   --blue-t: #eaf2fe;
  --green: #2c9b3c;  --green-t: #ecf7ee;
  --orange: #f0661a; --orange-t: #fff0e5;
  --purple: #8a4fd3; --purple-t: #f3ecfd;
  --red: #e2393a;    --red-t: #fdeced;
  --cyan: #18b2d0;   --cyan-t: #e5f7fb;
  --brown: #8a5a2b;  --brown-t: #f6ede4;
  --yellow: #f2b705; --yellow-t: #fff7dc;
  --grey: #4a5160;   --grey-t: #eceef2;
  --pos: #22a03a;
  --neg: #e2393a;
  --shadow: 0 1px 2px rgba(20, 40, 90, .06), 0 2px 8px rgba(20, 40, 90, .05);
  --radius: 14px;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root[data-theme="auto"] {
    --bg: #0f1420; --surface: #171e2d; --surface-2: #1c2436; --text: #e9eefa; --muted: #9aa6c2; --line: #2a3448; --edge: #2a3448; --toast: #33405e;
    --navy: #8fa6ff;
    --blue: #5b9bff; --blue-t: #1a2a47; --green: #4cc463; --green-t: #173022; --orange: #ff8a47; --orange-t: #3a2516;
    --purple: #b58cff; --purple-t: #2a2141; --red: #ff6466; --red-t: #3c1d22; --cyan: #3fd0ec; --cyan-t: #133540; --brown: #d49a66; --brown-t: #33261a;
    --yellow: #ffcd38; --yellow-t: #3a3115; --grey: #c4cad6; --grey-t: #262d3c; --pos: #4cc463; --neg: #ff6466;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1420; --surface: #171e2d; --surface-2: #1c2436; --text: #e9eefa; --muted: #9aa6c2; --line: #2a3448; --edge: #2a3448; --toast: #33405e;
  --navy: #8fa6ff;
  --blue: #5b9bff; --blue-t: #1a2a47; --green: #4cc463; --green-t: #173022; --orange: #ff8a47; --orange-t: #3a2516;
  --purple: #b58cff; --purple-t: #2a2141; --red: #ff6466; --red-t: #3c1d22; --cyan: #3fd0ec; --cyan-t: #133540;
  --yellow: #ffcd38; --yellow-t: #3a3115; --grey: #c4cad6; --grey-t: #262d3c; --pos: #4cc463; --neg: #ff6466;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.35; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--text); }
.num { font-variant-numeric: tabular-nums; }
:focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 55%, transparent); outline-offset: 2px; }

#app { min-height: 100%; padding-bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); }
.wrap { max-width: 1040px; margin: 0 auto; padding-inline: 14px; }

/* ---------- HOME HEADER ---------- */
.hero { background: linear-gradient(180deg, color-mix(in srgb, var(--blue) 9%, var(--bg)), var(--bg)); padding-block: 10px 6px; }
.hero-top { display: grid; grid-template-columns: 44px 1fr 44px; align-items: start; gap: 6px; }
.icon-btn { width: 44px; height: 44px; border: 0; background: transparent; border-radius: 12px; display: grid; place-items: center; position: relative; color: var(--blue); }
.icon-btn:active { background: var(--blue-t); }
.icon-btn svg { width: 28px; height: 28px; }
.badge { position: absolute; top: 2px; right: 0; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: var(--red); color: #fff; font-size: 12px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--surface); }
.brand { text-align: center; min-width: 0; }
.brand h1 { margin: 0; font-size: clamp(30px, 8vw, 54px); line-height: 1; font-weight: 800; letter-spacing: -.02em; color: var(--navy); }
.brand h1 span { color: var(--blue); }
.brand .sub { margin: 4px 0 0; font-weight: 700; font-size: clamp(15px, 3.6vw, 22px); color: var(--navy); }
.brand .claim { margin: 4px auto 0; font-style: italic; font-size: clamp(12px, 2.9vw, 14px); line-height: 1.25; color: var(--blue); max-width: 46em; text-wrap: balance; }
/* scorrimento una volta all'apertura, poi resta la riga corta fissa */
.brand .claim.scorri { overflow: hidden; max-width: 100%; text-wrap: nowrap; white-space: nowrap; }
.brand .claim.scorri { font-size: 12.5px; font-style: italic; font-weight: 500; margin-top: 3px; }
.brand .claim.scorri .claim-run { display: inline-block; text-wrap: nowrap; white-space: nowrap; padding-left: 100%; will-change: transform; animation: claim-scorri 26s linear infinite; }
@keyframes claim-scorri { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .brand .claim.scorri .claim-run { animation: none; padding-left: 0; } }


.welcome { margin-top: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr; gap: 10px; padding: 12px; }
@media (min-width: 640px) { .welcome { grid-template-columns: 1.3fr 1fr auto; align-items: center; } }
.hello { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; min-width: 0; padding-top: 2px; }
.hello .av { width: 52px; height: 52px; flex: none; border-radius: 50%; background: var(--blue); color: #fff; display: grid; place-items: center; }
.hello > div:not(.av) { width: 100%; }
.hello .av svg { width: 30px; height: 30px; }
.hello b { display: block; font-size: 22px; font-weight: 600; }
.hello small { font-size: 15px; color: var(--text); opacity: .85; }
.welcome-actions { display: flex; gap: 10px; }
.attivita { display: flex; flex-direction: column; gap: 6px; }
.attivita > small { font-size: 12px; font-weight: 700; letter-spacing: .05em; color: var(--muted); text-align: center; }
.att-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.att-btn { border: 2px solid color-mix(in srgb, var(--c) 35%, transparent); border-radius: 14px; background: var(--tint); color: var(--c); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 10px 4px 9px; min-height: 76px; font-weight: 800; font-size: 14px; line-height: 1.1; letter-spacing: -.01em; }
.att-btn .ic { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--c); }
.att-btn .ic svg { width: 20px; height: 20px; }
.att-btn b { font-weight: 800; }
.att-btn.on { background: var(--c); border-color: var(--c); color: #fff; box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 35%, transparent); }
.att-btn.on .ic { background: rgba(255, 255, 255, .22); color: #fff; }
.att-btn:active { transform: scale(.97); }
.attivita .hint { font-size: 12.5px; color: var(--muted); text-align: center; margin: 0; }
@media (min-width: 640px) { .welcome-actions { display: contents; } }
.btn-turni { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 12px; border-radius: 12px; border: 0; background: var(--purple-t); color: var(--navy); font-size: 16px; text-align: center; line-height: 1.15; min-height: 56px; }
.btn-turni svg { width: 34px; height: 34px; color: var(--purple); flex: none; }
.btn-oggi { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 12px; border: 1px solid color-mix(in srgb, var(--blue) 25%, var(--line)); background: var(--blue-t); color: var(--blue); font-size: 18px; min-height: 56px; white-space: nowrap; }
.btn-oggi svg { width: 24px; height: 24px; }

.demo-banner { margin-top: 10px; background: var(--yellow-t); color: var(--text); border: 1px solid color-mix(in srgb, var(--yellow) 50%, transparent); border-radius: 12px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; font-size: 14px; }
.demo-banner button { border: 0; background: var(--yellow); color: #1b1b1b; border-radius: 8px; padding: 6px 10px; font-weight: 700; }

/* ---------- SECTION TITLES ---------- */
.sec-title { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 16px 0 8px; }
.sec-title h2 { margin: 0; font-size: 20px; font-weight: 600; color: var(--blue); letter-spacing: -.01em; }
.sec-title h2 small { font-size: 15px; font-weight: 600; color: var(--navy); margin-left: 4px; }
.link { border: 0; background: transparent; color: var(--blue); font-size: 15px; padding: 6px 0; display: inline-flex; gap: 4px; align-items: center; }

/* ---------- SUMMARY CARDS ---------- */
.cards { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(150px, 1fr); gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; padding-bottom: 4px; }
.cards::-webkit-scrollbar { height: 0; }
/* frecce a scomparsa che indicano lo scorrimento orizzontale dei contatori (solo su schermi stretti) */
.cards-wrap { position: relative; }
.cards-hint { position: absolute; top: 50%; width: 36px; height: 36px; margin-top: -18px; border: 1px solid var(--line); border-radius: 50%; background: var(--surface); color: var(--blue); box-shadow: 0 2px 10px rgba(0,0,0,.18); display: grid; place-items: center; padding: 0; opacity: 0; transition: opacity .35s; pointer-events: none; z-index: 2; }
.cards-hint svg { width: 22px; height: 22px; }
.cards-hint.on { opacity: .96; pointer-events: auto; }
.cards-hint.l { left: -2px; } .cards-hint.r { right: -2px; }
.cards-hint.r.on.nudge { animation: ct-nudge 1s ease-in-out 3; }
@keyframes ct-nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
@media (min-width: 700px) { .cards-hint { display: none; } }
.scard { scroll-snap-align: start; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 8px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; background: var(--tint); color: var(--c); }
.scard .lbl { font-size: 14px; line-height: 1.25; min-height: 2.5em; text-transform: uppercase; }
.scard .circ { width: 84px; height: 84px; border-radius: 50%; background: color-mix(in srgb, var(--c) 14%, var(--surface)); display: grid; place-items: center; position: relative; }
.scard .circ svg { width: 50px; height: 50px; }
.scard .val { font-size: 22px; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: -.01em; white-space: nowrap; }
.scard .var { font-size: 15px; display: flex; align-items: center; gap: 4px; }
.scard .var svg { width: 14px; height: 14px; }
.scard .vs { font-size: 13px; color: var(--text); }
.up { color: var(--pos); } .down { color: var(--neg); } .flat { color: var(--muted); }
.scard.spese .up { color: var(--neg); } .scard.spese .down { color: var(--pos); }

/* colour helpers */
.c-blue { --c: var(--blue); --tint: var(--blue-t); }
.c-green { --c: var(--green); --tint: var(--green-t); }
.c-orange { --c: var(--orange); --tint: var(--orange-t); }
.c-purple { --c: var(--purple); --tint: var(--purple-t); }
.c-red { --c: var(--red); --tint: var(--red-t); }
.c-cyan { --c: var(--cyan); --tint: var(--cyan-t); }
.c-yellow { --c: var(--yellow); --tint: var(--yellow-t); }
.c-grey { --c: var(--grey); --tint: var(--grey-t); }
.c-brown { --c: var(--brown); --tint: var(--brown-t); }

/* ---------- QUICK ACTIONS ---------- */
.qa { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 700px) { .qa { grid-template-columns: repeat(5, minmax(0, 1fr)); } .qa.six { grid-template-columns: repeat(6, minmax(0, 1fr)); } }
.qa + .qa { margin-top: 8px; }
.tile { border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 10px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; min-height: 128px; box-shadow: var(--shadow); }
.tile:active { transform: scale(.98); background: var(--surface-2); }
.tile .ic { width: 58px; height: 58px; border-radius: 50%; background: var(--c); color: #fff; display: grid; place-items: center; flex: none; }
.tile .ic svg { width: 34px; height: 34px; }
.tile b { font-weight: 500; font-size: 13.5px; line-height: 1.2; }
.tile small { font-size: 12px; color: var(--muted); line-height: 1.2; }
.tile.calcpad { background: var(--grey-t); border-color: color-mix(in srgb, var(--grey) 40%, var(--line)); }
.tile.more .ic { background: var(--grey-t); color: var(--grey); }
/* ---------- Tasti di inserimento personalizzati (creati dall'utente) ---------- */
.tile.new-ins { border: 2px dashed color-mix(in srgb, var(--blue) 45%, var(--line)); background: var(--blue-t); }
/* dato di oggi inserito / da inserire (tasti giornalieri in Home) */
.oggi { display: inline-flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; font-weight: 700; line-height: 1.15; padding: 4px 7px; border-radius: 12px; max-width: 100%; text-align: center; }
.oggi svg { width: 12px; height: 12px; flex: none; }
.oggi.ok { background: var(--green-t); color: var(--green); }
.oggi.no { background: var(--orange-t); color: var(--orange); }
.tile .oggi { margin-top: auto; }
.tile.oggi-ok { border-color: color-mix(in srgb, var(--green) 55%, var(--line)); }
.tile.oggi-ok .ic { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--green); }
.tile.oggi-no .ic { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--orange); }
.fav .ft { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
.fav.oggi-ok { border-color: color-mix(in srgb, var(--green) 55%, var(--edge)); }
.scard { position: relative; }
.scard .oggi-dot { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; color: #fff; box-shadow: 0 0 0 2px var(--surface); }
.scard .oggi-dot svg { width: 13px; height: 13px; }
.scard .oggi-dot.ok { background: var(--green); }
.scard .oggi-dot.no { background: var(--orange); }
.tile.new-ins .ic { background: var(--surface); color: var(--blue); border: 2px solid var(--blue); }
.tile.ins .ic { background: var(--c); }
.ins-cols { display: flex; flex-wrap: wrap; gap: 10px; padding: 6px 2px; }
.ins-col { width: 40px; height: 40px; border-radius: 50%; border: 3px solid var(--surface); background: var(--c); box-shadow: 0 0 0 1px var(--line); padding: 0; }
.ins-col.on { box-shadow: 0 0 0 3px var(--c); }
.ins-icos { display: flex; flex-wrap: wrap; gap: 8px; padding: 6px 2px; }
.ins-ico { width: 46px; height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--c); display: grid; place-items: center; padding: 0; }
.ins-ico svg { width: 26px; height: 26px; }
.ins-ico.on { background: var(--c); color: #fff; border-color: var(--c); }
.ins-prev { width: 150px; margin: 0 auto 14px; pointer-events: none; }
.ins-prev .ic { background: var(--c); }
.ins-fields { display: flex; flex-direction: column; gap: 14px; }

.hl { display: grid; grid-template-columns: 1fr; gap: 8px; margin-top: 8px; }
@media (min-width: 700px) { .hl { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.hl-btn { border: 2px solid var(--red); border-radius: 10px; padding: 4px; background: var(--surface); }
.hl-btn > div { display: flex; align-items: center; gap: 12px; border-radius: 7px; background: var(--blue-t); padding: 8px 12px; text-align: center; }
.hl-btn .ic { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: var(--c); flex: none; }
.hl-btn .ic svg { width: 30px; height: 30px; }
.hl-btn .t { flex: 1; min-width: 0; }
.hl-btn .t b { display: block; color: var(--navy); font-size: 16px; line-height: 1.2; }
.hl-btn .t small { display: block; font-size: 14px; color: var(--text); }

.outline-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.ol-btn { border: 2px solid var(--blue); background: var(--surface); border-radius: 8px; padding: 6px 8px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--navy); font-size: 14px; line-height: 1.15; text-align: center; }
.ol-btn svg { width: 28px; height: 28px; color: var(--navy); flex: none; }
.ol-btn span { min-width: 0; }
.ol-btn small { display: block; margin-top: 3px; font-size: 11.5px; font-weight: 400; line-height: 1.15; color: var(--text); }

.infobox { margin-top: 8px; background: var(--blue-t); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr; gap: 6px; font-size: 13px; }
@media (min-width: 640px) { .infobox { grid-template-columns: 1fr 1fr; } }
.infobox .row { display: flex; gap: 8px; align-items: flex-start; }
.infobox svg { width: 20px; height: 20px; flex: none; }
.infobox b { color: var(--blue); }
/* finestra "Ordina" delle Azioni rapide */
.ord-row { cursor: default; user-select: none; -webkit-user-select: none; }
.ord-row > span { flex: 1; min-width: 0; }
.ord-row .ord-handle { touch-action: none; cursor: grab; width: 34px; height: 40px; display: grid; place-items: center; font-size: 22px; line-height: 1; color: var(--muted); }
.ord-row.dragging { background: var(--blue-t); box-shadow: 0 6px 18px rgba(0,0,0,.2); position: relative; z-index: 3; border-radius: 10px; }
.ord-btns { display: flex; gap: 0; flex: none; }
.ord-btns .icon-btn { width: 38px; height: 38px; }
.ord-btns .icon-btn:disabled { opacity: .25; }
.info-link { width: 100%; border: 0; text-align: left; color: var(--text); font-size: 14px; }
.info-link .row svg:last-child { color: var(--blue); }

/* ---------- TAB BAR ---------- */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar nav { max-width: 1040px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); height: var(--tabbar-h); }
.tabbar button { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; color: var(--muted); font-size: 11.5px; padding: 4px 2px; line-height: 1.1; text-align: center; white-space: nowrap; }
.tabbar button .ib { position: relative; display: grid; place-items: center; width: 28px; height: 28px; }
.tabbar button .ib svg { width: 26px; height: 26px; }
.tabbar button .lb { display: block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.tabbar button.on { color: var(--blue); font-weight: 700; }
/* pallino con i passi di oggi (es. 3/8) sull'angolo dell'icona «Chiusura», mai sopra la scritta */
.tabbar button .bdg { position: absolute; top: -6px; right: -13px; min-width: 17px; height: 17px; padding: 0 4px; border-radius: 9px; background: var(--modo, var(--blue)); color: #fff; font-size: 9.5px; font-weight: 800; line-height: 17px; text-align: center; letter-spacing: -.02em; box-shadow: 0 0 0 2px var(--surface); }
.tabbar button.done .ib { color: var(--green); }
/* tasto centrale «Inserisci»: cerchio pieno del colore della modalità */
.tabbar button.ins { color: var(--modo, var(--blue)); font-weight: 700; padding: 3px 1px; }
.tabbar button.ins .ic { width: 42px; height: 42px; border-radius: 50%; background: var(--modo, var(--blue)); color: #fff; display: grid; place-items: center; box-shadow: 0 4px 12px color-mix(in srgb, var(--modo, var(--blue)) 40%, transparent); }
.tabbar button.ins .ic svg { width: 26px; height: 26px; }
.tabbar button.ins:active .ic { transform: scale(.94); }

/* ---------- INNER SCREENS ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--c, var(--blue)); color: #fff; }
.topbar .in { max-width: 1040px; margin: 0 auto; display: flex; align-items: center; gap: 6px; padding: 8px 8px; min-height: 58px; }
.topbar .icon-btn { color: #fff; }
.topbar .icon-btn:active { background: rgba(255,255,255,.18); }
.topbar h1 { margin: 0; font-size: 19px; font-weight: 700; flex: 1; min-width: 0; line-height: 1.15; }
.topbar h1 small { display: block; font-size: 13px; font-weight: 500; opacity: .9; }
.screen { padding-block: 12px 24px; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); }
.panel + .panel, .panel + .block, .block + .panel { margin-top: 12px; }
.block { margin-top: 12px; }
.panel h3 { margin: 0 0 10px; font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.monthnav button { border: 0; background: transparent; width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--c, var(--blue)); }
.monthnav button svg { width: 22px; height: 22px; }
.monthnav .lbl { flex: 1; text-align: center; font-weight: 700; font-size: 16px; border: 0; background: transparent; height: 40px; color: var(--text); }

.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 640px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--tint, var(--surface)); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.kpi .k { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.kpi .v { font-size: 21px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; overflow-wrap: anywhere; }
.kpi .d { font-size: 13px; margin-top: 2px; }
.kpi.main { grid-column: 1 / -1; background: var(--tint); }
.kpi.main .v { font-size: 28px; color: var(--c); }

.toolbar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.search { flex: 1; min-width: 160px; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 0 10px; height: 46px; }
.search svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.search input { border: 0; outline: 0; background: transparent; flex: 1; min-width: 0; height: 100%; font-size: 16px; }
.chips { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 20px; padding: 7px 12px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--c, var(--blue)); border-color: var(--c, var(--blue)); color: #fff; }

.list { margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
.group-h { display: flex; justify-content: space-between; font-size: 13px; color: var(--muted); padding: 8px 4px 0; text-transform: uppercase; letter-spacing: .03em; }
.item { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; text-align: left; width: 100%; }
.item:active { background: var(--surface-2); }
.item .dot { width: 42px; height: 42px; border-radius: 12px; background: var(--tint); color: var(--c); display: grid; place-items: center; flex: none; font-weight: 700; font-size: 13px; line-height: 1; text-align: center; }
.item .dot b { display: block; font-size: 17px; }
.item .mid { flex: 1; min-width: 0; }
.item .mid b { display: block; font-weight: 600; white-space: normal; line-height: 1.25; overflow-wrap: anywhere; }
.item .mid small { display: block; color: var(--muted); font-size: 13px; white-space: normal; line-height: 1.3; overflow-wrap: anywhere; }
.item .amt { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; white-space: nowrap; }
.item .amt small { display: block; font-weight: 500; font-size: 12px; color: var(--muted); }
.pill { display: inline-block; font-size: 11px; font-weight: 700; border-radius: 10px; padding: 2px 8px; background: var(--grey-t); color: var(--grey); text-transform: uppercase; letter-spacing: .03em; }
.pill.ok { background: var(--green-t); color: var(--green); }
.pill.warn { background: var(--orange-t); color: var(--orange); }
.pill.bad { background: var(--red-t); color: var(--red); }

.empty { text-align: center; padding: 30px 16px; color: var(--muted); background: var(--surface); border: 1px dashed var(--line); border-radius: var(--radius); }
.empty svg { width: 48px; height: 48px; color: var(--c, var(--blue)); opacity: .8; }
.empty b { display: block; color: var(--text); font-size: 16px; margin: 6px 0 4px; }

.fab { position: fixed; right: 16px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 25; border: 0; border-radius: 30px; background: var(--c, var(--blue)); color: #fff; height: 56px; padding: 0 22px 0 16px; display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.22); }
.fab svg { width: 26px; height: 26px; }

/* buttons */
.btn { border: 0; border-radius: 12px; padding: 0 16px; min-height: 48px; font-size: 16px; font-weight: 700; background: var(--c, var(--blue)); color: #fff; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn svg { width: 22px; height: 22px; }
.btn.ghost { background: var(--surface); color: var(--c, var(--blue)); border: 1px solid var(--line); }
.btn.danger { background: var(--red-t); color: var(--red); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; }
.btn-row { display: flex; gap: 8px; flex-wrap: wrap; }
.btn-row .btn { flex: 1; }

/* ---------- SHEET / FORM ---------- */
.overlay { position: fixed; inset: 0; z-index: 60; background: rgba(10, 18, 40, .45); display: flex; align-items: flex-end; justify-content: center; animation: fade .15s ease-out; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: calc(100% - 24px - env(safe-area-inset-top, 0px)); border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; animation: up .2s ease-out; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 18px; max-height: 88vh; } }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 16px; background: var(--c, var(--blue)); color: #fff; }
.sheet-h h3 { margin: 0; flex: 1; font-size: 18px; }
.sheet-h .icon-btn { color: #fff; }
.sheet-b { padding: 14px 16px; overflow-y: auto; flex: 1; }
.sheet-f { padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-f .btn { flex: 1; }
@keyframes up { from { transform: translateY(30px); opacity: .5; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .overlay, .sheet { animation: none; } }

.fgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; grid-column: span 2; min-width: 0; }
.field.half { grid-column: span 1; }
/* selettori a due voci dentro un campo a metà larghezza («Senza IVA / Con IVA»): scritte più compatte, così stanno su una riga */
.field.half .seg button { font-size: 13px; padding: 10px 2px; letter-spacing: -.01em; min-width: 0; }
.field label { font-size: 13px; font-weight: 600; color: var(--muted); }
.field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 0 12px; height: 50px; font-size: 17px; outline: 0; }
.field textarea { height: auto; min-height: 76px; padding: 10px 12px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--c, var(--blue)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c, var(--blue)) 20%, transparent); }
.field.big input { height: 60px; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.field .hint { font-size: 12px; color: var(--muted); }
.field.err input { border-color: var(--red); }
.money { position: relative; }
.money::before { content: "€"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--muted); font-weight: 600; pointer-events: none; }
.money input { padding-left: 30px; }
.inline { display: flex; gap: 6px; }
.inline > *:first-child { flex: 1; min-width: 0; }
.inline .btn { min-height: 50px; padding: 0 12px; }
.calc-box { grid-column: span 2; background: var(--tint, var(--blue-t)); border-radius: 12px; padding: 10px 12px; display: grid; gap: 4px; }
.calc-box .r { display: flex; justify-content: space-between; gap: 8px; font-variant-numeric: tabular-nums; }
.calc-box .r b { font-size: 17px; white-space: nowrap; }
.calc-box.plain { background: transparent; padding: 0; }
.seg { display: flex; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: transparent; border-radius: 9px; padding: 10px 6px; font-weight: 600; font-size: 14px; color: var(--muted); }
.seg button.on { background: var(--c, var(--blue)); color: #fff; }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 8px 0; }
.switch input { width: 26px; height: 26px; min-width: 26px; min-height: 26px; flex: 0 0 26px; margin: 0; accent-color: var(--c, var(--blue)); }
.switch > span { flex: 1 1 auto; min-width: 0; }

/* tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: right; white-space: nowrap; }
.tbl th:first-child, .tbl td:first-child { text-align: left; }
.tbl th { font-size: 12px; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); background: var(--surface-2); font-weight: 700; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tfoot td { font-weight: 800; background: var(--surface-2); }
/* griglia dei turni: ogni cella leggermente contornata */
.tbl.grid th, .tbl.grid td { border: 1px solid color-mix(in srgb, var(--purple) 28%, var(--line)); }
.tbl.grid tr:last-child td { border-bottom: 1px solid color-mix(in srgb, var(--purple) 28%, var(--line)); }
.tbl.grid th:first-child, .tbl.grid td:first-child { border-left: 0; }
.tbl.grid th:last-child, .tbl.grid td:last-child { border-right: 0; }
.tbl.grid tr:first-child th { border-top: 0; }
/* colonne della griglia tutte uguali: larghezze fisse dal colgroup, testo centrato */
.tbl.grid { table-layout: fixed; width: max-content; min-width: 100%; }
.tbl.grid th, .tbl.grid td { overflow: hidden; text-overflow: ellipsis; padding-inline: 4px; text-align: center; }
.tbl.grid th:first-child, .tbl.grid td:first-child { text-align: center; padding-inline: 4px; }
.tbl.grid td .chip { padding-inline: 2px; }
.tbl.grid td.pers { background: var(--tint); color: var(--c); font-weight: 700; }
.tbl.grid td.pers b { color: var(--c); }
.tbl.grid tr.ore td { background: color-mix(in srgb, var(--tint) 45%, var(--surface)); }
.storico-mese summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.storico-mese summary::-webkit-details-marker { display: none; }
.storico-mese summary .chev { margin-left: auto; width: 22px; height: 22px; flex: none; transition: transform .2s; color: var(--muted); }
.storico-mese summary small { font-size: 12.5px; line-height: 1.3; }
.storico-mese[open] summary .chev { transform: rotate(90deg); }
.storico-mese + .storico-mese { border-top: 1px solid var(--line); }

/* charts */
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .grid { stroke: var(--line); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; margin-top: 6px; }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }

/* menu list (Altro, drawer) */
.menu { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.menu + .menu-h { margin-top: 18px; }
.menu-h { font-size: 13px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin: 4px 4px 8px; }
.mi { width: 100%; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border: 0; background: transparent; text-align: left; border-bottom: 1px solid var(--line); min-height: 56px; }
.mi:last-child { border-bottom: 0; }
.mi:active { background: var(--surface-2); }
.mi .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--tint); color: var(--c); display: grid; place-items: center; flex: none; }
.mi .ic svg { width: 22px; height: 22px; }
.mi span { flex: 1; min-width: 0; }
.mi span small { display: block; color: var(--muted); font-size: 12.5px; }
.mi > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }

.drawer-ov { position: fixed; inset: 0; z-index: 70; background: rgba(10, 18, 40, .45); animation: fade .15s; }
.drawer { position: absolute; top: 0; bottom: 0; left: 0; width: min(86vw, 340px); background: var(--bg); overflow-y: auto; padding: calc(14px + env(safe-area-inset-top, 0px)) 12px 24px; box-shadow: 4px 0 24px rgba(0,0,0,.2); }
.drawer .brandmini { font-size: 24px; font-weight: 800; color: var(--navy); margin: 4px 6px 12px; }
.drawer .brandmini span { color: var(--blue); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 84px); transform: translateX(-50%); z-index: 90; background: var(--toast); color: #fff; padding: 12px 18px; border-radius: 12px; font-size: 15px; box-shadow: 0 6px 20px rgba(0,0,0,.25); max-width: calc(100% - 32px); text-align: center; animation: up .2s; }
.toast.modo { background: var(--c); font-size: 17px; font-weight: 800; padding: 16px 22px; border-radius: 16px; display: flex; align-items: center; gap: 10px; letter-spacing: .01em; width: max-content; }
.toast.modo svg { width: 26px; height: 26px; flex: 0 0 auto; }
.toast.modo small { display: block; font-size: 13px; font-weight: 600; opacity: .9; margin-top: 2px; }

/* ---------- CASH COUNTER ---------- */
.cash-row { display: grid; grid-template-columns: 88px 1fr 110px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.cash-row:last-child { border-bottom: 0; }
.note { height: 44px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: 17px; color: #1b2433; border: 1px solid rgba(0,0,0,.12); }
.coin { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #3a2a00; margin: 0 auto; border: 1px solid rgba(0,0,0,.15); }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button { width: 42px; height: 44px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 22px; font-weight: 700; color: var(--c, var(--blue)); flex: none; }
.stepper input { width: 100%; min-width: 0; height: 44px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; background: var(--surface); }
.cash-row .sub { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.cash-total { position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); background: var(--c); color: #fff; border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; margin-top: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
.cash-total b { font-size: 26px; font-variant-numeric: tabular-nums; }

/* ---------- CALCULATOR ---------- */
.calcpad { position: fixed; z-index: 80; right: 12px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 12px); width: min(340px, calc(100vw - 24px)); background: #1e2433; color: #fff; border-radius: 20px; box-shadow: 0 14px 40px rgba(0,0,0,.4); padding: 12px; animation: up .18s; }
.calcpad .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.calcpad .bar span { font-size: 13px; opacity: .7; }
.calcpad .bar button { border: 0; background: rgba(255,255,255,.1); color: #fff; border-radius: 10px; height: 34px; padding: 0 10px; font-size: 13px; }
.calcpad .disp { text-align: right; padding: 4px 6px 10px; min-height: 76px; }
.calcpad .expr { font-size: 15px; opacity: .65; min-height: 20px; overflow-wrap: anywhere; }
.calcpad .res { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.calcpad .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calcpad .keys button { height: 54px; border: 0; border-radius: 14px; background: #2f3748; color: #fff; font-size: 22px; }
.calcpad .keys button.op { background: #3c4a6b; color: #9ec1ff; }
.calcpad .keys button.eq { background: var(--blue); color: #fff; }
.calcpad .keys button.fn { background: #444c5c; font-size: 18px; }
.calcpad .keys button:active { filter: brightness(1.25); }
.calc-mini { position: fixed; z-index: 80; right: 12px; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 12px); border: 0; background: #1e2433; color: #fff; border-radius: 28px; height: 52px; padding: 0 16px 0 10px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.35); font-weight: 700; font-variant-numeric: tabular-nums; }
.calc-mini svg { width: 26px; height: 26px; }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.cal .dh { text-align: center; font-size: 12px; color: var(--muted); font-weight: 700; padding: 4px 0; }
.cal button { aspect-ratio: 1; max-width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 15px; padding: 0; }
.cal button.out { visibility: hidden; }
.cal button.today { border-color: var(--c); color: var(--c); font-weight: 800; }
.cal button.sel { background: var(--c); color: #fff; }
.cal button i { display: block; height: 6px; width: 6px; border-radius: 3px; background: var(--c); }
.cal button.sel i { background: #fff; }
.cal button small { font-size: 10px; line-height: 1; }

.preview-doc { background: #fff; color: #111; border-radius: 8px; padding: 16px; font-size: 13px; border: 1px solid var(--line); }
.preview-doc h4 { margin: 0 0 4px; font-size: 16px; }
.preview-doc table { width: 100%; border-collapse: collapse; margin-top: 10px; font-variant-numeric: tabular-nums; }
.preview-doc th, .preview-doc td { border-bottom: 1px solid #ddd; padding: 5px 6px; text-align: right; }
.preview-doc th:first-child, .preview-doc td:first-child { text-align: left; }

.notice { background: var(--yellow-t); border-radius: 12px; padding: 10px 12px; font-size: 13.5px; display: flex; gap: 8px; align-items: flex-start; }
.notice svg { width: 20px; height: 20px; flex: none; color: var(--orange); }
/* modulo bar: listino, comande, interruttori */
.switches { display: flex; flex-direction: column; }
.switches .switch { border-bottom: 1px solid var(--line); }
.switches .switch:last-child { border-bottom: 0; }
.switches .switch b { display: block; font-size: 15px; }
.switches .switch small { display: block; color: var(--muted); font-size: 12.5px; }
.switches .switch input:disabled { opacity: .4; }
.item.off { opacity: .55; }
.btn.small { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.small svg { width: 18px; height: 18px; }
.com-tavoli { flex-wrap: wrap; margin-bottom: 10px; }
.com-tavoli button { flex: 1 1 auto; }
.com-cerca { margin-top: 2px; }
.com-cats { margin-top: 4px; }
.com-cats .chip .n { display: inline-grid; place-items: center; min-width: 20px; height: 20px; border-radius: 10px; background: #fff; color: var(--brown); font-size: 12px; font-weight: 700; margin-left: 6px; padding: 0 5px; }
.com-cats .chip:not(.on) .n { background: var(--brown); color: #fff; }
.com-picker { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.com-row { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.com-row.on { border-color: color-mix(in srgb, var(--brown) 55%, var(--line)); background: var(--brown-t); }
.com-name { flex: 1; min-width: 0; border: 0; background: transparent; text-align: left; padding: 4px 0; }
.com-name b { display: block; font-weight: 600; font-size: 15px; }
.com-name small { display: block; color: var(--muted); font-size: 12.5px; }
.com-qty { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.com-qty button { width: 38px; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 20px; font-weight: 700; color: var(--brown); }
.com-qty .q { min-width: 26px; text-align: center; font-size: 17px; color: var(--muted); font-variant-numeric: tabular-nums; }
.com-qty .q.on { color: var(--text); }
.com-note { width: 36px; height: 36px; border: 0; background: transparent; color: var(--muted); border-radius: 10px; display: grid; place-items: center; flex: none; }
.com-note svg { width: 18px; height: 18px; }
.com-tot { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }

/* ---------- colore che segue la modalità (richiesta del 26/10/2026): blu Tabaccheria, marrone Bar, verde Bar Tabacchi ---------- */

/* ContabilyTab — utility comuni: formattazione, date, DOM, finestre */
(function () {
  'use strict';
  const CT = (window.CT = window.CT || {});

  // ---------- numeri e valuta ----------
  const fmtEUR = new Intl.NumberFormat('it-IT', { style: 'currency', currency: 'EUR', minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtNum = new Intl.NumberFormat('it-IT', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const fmtInt = new Intl.NumberFormat('it-IT', { maximumFractionDigits: 2 });
  CT.r2 = (n) => Math.round((Number(n) || 0) * 100 + Number.EPSILON * 100) / 100;
  CT.eur = (n) => { const v = CT.r2(n); return (v < 0 ? '-€ ' : '€ ') + fmtNum.format(Math.abs(v)); };
  CT.eurShort = (n) => {
    const a = Math.abs(n);
    if (a >= 1e6) return '€ ' + fmtInt.format(CT.r2(n / 1e6)) + ' Mln';
    if (a >= 1e4) return '€ ' + fmtInt.format(Math.round(n / 100) / 10) + 'k';
    return CT.eur(n);
  };
  CT.num = (n) => fmtNum.format(CT.r2(n));
  CT.qty = (n) => fmtInt.format(Number(n) || 0);
  // interpreta "1.234,56" / "1234.56" / "12,5"
  CT.parseNum = (v) => {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    if (v == null) return 0;
    let s = String(v).trim().replace(/[€\s]/g, '');
    if (!s) return 0;
    if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
    else if ((s.match(/\./g) || []).length > 1) s = s.replace(/\./g, '');
    const n = parseFloat(s);
    return isFinite(n) ? n : 0;
  };
  CT.pct = (cur, prev) => {
    if (!prev) return cur ? null : 0;
    return ((cur - prev) / Math.abs(prev)) * 100;
  };
  CT.fmtPct = (p) => (p == null ? 'n.d.' : (p > 0 ? '+' : '') + fmtInt.format(Math.round(p * 10) / 10) + '%');
  CT.sum = (arr, f) => CT.r2(arr.reduce((a, x) => a + (typeof f === 'function' ? Number(f(x)) || 0 : Number(x[f]) || 0), 0));

  // ---------- date (stringhe ISO locali YYYY-MM-DD) ----------
  const pad = (n) => String(n).padStart(2, '0');
  CT.pad = pad;
  CT.iso = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
  CT.today = () => CT.iso(new Date());
  CT.toDate = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1, 12); };
  CT.addDays = (s, n) => { const d = CT.toDate(s); d.setDate(d.getDate() + n); return CT.iso(d); };
  CT.ym = (s) => String(s).slice(0, 7);
  CT.addMonths = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  CT.daysInMonth = (ym) => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
  CT.MESI = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
  CT.MESI3 = ['Gen', 'Feb', 'Mar', 'Apr', 'Mag', 'Giu', 'Lug', 'Ago', 'Set', 'Ott', 'Nov', 'Dic'];
  CT.GIORNI = ['Domenica', 'Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì', 'Sabato'];
  CT.GIORNI3 = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
  CT.monthLabel = (ym) => { const [y, m] = ym.split('-').map(Number); return CT.MESI[m - 1] + ' ' + y; };
  CT.monthShort = (ym) => { const [y, m] = ym.split('-').map(Number); return CT.MESI3[m - 1] + ' ' + String(y).slice(2); };
  CT.dateIT = (s) => { if (!s) return ''; const [y, m, d] = String(s).split('-'); return d + '/' + m + '/' + y; };
  CT.dateLong = (s) => { const d = CT.toDate(s); return CT.GIORNI[d.getDay()] + ' ' + d.getDate() + ' ' + CT.MESI[d.getMonth()] + ' ' + d.getFullYear(); };
  CT.dateShort = (s) => { const d = CT.toDate(s); return CT.GIORNI3[d.getDay()] + ' ' + d.getDate() + ' ' + CT.MESI3[d.getMonth()]; };
  // settimana ISO: lunedì come primo giorno
  CT.weekStart = (s) => { const d = CT.toDate(s); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return CT.iso(d); };
  CT.weekLabel = (start) => { const end = CT.addDays(start, 6); const a = CT.toDate(start), b = CT.toDate(end); return a.getDate() + ' ' + CT.MESI3[a.getMonth()] + ' – ' + b.getDate() + ' ' + CT.MESI3[b.getMonth()] + ' ' + b.getFullYear(); };
  CT.isoWeekNo = (s) => { const d = CT.toDate(s); d.setDate(d.getDate() + 3 - ((d.getDay() + 6) % 7)); const w1 = new Date(d.getFullYear(), 0, 4, 12); return 1 + Math.round(((d - w1) / 864e5 - 3 + ((w1.getDay() + 6) % 7)) / 7); };
  CT.minutes = (hhmm) => { if (!hhmm) return null; const [h, m] = hhmm.split(':').map(Number); return h * 60 + (m || 0); };
  CT.hoursFmt = (h) => { const tot = Math.round((h || 0) * 60); return Math.floor(tot / 60) + 'h ' + pad(tot % 60) + 'm'; };

  CT.uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  CT.esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  CT.norm = (s) => String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');

  // ---------- DOM ----------
  CT.h = function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      const v = attrs[k];
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (k in el && k !== 'list' && k !== 'type') { try { el[k] = v; } catch (e) { el.setAttribute(k, v); } }
      else el.setAttribute(k, v === true ? '' : v);
    }
    const add = (c) => {
      if (c == null || c === false) return;
      if (Array.isArray(c)) return c.forEach(add);
      el.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
    };
    kids.forEach(add);
    return el;
  };
  CT.svg = (name, cls) => { const s = CT.icons[name] || CT.icons.dots; const t = document.createElement('template'); t.innerHTML = s.trim(); const el = t.content.firstChild; if (cls) el.setAttribute('class', cls); el.setAttribute('aria-hidden', 'true'); return el; };

  // ---------- toast ----------
  let toastT;
  CT.toast = (msg, ms = 2400) => {
    document.querySelectorAll('.toast').forEach((t) => t.remove());
    const t = CT.h('div', { class: 'toast', role: 'status' }, msg);
    document.body.appendChild(t);
    clearTimeout(toastT);
    toastT = setTimeout(() => t.remove(), ms);
  };

  // ---------- finestre (sheet) ----------
  CT.sheets = [];
  CT.sheet = function ({ title, color = 'blue', body, footer, onClose, wide, locked }) {
    const close = () => {
      ov.remove();
      CT.sheets = CT.sheets.filter((s) => s !== api);
      onClose && onClose();
      if (CT._homeDirty && !CT.sheets.length && CT.current && CT.current() === 'home') { CT._homeDirty = false; setTimeout(() => { if (!CT.sheets.length && CT.current() === 'home') CT.render(); }, 0); }
    };
    const closeBtn = locked ? null : CT.h('button', { class: 'icon-btn', 'aria-label': 'Chiudi', onclick: close }, CT.svg('x'));
    const sh = CT.h('div', { class: 'sheet c-' + color, role: 'dialog', 'aria-modal': 'true', 'aria-label': title, style: wide ? { maxWidth: '900px' } : null },
      CT.h('div', { class: 'sheet-h' }, CT.h('h3', null, title), closeBtn),
      CT.h('div', { class: 'sheet-b' }, body),
      footer ? CT.h('div', { class: 'sheet-f' }, footer) : null);
    const ov = CT.h('div', { class: 'overlay', onclick: (e) => { if (e.target === ov && !locked) close(); } }, sh);
    document.body.appendChild(ov);
    const api = { close, el: sh };
    CT.sheets.push(api);
    setTimeout(() => { const f = sh.querySelector('input:not([type=hidden]):not([readonly]), select, textarea'); if (f && !('ontouchstart' in window)) f.focus(); }, 60);
    return api;
  };

  CT.chiediTesto = (title, value = '') => new Promise((res) => { let done = false; const inp = CT.h('input', { type: 'text', value, 'aria-label': title }); const fin = (v) => { if (done) return; done = true; s.close(); res(v); }; const s = CT.sheet({ title, body: CT.h('div', { class: 'field' }, inp), footer: [CT.h('button', { class: 'btn ghost', onclick: () => fin(null) }, 'Annulla'), CT.h('button', { class: 'btn', onclick: () => fin(inp.value.trim()) }, 'OK')], onClose: () => fin(null) }); setTimeout(() => inp.focus(), 80); });
  CT.confirm = (msg, { ok = 'Conferma', danger = false, title = 'Conferma' } = {}) => new Promise((res) => {
    let done = false;
    const s = CT.sheet({
      title, color: danger ? 'red' : 'blue',
      body: CT.h('p', { style: { fontSize: '16px', margin: '4px 0' } }, msg),
      footer: [
        CT.h('button', { class: 'btn ghost', onclick: () => { done = true; s.close(); res(false); } }, 'Annulla'),
        CT.h('button', { class: 'btn' + (danger ? ' danger' : ''), onclick: () => { done = true; s.close(); res(true); } }, ok),
      ],
      onClose: () => { if (!done) res(false); },
    });
  });

  CT.prompt = (msg, { value = '', title = 'Inserisci', type = 'text', ok = 'OK' } = {}) => new Promise((res) => {
    let done = false;
    const inp = CT.h('input', { type, value, id: 'prompt-input' });
    const s = CT.sheet({
      title,
      body: CT.h('div', { class: 'field' }, CT.h('label', { for: 'prompt-input' }, msg), inp),
      footer: [
        CT.h('button', { class: 'btn ghost', onclick: () => { done = true; s.close(); res(null); } }, 'Annulla'),
        CT.h('button', { class: 'btn', onclick: () => { done = true; s.close(); res(inp.value); } }, ok),
      ],
      onClose: () => { if (!done) res(null); },
    });
  });

  CT.debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
})();

(function () {
  'use strict';
  const CT = window.CT;
  const DB_NAME = 'contabilytab';
  const DB_VER = 1;
  const COLS = ['corrispettivi', 'chiusure', 'aggi_sett', 'pos', 'cassa', 'spese', 'fatture', 'prodotti', 'inventari', 'ricavicosti', 'versamenti', 'turni', 'dipendenti', 'promemoria', 'movimenti', 'certificazioni', 'personalizzati', 'listino', 'comande', 'quadrature'];
  CT.COLS = COLS;

  const DEFAULT_SETTINGS = {
    titolare: '', attivita: '', piva: '', cf: '', indirizzo: '', citta: '', telefono: '', email: '', codiceRivendita: '',
    aggi: { tabacchi: 10, lotto: 8, gev: 8, servizi: 0 },
    aliquoteIva: [4, 5, 10, 22],
    ivaDefault: 22,
    categorieSpese: ['Merci', 'Utenze', 'Affitto', 'Personale', 'Tasse e tributi', 'Manutenzione', 'Materiale ufficio', 'Trasporti', 'Consulenze', 'Altro'],
    categorieFatture: ['Tabacchi', 'Gratta e Vinci', 'Lotto', 'Merci varie', 'Servizi', 'Utenze', 'Affitto', 'Consulenze', 'Altro'],
    categorieProdotti: ['Tabacchi', 'Complementi di tabacchi', 'Svapo', 'Cartoleria', 'Giocattoli', 'Bevande', 'Dolciumi', 'Ricariche', 'Altro'],
    metodiPagamento: ['Contanti', 'POS', 'Bonifico', 'RID/SDD', 'Assegno', 'Altro'],
    conti: ['Conto impresa'],
    notifiche: { giornaliera: true, oraGiornaliera: '20:30', settimanale: true, giornoSettimanale: 1, oraSettimanale: '09:00', controlloMancanti: true, scadenze: true, controlli: {} },
    avvisiChiusi: {}, // avvisi della campanella eliminati dall'utente: chiave -> giorno in cui e' stato eliminato
    giorniChiusura: [0], // 0 = domenica
    backupAuto: { attivo: true, giorni: 7 }, lastAutoBackup: null, // backup automatico (copia in Download nell'app installata)
    preferiti: [], // azioni scelte da tenere in alto in Home
    tipoAttivita: 'tabaccheria', // tabaccheria | bar | bartabacchi
    moduli: { tabacchi: true, lotto: true, gev: true, servizi: true, bar: false }, // cosa c'e' nel locale (interruttori)
    tavoli: ['Banco', 'Tavolo 1', 'Tavolo 2', 'Tavolo 3', 'Tavolo 4', 'Fuori'], // per le comande del bar
    terminaliPos: ['POS 1'], // nomi dei terminali POS (es. «POS 1 · tabacchi e corrispettivi», «POS 2 · lotterie»)
    claimStile: 'scorri', // riga sotto il titolo in Home: scorri (una volta) | fisso
    ordineAzioni: [], // ordine delle Azioni rapide scelto dall'utente (chiavi dei tasti); vuoto = ordine predefinito
    inserimenti: [], // tasti di inserimento creati dall'utente: {id, nome, tipo, colore, icona}
    blocco: { attivo: false }, // blocco con PIN: resta solo su questo dispositivo, mai nei backup
    backupPwd: '', // password con cui l'app cifra i backup (manuali e automatici): resta solo su questo dispositivo, mai nei backup
    accepted: false, demo: false, theme: 'light', createdAt: null, lastBackup: null,
  };
  CT.DEFAULT_SETTINGS = DEFAULT_SETTINGS;

  const cache = {}; // col -> Map(id -> rec)
  let settings = null;
  let idb = null;
  const listeners = new Set();

  function openIDB() {
    return new Promise((res, rej) => {
      if (!window.indexedDB) return rej(new Error('IndexedDB non disponibile'));
      const r = indexedDB.open(DB_NAME, DB_VER);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('records')) { const s = d.createObjectStore('records', { keyPath: 'id' }); s.createIndex('col', 'col', { unique: false }); }
        if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv', { keyPath: 'k' });
      };
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
      r.onblocked = () => rej(new Error('blocked'));
    });
  }
  const tx = (store, mode, fn) => new Promise((res, rej) => {
    if (!idb) return res(null);
    const t = idb.transaction(store, mode);
    const s = t.objectStore(store);
    const out = fn(s);
    t.oncomplete = () => res(out && out.result !== undefined ? out.result : out);
    t.onerror = () => rej(t.error);
    t.onabort = () => rej(t.error);
  });
  const getAll = (store) => new Promise((res, rej) => {
    if (!idb) return res([]);
    const t = idb.transaction(store, 'readonly');
    const r = t.objectStore(store).getAll();
    r.onsuccess = () => res(r.result || []);
    r.onerror = () => rej(r.error);
  });

  // fallback localStorage (navigatori in modalità privata)
  const LS_KEY = 'contabilytab.fallback';
  let useLS = false;
  let kvCache = {}; // altri valori salvati nel deposito «kv» (es. listino tabacchi importato)
  function lsLoad() { try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null'); } catch (e) { return null; } }
  function lsSave() { try { const data = {}; COLS.forEach((c) => (data[c] = [...cache[c].values()])); localStorage.setItem(LS_KEY, JSON.stringify({ settings, data, kv: kvCache })); } catch (e) { /* ignore */ } }

  const DB = (CT.DB = {
    ready: false,
    async init() {
      COLS.forEach((c) => (cache[c] = new Map()));
      try {
        idb = await openIDB();
        const recs = await getAll('records');
        recs.forEach((r) => { if (cache[r.col]) cache[r.col].set(r.id, r); });
        const kv = await getAll('kv');
        kvCache = {}; kv.forEach((x) => { if (x.k !== 'settings') kvCache[x.k] = x.v; });
        const s = kv.find((x) => x.k === 'settings');
        settings = Object.assign({}, DEFAULT_SETTINGS, s ? s.v : {});
      } catch (e) {
        useLS = true; idb = null;
        const d = lsLoad();
        settings = Object.assign({}, DEFAULT_SETTINGS, d ? d.settings : {});
        if (d && d.data) COLS.forEach((c) => (d.data[c] || []).forEach((r) => cache[c].set(r.id, r)));
        kvCache = (d && d.kv) || {};
      }
      // oggetti annidati: unisci con i default
      settings.aggi = Object.assign({}, DEFAULT_SETTINGS.aggi, settings.aggi || {});
      settings.notifiche = Object.assign({}, DEFAULT_SETTINGS.notifiche, settings.notifiche || {});
      settings.backupAuto = Object.assign({}, DEFAULT_SETTINGS.backupAuto, settings.backupAuto || {});
      settings.moduli = Object.assign({}, DEFAULT_SETTINGS.moduli, settings.moduli || {});
      if (!settings.createdAt) { settings.createdAt = new Date().toISOString(); await DB.saveSettings(); }
      try { await DB.migrateNames(); } catch (e) { console.warn('Adeguamento nomi non riuscito', e); }
      DB.ready = true;
    },
    onChange(fn) { listeners.add(fn); return () => listeners.delete(fn); },
    emit(col) { listeners.forEach((f) => { try { f(col); } catch (e) { console.error(e); } }); },

    all(col) { return [...cache[col].values()]; },
    get(col, id) { return cache[col].get(id) || null; },
    count(col) { return cache[col].size; },
    async put(col, rec) {
      if (!rec.id) rec.id = CT.uid();
      rec.col = col;
      rec.updatedAt = new Date().toISOString();
      if (!rec.createdAt) rec.createdAt = rec.updatedAt;
      cache[col].set(rec.id, rec);
      if (idb) await tx('records', 'readwrite', (s) => s.put(rec)); else lsSave();
      DB.emit(col);
      return rec;
    },
    async putMany(col, recs) {
      recs.forEach((rec) => { if (!rec.id) rec.id = CT.uid(); rec.col = col; rec.updatedAt = rec.updatedAt || new Date().toISOString(); rec.createdAt = rec.createdAt || rec.updatedAt; cache[col].set(rec.id, rec); });
      if (idb) await tx('records', 'readwrite', (s) => { recs.forEach((r) => s.put(r)); }); else lsSave();
      DB.emit(col);
    },
    async del(col, id) {
      cache[col].delete(id);
      if (idb) await tx('records', 'readwrite', (s) => s.delete(id)); else lsSave();
      DB.emit(col);
    },
    async clearAll() {
      COLS.forEach((c) => cache[c].clear());
      if (idb) { await tx('records', 'readwrite', (s) => s.clear()); await tx('kv', 'readwrite', (s) => s.clear()); }
      try { localStorage.removeItem(LS_KEY); } catch (e) { /* */ }
      settings = Object.assign({}, DEFAULT_SETTINGS, { aggi: { ...DEFAULT_SETTINGS.aggi }, notifiche: { ...DEFAULT_SETTINGS.notifiche }, accepted: true, createdAt: new Date().toISOString() });
      await DB.saveSettings();
      DB.emit('*');
    },
    get settings() { return settings; },
    kv(k) { return kvCache[k]; },
    async kvSet(k, v) { kvCache[k] = v; if (idb) await tx('kv', 'readwrite', (s) => s.put({ k, v })); else lsSave(); },
    async saveSettings(patch) {
      if (patch) Object.assign(settings, patch);
      if (idb) await tx('kv', 'readwrite', (s) => s.put({ k: 'settings', v: settings })); else lsSave();
      DB.emit('settings');
    },
    // ---- query di comodo ----
    byMonth(col, ym, field = 'date') { return DB.all(col).filter((r) => (r[field] || '').startsWith(ym)); },
    byRange(col, from, to, field = 'date') { return DB.all(col).filter((r) => r[field] >= from && r[field] <= to); },
    byDate(col, date, field = 'date') { return DB.all(col).filter((r) => r[field] === date); },
    sorted(col, field = 'date', desc = true) { return DB.all(col).sort((a, b) => (a[field] < b[field] ? 1 : a[field] > b[field] ? -1 : 0) * (desc ? 1 : -1)); },
    // ---- esporta/importa tutto ----
    dump() {
      const data = {};
      COLS.forEach((c) => (data[c] = DB.all(c)));
      return { app: 'ContabilyTab', format: 1, exportedAt: new Date().toISOString(), settings: Object.assign({}, settings, { blocco: undefined, backupPwd: undefined }), data };
    },
    async restore(obj, { merge = false } = {}) {
      if (!obj || obj.app !== 'ContabilyTab' || !obj.data) throw new Error('Il file non è un backup ContabilyTab valido.');
      if (!merge) {
        COLS.forEach((c) => cache[c].clear());
        if (idb) await tx('records', 'readwrite', (s) => s.clear());
      }
      for (const c of COLS) { if (Array.isArray(obj.data[c])) await DB.putMany(c, obj.data[c].map((r) => ({ ...r }))); }
      if (obj.settings) { settings = Object.assign({}, DEFAULT_SETTINGS, obj.settings, { accepted: true, blocco: (settings && settings.blocco) || { attivo: false }, backupPwd: (settings && settings.backupPwd) || '' }); settings.backupAuto = Object.assign({}, DEFAULT_SETTINGS.backupAuto, settings.backupAuto || {}); settings.aggi = Object.assign({}, DEFAULT_SETTINGS.aggi, settings.aggi || {}); settings.notifiche = Object.assign({}, DEFAULT_SETTINGS.notifiche, settings.notifiche || {}); }
      await DB.saveSettings();
      try { await DB.migrateNames(); } catch (e) { console.warn('Adeguamento nomi non riuscito', e); }
      DB.emit('*');
    },
    isEmpty() { return COLS.every((c) => cache[c].size === 0); },
    // nomi cambiati nelle versioni successive: adegua impostazioni e record già salvati
    async migrateNames() {
      const OLD = 'Complementi tabacchi', NEW = 'Complementi di tabacchi';
      let touched = false;
      if (Array.isArray(settings.categorieProdotti) && settings.categorieProdotti.includes(OLD)) {
        settings.categorieProdotti = settings.categorieProdotti.filter((c) => c !== OLD || !settings.categorieProdotti.includes(NEW)).map((c) => (c === OLD ? NEW : c));
        touched = true;
      }
      const prod = DB.all('prodotti').filter((r) => r.categoria === OLD);
      if (prod.length) { await DB.putMany('prodotti', prod.map((r) => ({ ...r, categoria: NEW }))); touched = true; }
      if (touched) await DB.saveSettings();
      return touched;
    },
    storageInfo() { return useLS ? 'localStorage (modalità ridotta)' : 'IndexedDB (archivio locale del dispositivo)'; },
  });
})();

/* ContabilyTab — calcoli: riepiloghi, confronti, aggi, marginalità, dati mancanti */
(function () {
  'use strict';
  const CT = window.CT;
  const DB = () => CT.DB;

  const TIPI = {
    tabacchi: { label: 'Tabacchi', color: 'green', icon: 'tobacco', aggioKey: 'tabacchi', incassoLabel: 'Vendita tabacchi (lordo)' },
    lotto: { label: 'Lotto', color: 'orange', icon: 'lotto', aggioKey: 'lotto', incassoLabel: 'Giocate Lotto (raccolta)' },
    gev: { label: 'Gratta e Vinci', color: 'purple', icon: 'scratch', aggioKey: 'gev', incassoLabel: 'Gratta e Vinci venduti' },
    servizi: { label: 'Servizi', color: 'cyan', icon: 'services', aggioKey: 'servizi', incassoLabel: 'Incasso servizi (ricariche, bollettini, ecc.)' },
  };
  CT.TIPI = TIPI;

  // parte in contanti di un incasso con campi importo / contanti / pos (se non ripartito: tutto in contanti)
  CT.contantiDi = (r) => { const imp = Number(r.importo) || 0; if (Number(r.contanti)) return Number(r.contanti); if (Number(r.pos)) return CT.r2(imp - Number(r.pos)); return imp; };
  // aggio di una chiusura: valore inserito a mano, altrimenti % impostata
  CT.aggioDi = (rec) => {
    if (rec.aggio != null && rec.aggio !== '') return CT.r2(rec.aggio);
    const p = (DB().settings.aggi || {})[rec.tipo] || 0;
    return CT.r2((Number(rec.importo) || 0) * p / 100);
  };

  const inRange = (col, from, to, field = 'date') => DB().byRange(col, from, to, field);

  // Aggio maturato di un tipo in un intervallo: chiusure serali + aggi settimanali.
  // Se per una settimana esiste il prospetto settimanale, quello prevale sulle chiusure serali della stessa settimana (niente doppi conteggi).
  CT.aggioRange = function (tipo, from, to) {
    const weekly = DB().all('aggi_sett').filter((r) => r.tipo === tipo);
    const covered = new Set(weekly.map((r) => r.weekStart));
    const wk = CT.sum(weekly.filter((r) => r.weekStart >= from && r.weekStart <= to), 'importo');
    const daily = CT.sum(inRange('chiusure', from, to).filter((r) => r.tipo === tipo && !covered.has(CT.weekStart(r.date))), CT.aggioDi);
    return CT.r2(wk + daily);
  };
  // Totali per un intervallo di date [from, to]
  CT.totals = function (from, to) {
    const ch = inRange('chiusure', from, to);
    const t = {
      corrispettivi: CT.sum(inRange('corrispettivi', from, to), 'importo'),
      aggiTabacchi: CT.aggioRange('tabacchi', from, to),
      aggiLotto: CT.aggioRange('lotto', from, to),
      aggiGev: CT.aggioRange('gev', from, to),
      compensiServizi: CT.aggioRange('servizi', from, to),
      spese: CT.sum(inRange('spese', from, to), 'importo'),
      versamenti: CT.sum(inRange('versamenti', from, to), 'importo'),
      pos: CT.sum(inRange('pos', from, to), 'importo'),
      venditeTabacchi: CT.sum(ch.filter((r) => r.tipo === 'tabacchi'), 'importo'),
      raccoltaLotto: CT.sum(ch.filter((r) => r.tipo === 'lotto'), 'importo'),
      venditeGev: CT.sum(ch.filter((r) => r.tipo === 'gev'), 'importo'),
      incassoServizi: CT.sum(ch.filter((r) => r.tipo === 'servizi'), 'importo'),
      fattureRicevute: CT.sum(inRange('fatture', from, to).filter((f) => f.tipo === 'ricevuta'), 'totale'),
      fattureInviate: CT.sum(inRange('fatture', from, to).filter((f) => f.tipo === 'inviata'), 'totale'),
    };
    const com = inRange('comande', from, to).filter((c) => c.stato === 'pagata');
    t.barTotale = CT.r2(CT.sum(com, CT.comandaTotale));
    t.barCaffetteria = 0; t.barBevande = 0; t.barCibo = 0; t.barContanti = 0; t.barPos = 0;
    com.forEach((c) => { (c.righe || []).forEach((r) => { const v = (Number(r.prezzo) || 0) * (Number(r.qta) || 0); if (r.gruppo === 'caffetteria') t.barCaffetteria += v; else if (r.gruppo === 'bevande') t.barBevande += v; else t.barCibo += v; }); if (c.pagamento === 'pos') t.barPos += CT.comandaTotale(c); else t.barContanti += CT.comandaTotale(c); });
    ['barCaffetteria', 'barBevande', 'barCibo', 'barContanti', 'barPos'].forEach((k) => (t[k] = CT.r2(t[k])));
    const rc = inRange('ricavicosti', from, to);
    t.ricaviExtra = CT.sum(rc, 'ricavo');
    t.costiExtra = CT.sum(rc, 'costo');
    t.aggiTotali = CT.r2(t.aggiTabacchi + t.aggiLotto + t.aggiGev + t.compensiServizi);
    // margine operativo semplice: aggi + compensi + ricavi extra − spese − costi extra
    t.margine = CT.r2(t.aggiTotali + t.ricaviExtra - t.spese - t.costiExtra);
    return t;
  };
  CT.monthTotals = (ym) => CT.totals(ym + '-01', ym + '-' + CT.pad(CT.daysInMonth(ym)));
  CT.yearTotals = (y) => CT.totals(y + '-01-01', y + '-12-31');
  CT.weekTotals = (start) => CT.totals(start, CT.addDays(start, 6));
  CT.dayTotals = (d) => CT.totals(d, d);

  CT.SUMMARY_KEYS = [
    { key: 'corrispettivi', label: 'Corrispettivi', color: 'blue', icon: 'register' },
    { key: 'aggiTabacchi', label: 'Aggi Tabacchi', color: 'green', icon: 'tobacco', mod: 'tabacchi' },
    { key: 'aggiLotto', label: 'Aggi Lotto', color: 'orange', icon: 'lotto', mod: 'lotto' },
    { key: 'aggiGev', label: 'Aggi Gratta e Vinci', color: 'purple', icon: 'scratch', mod: 'gev' },
    { key: 'compensiServizi', label: 'Compensi Servizi', color: 'cyan', icon: 'services', mod: 'servizi' },
    { key: 'barTotale', label: 'Incasso bar', color: 'brown', icon: 'coffee', mod: 'bar' },
    { key: 'barCaffetteria', label: 'Bar · Caffetteria', color: 'brown', icon: 'coffee', mod: 'bar' },
    { key: 'barBevande', label: 'Bar · Bevande e alcolici', color: 'cyan', icon: 'cash', mod: 'bar' },
    { key: 'barCibo', label: 'Bar · Cibo e gelati', color: 'orange', icon: 'cart', mod: 'bar' },
    { key: 'spese', label: 'Spese', color: 'red', icon: 'cart' },
    { key: 'margine', label: 'Margine', color: 'green', icon: 'trend' },
    { key: 'versamenti', label: 'Versamenti', color: 'navy', icon: 'bank' },
    { key: 'pos', label: 'Incassi POS', color: 'blue', icon: 'pos' },
  ];

  // Serie per confronti: tipo 'giorno' | 'settimana' | 'mese' | 'anno'; n periodi che terminano al periodo corrente
  CT.series = function (kind, key, n, endRef) {
    const out = [];
    const today = endRef || CT.today();
    if (kind === 'giorno') {
      for (let i = n - 1; i >= 0; i--) { const d = CT.addDays(today, -i); out.push({ label: CT.dateShort(d), full: CT.dateLong(d), id: d, value: CT.dayTotals(d)[key] }); }
    } else if (kind === 'settimana') {
      const ws = CT.weekStart(today);
      for (let i = n - 1; i >= 0; i--) { const s = CT.addDays(ws, -7 * i); out.push({ label: 'Sett. ' + CT.isoWeekNo(s), full: CT.weekLabel(s), id: s, value: CT.weekTotals(s)[key] }); }
    } else if (kind === 'mese') {
      const ym = CT.ym(today);
      for (let i = n - 1; i >= 0; i--) { const m = CT.addMonths(ym, -i); out.push({ label: CT.monthShort(m), full: CT.monthLabel(m), id: m, value: CT.monthTotals(m)[key] }); }
    } else {
      const y = Number(today.slice(0, 4));
      for (let i = n - 1; i >= 0; i--) { const yy = String(y - i); out.push({ label: yy, full: 'Anno ' + yy, id: yy, value: CT.yearTotals(yy)[key] }); }
    }
    return out;
  };

  // Aggi rimanenti nel mese
  CT.aggiRimanenti = function (ym) {
    const today = CT.today();
    const dim = CT.daysInMonth(ym);
    const isCurrent = CT.ym(today) === ym;
    const dayNow = isCurrent ? Number(today.slice(8, 10)) : dim;
    const prev = CT.monthTotals(CT.addMonths(ym, -1));
    const cur = CT.monthTotals(ym);
    const rows = [
      { key: 'aggiTabacchi', label: 'Tabacchi', color: 'green' },
      { key: 'aggiLotto', label: 'Lotto', color: 'orange' },
      { key: 'aggiGev', label: 'Gratta e Vinci', color: 'purple' },
      { key: 'compensiServizi', label: 'Servizi', color: 'cyan' },
    ].filter((r) => CT.modOn({ aggiTabacchi: 'tabacchi', aggiLotto: 'lotto', aggiGev: 'gev', compensiServizi: 'servizi' }[r.key])).map((r) => {
      const maturato = cur[r.key];
      // giorni di apertura trascorsi (esclusi i giorni di chiusura impostati)
      const closed = DB().settings.giorniChiusura || [];
      let openSoFar = 0, openTotal = 0;
      for (let d = 1; d <= dim; d++) { const wd = CT.toDate(ym + '-' + CT.pad(d)).getDay(); if (closed.includes(wd)) continue; openTotal++; if (d <= dayNow) openSoFar++; }
      const media = openSoFar ? maturato / openSoFar : 0;
      let previsto = isCurrent ? CT.r2(media * openTotal) : maturato;
      if (isCurrent && !maturato && prev[r.key]) previsto = prev[r.key];
      return { ...r, maturato, previsto, rimanente: CT.r2(Math.max(previsto - maturato, 0)), prec: prev[r.key], var: CT.pct(previsto, prev[r.key]), giorniTrascorsi: openSoFar, giorniTotali: openTotal };
    });
    const tot = (k) => CT.sum(rows, k);
    return { rows, maturato: tot('maturato'), previsto: tot('previsto'), rimanente: tot('rimanente'), prec: tot('prec'), dayNow, dim, isCurrent, giorniTrascorsi: rows[0].giorniTrascorsi, giorniTotali: rows[0].giorniTotali };
  };

  // Marginalità mensile sui corrispettivi
  CT.marginalita = function (ym) {
    const t = CT.monthTotals(ym);
    const p = CT.monthTotals(CT.addMonths(ym, -1));
    const y = CT.monthTotals(CT.addMonths(ym, -12));
    const ricavi = CT.r2(t.aggiTotali + t.ricaviExtra);
    const costi = CT.r2(t.spese + t.costiExtra);
    const calc = (x) => ({ ricavi: CT.r2(x.aggiTotali + x.ricaviExtra), costi: CT.r2(x.spese + x.costiExtra), utile: CT.r2(x.aggiTotali + x.ricaviExtra - x.spese - x.costiExtra) });
    const cur = { ricavi, costi, utile: CT.r2(ricavi - costi), pct: ricavi ? CT.r2((ricavi - costi) / ricavi * 100) : 0, corrispettivi: t.corrispettivi, margineSuCorrispettivi: t.corrispettivi ? CT.r2((ricavi - costi) / t.corrispettivi * 100) : 0 };
    return { cur, prev: calc(p), year: calc(y), t };
  };

  // Dati che l'app si aspetta in ogni giorno di apertura: usati dal controllo dati mancanti, dalla campanella e dalle notifiche.
  // "off: true" = non controllato finche' l'utente non lo attiva in Impostazioni -> Notifiche.
  CT.DATI_GIORNO = [
    { k: 'corrispettivi', l: 'Corrispettivi', col: 'corrispettivi', route: 'corrispettivi' },
