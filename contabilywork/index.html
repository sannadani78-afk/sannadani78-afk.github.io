<title>ContabilyWork</title>
<style>
/* ContabilyWork — turni del personale settimana per settimana: mattina/sera, ore, riepilogo del mese. Tutto nel telefono, niente rete. */
:root {
  --bg: #ffffff; --surface: #ffffff; --surface-2: #f5f7fb; --text: #16203a; --muted: #5b6684; --line: #e2e8f3;
  --c: #1f6fe6; --c-t: #eaf2fe; --c-scuro: #1430c4; --c-fondo: #1f6fe6; --oro: #1f6fe6; --titolo: #1430c4; --green: #2c9b3c; --green-t: #ecf7ee; --rol: #1d6fa5; --rol-t: #e3f1fb; --sep: #cfd6e4; --fest: #8a6400; --fest-t: #fff2cc; --red: #e2393a; --red-t: #fdeced; --toast: #16203a;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; --tab-h: 64px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #0f1420; --surface: #171e2d; --surface-2: #1c2436; --text: #e9eefa; --muted: #9aa6c2; --line: #2a3448; --c: #5b9bff; --c-t: #1a2a47; --c-scuro: #8fa6ff; --c-fondo: #2457c5; --oro: #5b9bff; --titolo: #8fa6ff; --green: #4cc463; --green-t: #173022; --rol: #7cc3f0; --rol-t: #16303f; --sep: #3a4560; --fest: #f2c94c; --fest-t: #3a3115; --red: #ff6466; --red-t: #3c1d22; --toast: #33405e; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #0f1420; --surface: #171e2d; --surface-2: #1c2436; --text: #e9eefa; --muted: #9aa6c2; --line: #2a3448; --c: #5b9bff; --c-t: #1a2a47; --c-scuro: #8fa6ff; --c-fondo: #2457c5; --oro: #5b9bff; --titolo: #8fa6ff; --green: #4cc463; --green-t: #173022; --rol: #7cc3f0; --rol-t: #16303f; --sep: #3a4560; --fest: #f2c94c; --fest-t: #3a3115; --red: #ff6466; --red-t: #3c1d22; --toast: #33405e; color-scheme: dark; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.35; }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.top { background: var(--c-fondo); color: #fff; padding-block: 10px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 11; background: var(--c-fondo); }
.marca { background: linear-gradient(180deg, color-mix(in srgb, var(--c) 12%, var(--bg)), var(--bg)); color: var(--text); padding-block: 10px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); text-align: center; }
.marca .barra { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; margin-bottom: 8px; }
.marca .barra > :first-child { justify-self: start; } .marca .barra > :last-child { justify-self: end; }
.marca .barra .pill { padding: 6px 10px; gap: 6px; max-width: 100%; min-width: 0; }
.marca .barra .pill span { white-space: nowrap; }
/* se i tre tasti non entrano nella riga (telefono stretto o caratteri grandi): prima via le icone, poi testo un po' più piccolo */
.marca .barra.stretta .pill svg { display: none; }
.marca .barra.stretta .pill { padding: 6px 9px; }
.marca .barra.strettissima .pill { font-size: 14px; padding: 5px 7px; }
.marca .pill { display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 6px 12px; border-radius: 20px; border: 1px solid var(--line); background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(20,30,60,.10); font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; flex: none; }
.marca button.pill { font-size: 16px; }
.marca .pill svg { width: 22px; height: 22px; flex: none; color: var(--c); }
.marca button.pill:active { background: var(--c-t); }
.marca h2 { margin: 0; font-size: clamp(34px, 9.5vw, 52px); line-height: 1; font-weight: 800; letter-spacing: -.02em; color: var(--titolo); }
.marca h2 span { color: var(--oro); }
.marca .motto { margin: 4px 0 0; font-size: clamp(17px, 4.2vw, 22px); font-weight: 700; color: var(--text); }
.marca .oggi { margin: 4px 0 0; font-size: 16px; color: var(--muted); text-transform: capitalize; }
.cerca-in { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 0 12px; min-height: 48px; margin-bottom: 12px; }
.cerca-in svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
.cerca-in input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 17px; min-width: 0; }
.ris { display: grid; gap: 8px; }
.ris .voce .ic { flex: none; width: 40px; height: 40px; border-radius: 10px; background: var(--c-t); color: var(--c); display: grid; place-items: center; }
.ris .voce .ic svg { width: 22px; height: 22px; }
.top h1 { margin: 0; font-size: 22px; font-weight: 800; }
.top small { display: block; opacity: .9; font-size: 14px; margin-top: 2px; }
main { padding-block: 12px calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 640px; margin: 0 auto; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.panel h3 { margin: 0 0 6px; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.panel h3 span { color: var(--muted); font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; }
.riga { display: grid; grid-template-columns: 78px 1fr 92px; gap: 8px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.riga:last-child { border-bottom: 0; }
.nota { height: 42px; border-radius: 6px; display: grid; place-items: center; font-weight: 800; font-size: 16px; color: #1b2433; border: 1px solid rgba(0,0,0,.12); }
.moneta { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 13px; color: #3a2a00; margin: 0 auto; border: 1px solid rgba(0,0,0,.15); }
.step { display: flex; align-items: center; gap: 4px; min-width: 0; }
.step button { width: 40px; height: 42px; flex: none; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; font-size: 22px; font-weight: 700; color: var(--c); padding: 0; }
.step input { width: 100%; min-width: 0; height: 42px; border: 1px solid var(--line); border-radius: 10px; text-align: center; font-size: 18px; font-weight: 700; background: var(--surface); }
.riga .sub { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; white-space: nowrap; }
.totale { position: sticky; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 8px); background: var(--c); color: #fff; border-radius: 14px; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; box-shadow: 0 6px 18px rgba(0,0,0,.2); margin-bottom: 12px; z-index: 5; }
.totale span { font-weight: 700; letter-spacing: .03em; }
.totale b { font-size: 26px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.campo { display: grid; gap: 4px; margin-bottom: 10px; }
.campo label { font-weight: 600; color: var(--muted); font-size: 14px; }
.soldi { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 0 12px; height: 46px; }
.soldi span { color: var(--muted); margin-right: 6px; }
.soldi input { border: 0; outline: 0; background: transparent; width: 100%; font-size: 18px; font-weight: 700; }
.campo textarea, .campo input.testo { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 46px; width: 100%; }
.conto { background: var(--c-t); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; }
.conto .r { display: flex; justify-content: space-between; gap: 10px; font-variant-numeric: tabular-nums; }
.conto .r b { white-space: nowrap; }
.su { color: var(--green); } .giu { color: var(--red); }
.tasti { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0 12px; }
.btn { flex: 1 1 auto; white-space: nowrap; min-height: 48px; border-radius: 12px; border: 0; background: var(--c-fondo); color: #fff; font-weight: 700; font-size: 16px; padding: 0 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.ghost { background: var(--surface); color: var(--c); border: 1.5px solid var(--line); }
.btn.rosso { background: var(--red-t); color: var(--red); }
.btn svg { width: 20px; height: 20px; flex: none; }
.lista { display: grid; gap: 8px; }
.voce { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.voce .data { flex: none; width: 52px; height: 52px; border-radius: 12px; background: var(--c-t); color: var(--c); display: grid; place-items: center; line-height: 1.05; text-align: center; }
.voce .data b { font-size: 18px; } .voce .data small { font-size: 12px; font-weight: 700; }
.voce .mid { flex: 1; min-width: 0; } .voce .mid b { display: block; } .voce .mid small { color: var(--muted); display: block; }
.voce .imp { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.vuoto { text-align: center; color: var(--muted); padding: 30px 10px; border: 1.5px dashed var(--line); border-radius: 14px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; height: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--surface); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(3, 1fr); z-index: 20; }
.tabbar button { border: 0; background: none; display: grid; place-items: center; align-content: center; gap: 2px; color: var(--muted); font-size: 13px; font-weight: 600; }
.tabbar button svg { width: 24px; height: 24px; }
.tabbar button.on { color: var(--c); }
.foglio-ov { position: fixed; inset: 0; background: rgba(10,15,30,.45); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
.foglio { background: var(--bg); width: 100%; max-width: 640px; max-height: 92vh; border-radius: 18px 18px 0 0; display: flex; flex-direction: column; overflow: hidden; }
.foglio .fh { background: var(--c-fondo); color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.foglio .fh b { font-size: 18px; }
.foglio .fh button { border: 0; background: none; color: #fff; width: 36px; height: 36px; padding: 0; display: grid; place-items: center; }
.foglio .fb { padding: 14px 16px; overflow: auto; }
.foglio .ff { padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; }
table.dett { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
table.dett td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.dett td:nth-child(2), table.dett td:nth-child(3) { text-align: right; white-space: nowrap; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); background: var(--toast); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 60; max-width: 86vw; text-align: center; }
.prosa p { margin: 0 0 10px; } .prosa h4 { margin: 14px 0 6px; }
.prosa ul, ul.punti { margin: 0 0 10px; padding-left: 20px; } .prosa li, ul.punti li { margin-bottom: 6px; }
.prosa .agg { color: var(--muted); font-size: 13px; }
.docs { display: grid; gap: 8px; }
details.doc { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
details.doc summary { list-style: none; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; font-weight: 700; min-height: 48px; }
details.doc summary::-webkit-details-marker { display: none; }
details.doc summary .chev { color: var(--c); font-size: 22px; transition: transform .15s; flex: none; }
details.doc[open] summary .chev { transform: rotate(90deg); }
details.doc > .prosa { padding: 0 14px 4px; border-top: 1px solid var(--line); padding-top: 10px; }
.btn:disabled { opacity: .45; }
.avviso-info { background: var(--c-t); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
.avviso-info p { margin: 0 0 10px; }
.avviso-info .btn { width: 100%; }
.muted { color: var(--muted); } .small { font-size: 13px; }

/* griglia dei turni */
.nav-sett { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.nav-sett button.freccia { flex: none; width: 46px; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--c); font-size: 22px; font-weight: 800; padding: 0; }
.nav-sett .lbl { flex: 1; min-width: 0; height: 46px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--c-t); color: var(--c-scuro); font-weight: 800; text-align: center; padding: 0 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.griglia-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; margin-bottom: 8px; background: var(--surface); }
table.griglia { border-collapse: collapse; font-variant-numeric: tabular-nums; min-width: 100%; }
table.griglia th, table.griglia td { border: 1px solid var(--line); text-align: center; font-size: 13px; padding: 0; }
table.griglia th { background: var(--surface-2); padding: 6px 4px; font-weight: 700; white-space: nowrap; }
table.griglia th.slot { font-weight: 500; color: var(--muted); }
table.griglia td.pers { position: sticky; left: 0; z-index: 1; background: var(--surface); padding: 6px 8px; text-align: left; font-weight: 800; white-space: nowrap; }
table.griglia td.pers i { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
table.griglia th.pers-h { position: sticky; left: 0; z-index: 2; }
table.griglia td.cella button { width: 66px; min-height: 42px; border: 0; background: transparent; color: var(--line); font-size: 13px; font-weight: 700; padding: 2px; line-height: 1.15; }
table.griglia td.cella button.pieno { color: #fff; }
table.griglia td.cella button.libero { color: var(--muted); font-weight: 600; }
table.griglia td.tot { font-weight: 800; padding: 6px 8px; white-space: nowrap; }
table.griglia tr.ore td { color: var(--muted); font-size: 12px; padding: 3px; }
.persona { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.persona:last-child { border-bottom: 0; }
.persona i { width: 22px; height: 22px; border-radius: 50%; flex: none; }
.persona b { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.persona button { flex: none; }
.colori { display: flex; flex-wrap: wrap; gap: 10px; }
.colori button { width: 40px; height: 40px; border-radius: 50%; border: 3px solid transparent; padding: 0; }
.colori button.on { border-color: var(--text); }
.ora { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); height: 46px; padding: 0 10px; font-size: 17px; font-weight: 700; width: 100%; }
.due { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.riep td:last-child { text-align: right; font-weight: 700; }
details.mese { border-top: 1px solid var(--line); padding: 10px 0; }
details.mese summary { cursor: pointer; font-weight: 700; display: flex; justify-content: space-between; gap: 8px; list-style: none; }
details.mese summary::-webkit-details-marker { display: none; }
details.mese summary span { color: var(--muted); font-weight: 600; white-space: nowrap; }

.chips-riga { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; }
.chip { flex: none; border: 1.5px solid var(--line); background: var(--surface); color: var(--text); border-radius: 999px; min-height: 40px; padding: 0 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.chip i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.chip.on { background: var(--c-fondo); border-color: var(--c-fondo); color: #fff; }
.stati { display: flex; flex-wrap: wrap; gap: 8px; }
table.giorn { border-collapse: collapse; width: 100%; table-layout: fixed; font-variant-numeric: tabular-nums; }
table.giorn th { background: var(--c-fondo); color: #fff; font-size: 13px; padding: 8px 4px; text-align: center; line-height: 1.15; border-left: 1px solid color-mix(in srgb, #fff 35%, transparent); }
table.giorn th:first-child { border-left: 0; }
table.giorn td { border-top: 1px solid var(--sep); border-left: 1px solid var(--sep); padding: 8px 4px; text-align: center; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
table.giorn td:first-child { border-left: 0; }
table.giorn tbody tr { cursor: pointer; }
table.giorn tr.dom td { background: var(--surface-2); color: var(--muted); }
table.giorn tr.oggi td { box-shadow: inset 0 2px 0 var(--c), inset 0 -2px 0 var(--c); }
table.giorn td.num { font-weight: 700; }
table.giorn td.gg { text-align: left; padding-left: 12px; }
table.giorn th:first-child { text-align: left; padding-left: 12px; }
@media (max-width: 380px) { table.giorn th, table.giorn td { padding: 8px 2px; font-size: 13px; } table.giorn td.gg, table.giorn th:first-child { padding-left: 8px; } table.giorn .pill { padding: 2px 6px; } }
table.giorn tfoot td { background: var(--c-t); font-weight: 800; border-top: 2px solid var(--c); }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; }
.pill.lavoro { background: var(--c-t); color: var(--c-scuro); }
.pill.libero { background: var(--surface-2); color: var(--muted); }
.pill.ferie { background: var(--green-t); color: var(--green); }
.pill.rol { background: var(--rol-t); color: var(--rol); }
.pill.malattia { background: var(--red-t); color: var(--red); }

/* giornaliera: due tipi */
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 12px; }
.seg button { border: 0; background: transparent; border-radius: 9px; min-height: 42px; font-weight: 700; color: var(--muted); padding: 0 6px; }
.seg button.on { background: var(--c-fondo); color: #fff; }
.pill.riposo { background: var(--surface-2); color: var(--muted); }
.pill.festivita { background: var(--fest-t); color: var(--fest); }
/* orari preimpostati */
.veloci .btn.veloce { flex: 1 1 96px; flex-direction: column; gap: 0; min-height: 58px; line-height: 1.15; font-size: 15px; padding: 0 6px; }
.veloci .btn.veloce small { font-size: 12px; font-weight: 600; color: var(--muted); }
.link { border: 0; background: none; color: var(--c); font-weight: 700; padding: 4px 0 12px; text-decoration: underline; text-underline-offset: 3px; }
.orario { border: 1px solid var(--line); border-radius: 12px; padding: 10px; margin-bottom: 10px; }
.orario-testa { display: flex; gap: 8px; margin-bottom: 8px; }
.orario-testa input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 10px 12px; min-height: 46px; }
.orario .campo { margin-bottom: 0; }
/* turni: come la griglia di ContabilyTab */
.due-tasti .btn { flex: 1 1 0; min-width: 0; white-space: normal; line-height: 1.2; padding: 6px 8px; text-align: center; font-size: 15px; gap: 6px; }
.due-tasti .btn svg { width: 18px; height: 18px; }
.top.con-tasto { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.icona-top { flex: none; width: 44px; height: 44px; border: 0; background: transparent; color: #fff; padding: 0; display: grid; place-items: center; }
.icona-top svg { width: 26px; height: 26px; }
.monthnav { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 4px; }
.monthnav button { border: 0; background: transparent; width: 44px; height: 40px; border-radius: 10px; display: grid; place-items: center; color: var(--c); font-size: 26px; font-weight: 700; padding: 0; }
.monthnav .lbl { flex: 1; width: auto; text-align: center; font-weight: 700; font-size: 16px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
.tbl th, .tbl td { padding: 8px 5px; border-bottom: 1px solid var(--sep); border-left: 1px solid var(--sep); text-align: center; vertical-align: middle; line-height: 1.25; }
.tbl th:first-child, .tbl td:first-child { border-left: 0; }
.tbl th { font-size: 11px; text-transform: uppercase; letter-spacing: .02em; color: var(--muted); background: var(--surface-2); font-weight: 700; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl tfoot td { font-weight: 800; background: var(--surface-2); }
.tbl.grid { table-layout: fixed; width: max-content; min-width: 100%; }
.tbl.grid th, .tbl.grid td { border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); overflow: hidden; text-overflow: ellipsis; padding-inline: 4px; white-space: nowrap; }
.tbl.grid th:first-child, .tbl.grid td:first-child { border-left: 0; }
.tbl.grid th:last-child, .tbl.grid td:last-child { border-right: 0; }
.tbl.grid tr:first-child th { border-top: 0; }
.tbl.grid th.gs { text-transform: none; letter-spacing: 0; }
/* separatore marcato tra un giorno e l'altro */
.tbl.grid .gg-inizio { border-left: 2.5px solid var(--c-scuro) !important; }
.tbl.grid tr.pr td { border-top: 2px solid color-mix(in srgb, var(--c) 45%, var(--line)); }
.tbl.grid th.sl { font-weight: 500; }
.tbl.grid td.cella { padding: 0; }
.tbl.grid td.cella button { width: 100%; min-height: 42px; border: 0; border-radius: 0; background: transparent; color: var(--line); font-size: 13px; font-weight: 700; padding: 0 2px; }
.tbl.grid td.cella button.libero { color: var(--muted); font-weight: 600; }
.tbl.grid td.cella button.pieno { font-weight: 500; }
.tbl.grid tr.pr td.pers b { color: var(--pc); }
.tbl.grid tr.pr td.pers { background: color-mix(in srgb, var(--pc) 16%, var(--surface)); }
.tbl.grid tr.pr td.pers b { color: color-mix(in srgb, var(--pc) 80%, var(--text)); }
.tbl.grid tr.ore td { background: color-mix(in srgb, var(--pc) 7%, var(--surface)); color: var(--muted); font-size: 12px; }
.riga-spunta { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin: 4px 0 12px; }
.spunta { width: 26px; height: 26px; flex: none; accent-color: var(--c); }
.storico-mese summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.storico-mese summary::-webkit-details-marker { display: none; }
.storico-mese summary small { font-size: 12.5px; line-height: 1.3; }
.storico-mese .chev { margin-left: auto; flex: none; font-size: 24px; color: var(--muted); transition: transform .2s; }
.storico-mese[open] .chev { transform: rotate(90deg); }
.storico-mese + .storico-mese { border-top: 1px solid var(--line); }
.storico-mese .tbl td { white-space: nowrap; }
.tbl.fisse { table-layout: fixed; }
.tbl.fisse th, .tbl.fisse td { padding-inline: 2px; overflow-wrap: break-word; white-space: normal; line-height: 1.25; }
.tbl.fisse th { letter-spacing: 0; font-size: 10.5px; }
@media (max-width: 380px) { .tbl.fisse td { font-size: 12px; } }
.mese-dot { width: 42px; height: 42px; border-radius: 12px; background: var(--c-t); color: var(--c); display: grid; place-items: center; font-weight: 700; font-size: 12px; flex: none; }

/* calendario */
.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border: 1px solid var(--sep); border-radius: 12px; overflow: hidden; background: var(--surface); margin-bottom: 12px; }
.cal-testa { background: var(--c-fondo); color: #fff; text-align: center; font-size: 12px; font-weight: 700; padding: 6px 0; border-left: 1px solid color-mix(in srgb, #fff 35%, transparent); }
.cal-testa:nth-child(7n+1) { border-left: 0; }
.cal-giorno, .cal-vuoto { min-height: 66px; border-top: 1px solid var(--sep); border-left: 1px solid var(--sep); background: var(--surface); padding: 4px 3px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cal > :nth-child(7n+1) { border-left: 0; }
.cal-vuoto { background: var(--surface-2); }
.cal-giorno { border-radius: 0; border-right: 0; border-bottom: 0; color: var(--text); font: inherit; cursor: pointer; }
.cal-giorno b { font-size: 14px; }
.cal-giorno.festa { background: var(--surface-2); } .cal-giorno.festa b { color: var(--muted); }
.cal-giorno.oggi b { background: var(--c-fondo); color: #fff; border-radius: 999px; padding: 0 6px; align-self: flex-start; }
.cal-segni { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cal-barra { display: block; height: 13px; border-radius: 4px; font-size: 9px; line-height: 13px; font-weight: 800; color: #1b1b1b; text-align: center; overflow: hidden; white-space: nowrap; }
.cal-segno { display: inline-grid; place-items: center; height: 13px; min-width: 14px; padding: 0 3px; border-radius: 4px; font-size: 9px; font-weight: 800; overflow: hidden; white-space: nowrap; }
.cal-segno.ferie { background: var(--green-t); color: var(--green); } .cal-segno.rol { background: var(--rol-t); color: var(--rol); } .cal-segno.malattia { background: var(--red-t); color: var(--red); }
.cal-segni .cal-segno { display: grid; width: 100%; }
.cal-legenda { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 13px; }
.cal-legenda > span { display: inline-flex; align-items: center; gap: 6px; }
.cal-legenda i { width: 14px; height: 14px; border-radius: 4px; display: inline-block; }
.cal-legenda i.mini { display: none; }
.cal-pers { border-bottom: 1px solid var(--line); padding: 10px 0; }
.cal-pers:last-child { border-bottom: 0; }
.cal-nome { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
.cal-nome i { width: 14px; height: 14px; border-radius: 50%; flex: none; }
.cal-slot { flex-direction: column; gap: 0; min-height: 56px; line-height: 1.15; }
.cal-slot small { font-size: 12px; font-weight: 600; opacity: .8; }
.tabbar button { font-size: 12px; }

/* avvisi e promemoria */
.a-capo .btn { white-space: normal; line-height: 1.2; padding-block: 6px; text-align: center; }
.panel.avvisi { border-color: color-mix(in srgb, var(--red) 45%, var(--line)); background: color-mix(in srgb, var(--red-t) 60%, var(--surface)); }
.panel.avvisi h3 { color: var(--red); }
.panel.avvisi p { margin: 4px 0; font-size: 14px; }
.avviso-fine { display: flex; gap: 10px; align-items: center; background: var(--fest-t); color: var(--fest); border-radius: 12px; padding: 10px 12px; margin-bottom: 12px; font-weight: 700; }
.avviso-fine svg { width: 22px; height: 22px; flex: none; }
td.su { color: var(--green); font-weight: 700; } td.giu { color: var(--red); font-weight: 700; }
/* calcolatrice a scomparsa (come ContabilyTab) */
.calcpad { position: fixed; z-index: 50; right: 12px; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 12px); width: min(340px, calc(100vw - 24px)); background: #1e2433; color: #fff; border-radius: 20px; box-shadow: 0 14px 40px rgba(0,0,0,.4); padding: 12px; }
.calcpad .bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; gap: 6px; }
.calcpad .bar span { font-size: 14px; opacity: .75; }
.calcpad .bar button { border: 0; background: rgba(255,255,255,.12); color: #fff; border-radius: 10px; height: 36px; padding: 0 12px; font-size: 14px; }
.calcpad .disp { text-align: right; padding: 4px 6px 10px; min-height: 76px; }
.calcpad .expr { font-size: 15px; opacity: .65; min-height: 20px; overflow-wrap: anywhere; }
.calcpad .res { font-size: 34px; font-weight: 600; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.calcpad .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.calcpad .keys button { height: 54px; border: 0; border-radius: 14px; background: #2f3748; color: #fff; font-size: 22px; padding: 0; }
.calcpad .keys button.op { background: #3c4a6b; color: #9ec1ff; }
.calcpad .keys button.eq { background: var(--c-fondo); color: #fff; }
.calcpad .keys button.fn { background: #444c5c; font-size: 18px; }
.calcpad .keys button:active { filter: brightness(1.25); }

/* stile «Contabily» (30/10/2026): stessi colori, sfondo grigio-azzurro chiaro, schede con ombra morbida, barra in alto sfumata */
:root:not([data-theme="dark"]) { --bg: #f1f4fa; --line: #e3e8f2; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0f1420; --line: #2a3448; } }
:root[data-theme="dark"] { --bg: #0f1420; --line: #2a3448; }
html, body { background: var(--bg); }
.top { background: linear-gradient(135deg, var(--c-fondo, var(--c)), color-mix(in srgb, var(--c-fondo, var(--c)) 72%, #0b1d5e)); border-radius: 0 0 20px 20px; box-shadow: 0 6px 16px color-mix(in srgb, var(--c) 25%, transparent); }
.panel, .voce, .monthnav, .mesenav, .cal, .tbl-wrap, .griglia-wrap { border-color: transparent !important; box-shadow: 0 1px 2px rgba(20,40,90,.05), 0 6px 18px rgba(20,40,90,.07); }
.panel { border-radius: 16px; }

/* firma */
main::after{content:"by Contabily";display:block;clear:both;text-align:center;font-size:11px;letter-spacing:.04em;color:var(--muted);opacity:.85;padding:16px 0 6px}
.sotto-titolo { margin: 16px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 16px; }
select.testo, input.testo[type="month"], input.testo[type="date"] { width: 100%; min-height: 46px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--text); padding: 10px 12px; font: inherit; }
.ferie-rol .r.fr { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 10px; align-items: baseline; }
.ferie-rol .r.fr b, .ferie-rol .r.fr small { text-align: right; min-width: 64px; white-space: nowrap; }
.ferie-rol .r.fr.testa small { color: var(--muted); font-weight: 700; font-size: 12px; }
.ferie-rol .r.fr > span { min-width: 0; }
.due { align-items: end; }
.mat-info .r { flex-direction: column; align-items: flex-start; gap: 2px; }
.mat-info .r b { white-space: normal; }
/* blocco con PIN */
.pin-ov { position: fixed; inset: 0; z-index: 1000; background: var(--pin-bg, var(--bg, #0f1420)); color: var(--pin-fg, var(--text, var(--fg, #16203a))); display: flex; align-items: center; justify-content: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); overflow: auto; }
.pin-box { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; }
.pin-marca { font-size: 26px; font-weight: 800; letter-spacing: -.01em; color: var(--pin-c, var(--c-scuro, var(--c, var(--gold, #1430c4)))); }
.pin-app { width: 92px; height: 92px; border-radius: 22px; box-shadow: 0 6px 18px rgba(0,0,0,.22); display: block; margin-bottom: 2px; }
.pin-ic { width: 40px; height: 40px; color: var(--pin-c, var(--c, var(--gold, #1f6fe6))); }
.pin-titolo { font-size: 20px; font-weight: 700; }
.pin-msg { margin: 0; min-height: 2.6em; font-size: 14.5px; color: var(--muted, #5b6684); max-width: 300px; }
.pin-punti { display: flex; gap: 18px; justify-content: center; margin: 4px 0 10px; }
.pin-punti i { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--pin-c, var(--c, var(--gold, #1f6fe6))); display: block; }
.pin-punti i.on { background: var(--pin-c, var(--c, var(--gold, #1f6fe6))); }
.pin-punti.scuoti { animation: pin-scuoti .4s; }
@keyframes pin-scuoti { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.pin-tast { display: grid; grid-template-columns: repeat(3, 76px); gap: 14px; justify-content: center; }
.pin-k { width: 76px; height: 76px; border-radius: 50%; border: 1px solid var(--line, #e2e8f3); background: var(--surface, #fff); color: inherit; font-size: 28px; font-weight: 600; display: grid; place-items: center; padding: 0; font-family: inherit; cursor: pointer; }
.pin-k:active { background: var(--c-t, rgba(127,127,127,.2)); }
.pin-k.pin-del { border-color: transparent; background: transparent; font-size: 24px; }
.pin-link { margin-top: 6px; border: 0; background: none; color: var(--pin-c, var(--c, var(--gold, #1f6fe6))); font-weight: 700; font-size: 15px; padding: 8px 12px; font-family: inherit; cursor: pointer; }
.pin-aiuto { width: 100%; }
.pin-det { text-align: left; font-size: 14px; color: var(--muted, #5b6684); display: grid; gap: 8px; }
.pin-det[hidden] { display: none; }
.pin-det p { margin: 0; }
.pin-inp { width: 100%; min-height: 44px; border: 1px solid var(--line, #e2e8f3); border-radius: 10px; padding: 0 12px; background: var(--surface, #fff); color: inherit; font: inherit; }
.pin-canc { min-height: 44px; border: 0; border-radius: 10px; background: var(--red-t, #fdeced); color: var(--red, #e2393a); font-weight: 700; font: inherit; font-weight: 700; cursor: pointer; }
.pin-toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 76px); transform: translateX(-50%); background: var(--toast, #16203a); color: #fff; padding: 10px 16px; border-radius: 12px; z-index: 1001; max-width: 86vw; text-align: center; }
.pin-panel .pin-stato { margin: 0 0 10px; color: var(--muted, #5b6684); font-size: 14px; }
.pin-panel .pin-tasti { display: flex; flex-wrap: wrap; gap: 8px; }
.pin-panel .pin-tasti > * { flex: 1 1 auto; }
@media (max-width: 340px) { .pin-tast { grid-template-columns: repeat(3, 66px); } .pin-k { width: 66px; height: 66px; } }
.pin-codice { font: 700 26px/1.2 ui-monospace, 'SFMono-Regular', Menlo, monospace; letter-spacing: .06em; padding: 14px 16px; border-radius: 14px; border: 2px dashed var(--pin-c, var(--c, var(--gold, #1f6fe6))); background: var(--surface, #fff); white-space: nowrap; max-width: 100%; }
.pin-riga { display: flex; flex-direction: row; align-items: center; justify-content: space-between; gap: 12px; width: 100%; text-align: left; font-weight: 600; padding: 4px 2px; }
.pin-spunta { width: 26px; height: 26px; flex: none; accent-color: var(--pin-c, var(--c, var(--gold, #1f6fe6))); }
.pin-usa { width: 100%; min-height: 48px; border: 0; border-radius: 12px; background: var(--pin-c, var(--c-fondo, var(--c, var(--gold, #1f6fe6)))); color: var(--pin-on, #fff); font: inherit; font-weight: 700; font-size: 16px; cursor: pointer; }
.pin-usa:disabled { opacity: .45; }
.pin-err { margin: 0; min-height: 1.3em; color: var(--red, #e2393a); font-size: 14px; }
.pin-sep { border-top: 1px solid var(--line, #e2e8f3); padding-top: 10px; margin-top: 4px !important; }
@media (max-width: 340px) { .pin-codice { font-size: 22px; } }
html, body { overflow-x: clip; }

<script>
/* Blocco con PIN di 4 cifre (Contabily). Il PIN non viene mai salvato: si salva solo un'impronta (PBKDF2-SHA256, 150.000 giri, con sale casuale).
   Si chiede all'apertura dell'app e ogni volta che ci si torna dopo averla chiusa o messa in secondo piano. 5 tentativi sbagliati → attesa di 30 secondi.
   Codice di ripristino di 12 caratteri (anch'esso salvato solo come impronta) per scegliere un PIN nuovo senza perdere i dati. */
(function () {
  'use strict';
  const CFG = window.CONTABILY_PIN || {}; const NOME = CFG.nome || 'Contabily'; const CHIAVE = (CFG.chiave || 'contabily') + '.pin';
  const DOVE = CFG.dove || 'Info', BACKUP = CFG.backup || (DOVE + ' → Carica backup');
  const LEN = 4, RIBLOCCO_MS = 1500;
  const ALFA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const nuovoCodice = () => { const r = crypto.getRandomValues(new Uint8Array(12)); let c = ''; r.forEach((x, i) => { c += ALFA[x % ALFA.length]; if (i === 3 || i === 7) c += '-'; }); return c; };
  const normCodice = (c) => String(c || '').toUpperCase().replace(/[^A-Z0-9]/g, '').replace(/O/g, '0').replace(/I/g, '1');
  const leggi = () => { try { return JSON.parse(localStorage.getItem(CHIAVE) || 'null'); } catch (e) { return null; } };
  const scrivi = (v) => { try { if (v) localStorage.setItem(CHIAVE, JSON.stringify(v)); else localStorage.removeItem(CHIAVE); } catch (e) { /* */ } };
  const hex = (b) => Array.from(new Uint8Array(b), (x) => x.toString(16).padStart(2, '0')).join('');
  const unhex = (s) => new Uint8Array(s.match(/../g).map((x) => parseInt(x, 16)));
  const ok = () => !!(window.crypto && crypto.subtle);
  async function impronta(pin, saltHex) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveBits']);
    return hex(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: unhex(saltHex), iterations: 150000, hash: 'SHA-256' }, km, 256));
  }
  const attivo = () => { const c = leggi(); return !!(c && c.hash && c.salt); };
  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  // tastierino a schermo intero; titolo, testo; onPin(pin) → true se va bene (chiude), stringa = messaggio d'errore
  function tastierino({ titolo, testo, onPin, chiudibile, extra }) {
    const ov = el('div', 'pin-ov'); ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-label', titolo);
    const box = el('div', 'pin-box');
    const marca = el('div', 'pin-marca', NOME);
    const ic = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); ic.setAttribute('viewBox', '0 0 24 24'); ic.setAttribute('class', 'pin-ic'); ic.setAttribute('aria-hidden', 'true'); ic.innerHTML = '<rect x="5" y="10.5" width="14" height="10" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>';
    const app = CFG.icona ? el('img', 'pin-app') : null; if (app) { app.src = CFG.icona; app.alt = ''; app.setAttribute('aria-hidden', 'true'); }
    const t = el('div', 'pin-titolo', titolo); const msg = el('p', 'pin-msg', testo || ''); msg.setAttribute('role', 'status');
    const punti = el('div', 'pin-punti'); punti.setAttribute('aria-hidden', 'true');
    let pin = '', busy = false;
    const disegna = () => { punti.replaceChildren(...Array.from({ length: LEN }, (_, i) => el('i', i < pin.length ? 'on' : ''))); };
    const chiudi = () => { document.removeEventListener('keydown', tasto, true); ov.remove(); };
    const premi = async (k) => {
      if (busy) return;

      });

      const merges = sh.merges && sh.merges.length ? `<mergeCells count="${sh.merges.length}">${sh.merges.map((m) => `<mergeCell ref="${m}"/>`).join('')}</mergeCells>` : '';
      const pr = sh.landscape ? '<sheetPr><pageSetUpPr fitToPage="1"/></sheetPr>' : '';
      const ps = sh.landscape ? '<pageMargins left="0.4" right="0.4" top="0.5" bottom="0.5" header="0.3" footer="0.3"/><pageSetup orientation="landscape" fitToWidth="1" fitToHeight="0"/>' : '';
      const maxCols = Math.max(1, ...sh.rows.map((r) => r.length));
      const dim = `<dimension ref="A1:${colName(maxCols - 1)}${Math.max(1, sh.rows.length)}"/>`;
      return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">${pr}${dim}<sheetViews><sheetView workbookViewId="0"${sh.freeze ? '><pane ySplit="' + sh.freeze + '" topLeftCell="A' + (sh.freeze + 1) + '" activePane="bottomLeft" state="frozen"/></sheetView' : '/'}></sheetViews><cols>${cols}</cols><sheetData>${rows}</sheetData>${merges}${ps}</worksheet>`;
    };
    // i fogli vanno generati prima di styles.xml, che contiene gli stili creati al volo
    const sheetXmls = sheets.map(sheetXml);
    const files = [];
    files.push({ name: '[Content_Types].xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>${sheets.map((s, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/><Override PartName="/xl/sharedStrings.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sharedStrings+xml"/><Override PartName="/docProps/app.xml" ContentType="application/vnd.openxmlformats-officedocument.extended-properties+xml"/><Override PartName="/docProps/core.xml" ContentType="application/vnd.openxmlformats-package.core-properties+xml"/></Types>` });

    files.push({ name: 'docProps/app.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Properties xmlns="http://schemas.openxmlformats.org/officeDocument/2006/extended-properties"><Application>ContabilyWork</Application></Properties>` });
    files.push({ name: 'docProps/core.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><cp:coreProperties xmlns:cp="http://schemas.openxmlformats.org/package/2006/metadata/core-properties" xmlns:dc="http://purl.org/dc/elements/1.1/" xmlns:dcterms="http://purl.org/dc/terms/" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"><dc:creator>ContabilyWork</dc:creator><dcterms:created xsi:type="dcterms:W3CDTF">${new Date().toISOString()}</dcterms:created></cp:coreProperties>` });
    files.push({ name: 'xl/workbook.xml', data: `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${sheets.map((s, i) => `<sheet name="${xmlEsc(s.name.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>` });

    sheetXmls.forEach((x, i) => files.push({ name: `xl/worksheets/sheet${i + 1}.xml`, data: x }));

  };

  // ---------- PDF (testo + tabelle, font Helvetica WinAnsi) ----------
  const WIN = { '€': 0x80, '‘': 0x91, '’': 0x92, '“': 0x93, '”': 0x94, '–': 0x96, '—': 0x97, '…': 0x85 };
  const pdfStr = (s) => { let out = ''; for (const ch of String(s)) { let c = ch.charCodeAt(0); if (WIN[ch] != null) c = WIN[ch]; else if (c > 255) c = 63; out += c === 0x28 || c === 0x29 || c === 0x5c ? '\\' + ch : c < 32 || c > 126 ? '\\' + c.toString(8).padStart(3, '0') : ch; } return '(' + out + ')'; };
  // larghezze Helvetica approssimate (per allineamento a destra)
  const HW = { ' ': 278, '!': 278, '"': 355, '#': 556, '$': 556, '%': 889, '&': 667, "'": 191, '(': 333, ')': 333, '*': 389, '+': 584, ',': 278, '-': 333, '.': 278, '/': 278, ':': 278, ';': 278, '<': 584, '=': 584, '>': 584, '?': 556, '@': 1015, '[': 278, ']': 278, '_': 556, '€': 556, 'i': 222, 'j': 222, 'l': 222, 'f': 278, 't': 278, 'r': 333, 'I': 278, 'm': 833, 'w': 722, 'M': 833, 'W': 944 };
  const tw = (s, size) => { let w = 0; for (const ch of String(s)) w += HW[ch] != null ? HW[ch] : /[0-9a-z]/.test(ch) ? 556 : /[A-Z]/.test(ch) ? 667 : 556; return (w / 1000) * size; };
  CT.pdfWidth = tw;

  // doc: {title, subtitle, meta:[], sections:[{heading, lines:[], table:{head:[], rows:[[]], align:[], widths:[]}}], footer}
  CT.pdf = function (doc) {
    const PW = 595.28, PH = 841.89, M = 40;
    const pages = []; let ops = []; let y = PH - M;
    const newPage = () => { if (ops.length) pages.push(ops); ops = []; y = PH - M; };
    const ensure = (h) => { if (y - h < M + 20) { newPage(); } };
    const text = (s, x, yy, size = 10, bold = false, color = '0 0 0') => ops.push(`BT /${bold ? 'F2' : 'F1'} ${size} Tf ${color} rg ${x.toFixed(2)} ${yy.toFixed(2)} Td ${pdfStr(s)} Tj ET`);
    const line = (x1, y1, x2, y2, w = 0.5, color = '0.8 0.8 0.8') => ops.push(`${color} RG ${w} w ${x1.toFixed(2)} ${y1.toFixed(2)} m ${x2.toFixed(2)} ${y2.toFixed(2)} l S`);
    const rect = (x, yy, w, h, color) => ops.push(`${color} rg ${x.toFixed(2)} ${yy.toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re f`);
    const wrap = (s, size, maxW) => { const words = String(s).split(/\s+/); const lines = []; let cur = ''; words.forEach((w) => { const t = cur ? cur + ' ' + w : w; if (tw(t, size) > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }); if (cur) lines.push(cur); return lines; };
    newPage();
    // intestazione
    rect(0, PH - 70, PW, 70, '0.918 0.949 0.996');
    text('ContabilyWork', M, PH - 32, 20, true, '0.122 0.435 0.902');
    text(doc.title || '', M, PH - 52, 13, true, '0.09 0.125 0.227');
    if (doc.subtitle) text(doc.subtitle, PW - M - tw(doc.subtitle, 10), PH - 32, 10, false, '0.3 0.3 0.3');
    y = PH - 90;
    (doc.meta || []).forEach((m) => { text(m, M, y, 9, false, '0.35 0.35 0.35'); y -= 12; });
    y -= 6;
    (doc.sections || []).forEach((sec) => {
      if (sec.heading) { ensure(30); y -= 8; text(sec.heading, M, y, 12, true, '0.122 0.435 0.902'); y -= 6; line(M, y, PW - M, y, 1, '0.122 0.435 0.902'); y -= 14; }
      (sec.lines || []).forEach((l) => { wrap(l, 10, PW - 2 * M).forEach((ln) => { ensure(14); text(ln, M, y, 10); y -= 13; }); });
      if (sec.table) {
        const t = sec.table; const ncol = t.head.length; const totalW = PW - 2 * M;
        const widths = t.widths ? t.widths.map((w) => (w / t.widths.reduce((a, b) => a + b, 0)) * totalW) : t.head.map(() => totalW / ncol);
        const align = t.align || t.head.map((_, i) => (i === 0 ? 'l' : 'r'));
        const drawHead = () => { rect(M, y - 4, totalW, 16, '0.918 0.949 0.996'); let x = M; t.head.forEach((h, i) => { const s = String(h); text(s, align[i] === 'r' ? x + widths[i] - 4 - tw(s, 9) : x + 4, y, 9, true); x += widths[i]; }); y -= 16; };
        ensure(40); drawHead();
        t.rows.forEach((r, ri) => {
          ensure(15); if (y === PH - M) drawHead();
          const bold = t.boldLast && ri === t.rows.length - 1;
          if (bold) rect(M, y - 4, totalW, 15, '0.95 0.95 0.95');
          let x = M; r.forEach((c, i) => { let s = String(c == null ? '' : c); while (tw(s, 9) > widths[i] - 8 && s.length > 3) s = s.slice(0, -2) + '…'; text(s, align[i] === 'r' ? x + widths[i] - 4 - tw(s, 9) : x + 4, y, 9, bold); x += widths[i]; });
          line(M, y - 4, PW - M, y - 4, 0.3, '0.88 0.88 0.88'); y -= 15;
        });
        y -= 6;
      }
    });
    if (ops.length) pages.push(ops);
    // assemblaggio
    const objs = [];
    const add = (s) => { objs.push(s); return objs.length; };
    const fontN = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>');
    const fontB = add('<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>');
    const pagesIdx = add('');
    const pageIds = pages.map((p, i) => {
      const footer = (doc.footer || 'Generato con ContabilyWork') + ' · pagina ' + (i + 1) + ' di ' + pages.length;
      const content = p.join('\n') + `\nBT /F1 8 Tf 0.45 0.45 0.45 rg ${M} 22 Td ${pdfStr(footer)} Tj ET`;
      const cid = add(`<< /Length ${enc.encode(content).length} >>\nstream\n${content}\nendstream`);
      return add(`<< /Type /Page /Parent ${pagesIdx} 0 R /MediaBox [0 0 ${PW} ${PH}] /Resources << /Font << /F1 ${fontN} 0 R /F2 ${fontB} 0 R >> >> /Contents ${cid} 0 R >>`);
    });
    objs[pagesIdx - 1] = `<< /Type /Pages /Kids [${pageIds.map((i) => i + ' 0 R').join(' ')}] /Count ${pageIds.length} >>`;
    const catalog = add(`<< /Type /Catalog /Pages ${pagesIdx} 0 R >>`);
    const info = add(`<< /Producer (ContabilyWork) /Title ${pdfStr(doc.title || 'Documento')} /CreationDate (D:${new Date().toISOString().replace(/[-:T]/g, '').slice(0, 14)}) >>`);
    let out = '%PDF-1.4\n%\xe2\xe3\xcf\xd3\n'; const offsets = [];
    const bytes = (s) => { let n = 0; for (const ch of s) n += ch.charCodeAt(0) > 127 ? 1 : 1; return n; };
    objs.forEach((o, i) => { offsets.push(out.length); out += `${i + 1} 0 obj\n${o}\nendobj\n`; });
    const xref = out.length;
    out += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n` + offsets.map((o) => String(o).padStart(10, '0') + ' 00000 n \n').join('') + `trailer\n<< /Size ${objs.length + 1} /Root ${catalog} 0 R /Info ${info} 0 R >>\nstartxref\n${xref}\n%%EOF`;
    void bytes;
    const u8 = new Uint8Array(out.length); for (let i = 0; i < out.length; i++) u8[i] = out.charCodeAt(i) & 0xff;
    return u8;
  };

  // ---------- Cifratura backup (AES-256-GCM, chiave da password con PBKDF2) ----------
  const b64 = (u8) => { let s = ''; u8.forEach((b) => (s += String.fromCharCode(b))); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function deriveKey(password, salt) {
    const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  CT.encryptBackup = async function (obj, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, enc.encode(JSON.stringify(obj)));
    return JSON.stringify({ app: 'ContabilyWork', encrypted: true, kdf: 'PBKDF2-SHA256-200000', cipher: 'AES-256-GCM', salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)), exportedAt: new Date().toISOString() });
  };
  CT.decryptBackup = async function (wrapper, password) {
    const key = await deriveKey(password, unb64(wrapper.salt));
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(wrapper.iv) }, key, unb64(wrapper.data));
    return JSON.parse(new TextDecoder().decode(pt));
  };

  // ---------- salvataggio / condivisione file ----------
  const MIME = { xlsx: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet', pdf: 'application/pdf', png: 'image/png', json: 'application/json', ctab: 'application/json', csv: 'text/csv', txt: 'text/plain' };
  CT.saveFile = async function (filename, data, { share = true } = {}) {
    const ext = filename.split('.').pop().toLowerCase();
    const mime = MIME[ext] || 'application/octet-stream';
    const blob = data instanceof Blob ? data : new Blob([data], { type: mime });
    // 1) App nativa (Capacitor): scrive nella cartella Documenti e apre il foglio di condivisione
    const Cap = window.Capacitor;
    if (Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Filesystem) {
      try {
        const buf = new Uint8Array(await blob.arrayBuffer());
        const FS = Cap.Plugins.Filesystem; let res, where;
        if (Cap.getPlatform && Cap.getPlatform() === 'android') {
          // Android: cartella Download del telefono (visibile in "Archivio" / "I miei file")
          try { if (FS.requestPermissions) await FS.requestPermissions(); res = await FS.writeFile({ path: 'Download/ContabilyWork/' + filename, data: b64(buf), directory: 'EXTERNAL_STORAGE', recursive: true }); where = 'Download/ContabilyWork/' + filename; }
          catch (e) { res = await FS.writeFile({ path: 'ContabilyWork/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true }); where = 'Documents/ContabilyWork/' + filename; }
        } else { res = await FS.writeFile({ path: 'ContabilyWork/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true }); where = 'File/ContabilyWork/' + filename; }
        if (share) {
          // 1) apre subito il file con l'app del telefono (PDF, Excel…) se il plugin FileOpener è presente nell'app installata
          const opened = await CT.openFile(res.uri, mime).catch((e) => { console.warn('Apertura file non riuscita', e); return false; });
          // 2) altrimenti il foglio di sistema: da qui si può scegliere l'app con cui aprirlo (Acrobat, Excel, Fogli…) o condividerlo
          if (!opened && Cap.Plugins.Share) { CT.toast('Salvato in ' + where); await Cap.Plugins.Share.share({ title: filename, url: res.uri, dialogTitle: 'Apri o condividi ' + filename }); }
        }
        return { ok: true, where };
      } catch (e) { console.warn('Salvataggio nativo non riuscito', e); CT.toast('Non riesco a salvare il file: controlla il permesso «File e contenuti multimediali» nelle impostazioni dell’app', 4500); return { ok: false, error: String((e && e.message) || e) }; }
    }
    // 2) Anteprima su claude.ai: capacità downloads
    try {
      if (window.claude && window.claude.use) {
        const dl = await window.claude.use('downloads');
        if (dl) { await dl.save({ filename, data: blob }); return { ok: true, where: filename }; }
      }
    } catch (e) { if (e && e.code === 'declined') return { ok: false, declined: true }; if (e && e.code && e.code !== 'unavailable' && e.code !== 'not_granted') return { ok: false, error: e.message || e.code }; console.warn(e); }
    // 3) Browser: download diretto nella cartella Download; condivisione nativa solo se richiesta
    try {
      if (share === 'share' && navigator.canShare && navigator.share) {
        const f = new File([blob], filename, { type: mime });
        if (navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: filename }); return { ok: true, where: filename }; }
      }
    } catch (e) { if (e && e.name === 'AbortError') return { ok: false, declined: true }; }
    const url = URL.createObjectURL(blob);
    const a = CT.h('a', { href: url, download: filename, style: { display: 'none' } });
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
    return { ok: true, where: filename };
  };

  // Apre un file salvato con l'app predefinita del telefono (lettore PDF, Excel, Fogli…).
  // Richiede il plugin nativo @capacitor-community/file-opener nell'app installata; senza plugin ritorna false.
  CT.openFile = async (uri, mime) => {
    const P = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.FileOpener;
    if (!P || !uri) return false;
    let filePath = String(uri);
    if (filePath.startsWith('file://')) { try { filePath = decodeURI(filePath.slice(7)); } catch (e) { filePath = filePath.slice(7); } }
    await P.open({ filePath, contentType: mime || 'application/octet-stream', openWithDefault: true });
    return true;
  };

  // salvataggio silenzioso (solo app installata), usato dal backup automatico: nessuna finestra di condivisione
  CT.saveFileNative = async function (filename, data) {
    const Cap = window.Capacitor;
    if (!(Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Filesystem)) return { ok: false };
    const FS = Cap.Plugins.Filesystem;
    const buf = typeof data === 'string' ? enc.encode(data) : data;
    try {
      if (Cap.getPlatform && Cap.getPlatform() === 'android') {
        try { if (FS.requestPermissions) await FS.requestPermissions(); await FS.writeFile({ path: 'Download/ContabilyWork/' + filename, data: b64(buf), directory: 'EXTERNAL_STORAGE', recursive: true }); return { ok: true, where: 'Download/ContabilyWork/' + filename }; }
        catch (e) { await FS.writeFile({ path: 'ContabilyWork/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true }); return { ok: true, where: 'Documents/ContabilyWork/' + filename }; }
      }
      await FS.writeFile({ path: 'ContabilyWork/' + filename, data: b64(buf), directory: 'DOCUMENTS', recursive: true });
      return { ok: true, where: 'File/ContabilyWork/' + filename };
    } catch (e) { console.warn('Salvataggio automatico non riuscito', e); return { ok: false, error: String((e && e.message) || e) }; }
  };

  CT.pickFile = (accept) => new Promise((res) => {
    const inp = CT.h('input', { type: 'file', accept, style: { display: 'none' } });
    inp.addEventListener('change', () => { const f = inp.files && inp.files[0]; inp.remove(); res(f || null); });
    document.body.appendChild(inp);
    inp.click();
    // se l'utente annulla, l'evento change non arriva: rimuovi dopo un po'
    setTimeout(() => { if (document.body.contains(inp)) { /* lasciato: alcuni browser inviano change in ritardo */ } }, 60000);
  });
  CT.readFileText = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsText(file); });
  CT.readFileBuf = (file) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsArrayBuffer(file); });
  // lettura di un file Excel .xlsx (primo foglio) tutto nel telefono: zip aperto a mano + XML; restituisce righe di celle (testo o numero)
  CT.leggiXlsx = async (buf) => {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let e = u8.length - 22; while (e >= 0 && dv.getUint32(e, true) !== 0x06054b50) e--;
    if (e < 0) throw new Error('Non è un file Excel (.xlsx)');
    const n = dv.getUint16(e + 10, true); let p = dv.getUint32(e + 16, true); const files = {};

  const PRIVACY = `<p class="agg">Versione del 1° novembre 2026 · secondo il Regolamento (UE) 2016/679 («GDPR») e il Codice in materia di protezione dei dati personali (D.Lgs. 196/2003, aggiornato dal D.Lgs. 101/2018).</p><h4>1. In breve</h4><ul><li><b>I dati restano sul telefono.</b> ${NOME} non ha il permesso di usare Internet: Android stesso le impedisce di collegarsi alla rete.</li><li>Nessun server, nessun account, nessuna pubblicità, nessuna statistica, nessun cookie, nessuna profilazione.</li><li>Lo sviluppatore <b>non riceve e non può vedere</b> nessuno dei dati che inserisci: nessuno può accedere alle tue informazioni senza il tuo telefono.</li><li>I dati escono dal telefono solo quando li mandi tu (Excel, PDF, immagine, messaggio, backup).</li></ul><h4>2. Chi è il titolare del trattamento</h4><p>I dati che inserisci riguardano te e le persone che lavorano con te. Per questi dati il <b>titolare del trattamento</b> (art. 4 n. 7 e art. 24 GDPR) è <b>il datore di lavoro che usa l'app</b>, cioè tu. ${NOME} è solo uno strumento che lavora dentro il tuo telefono. Lo sviluppatore non tratta questi dati: non li raccoglie, non li conserva e non li riceve, quindi non è né titolare né responsabile del trattamento (art. 28 GDPR).</p><h4>3. Quali dati si possono inserire</h4><ul><li>Nome della persona, tipo di contratto, giorni e ore di contratto.</li><li>Turni, ore lavorate, giorni liberi, ferie, ROL, festività e note.</li><li>L'indicazione «malattia» per un giorno, <b>senza diagnosi né certificati</b>: è un dato relativo alla salute (art. 9 GDPR), quindi scrivi solo «malattia» e mai la causa.</li></ul><p>Inserisci solo i dati che servono a organizzare i turni e a preparare la giornaliera (principio di minimizzazione, art. 5 GDPR).</p><h4>4. Perché si trattano e su quale base</h4><p>Per organizzare i turni, calcolare le ore e preparare la giornaliera per il consulente del lavoro. La base giuridica è l'esecuzione del contratto di lavoro e gli obblighi di legge del datore di lavoro (art. 6, par. 1, lett. b e c GDPR); per le assenze per malattia, gli obblighi in materia di diritto del lavoro (art. 9, par. 2, lett. b GDPR; art. 88 GDPR; artt. 111-114 del Codice).</p><h4>5. Dove sono e quanto restano</h4><ul><li>Nella memoria privata dell'app sul telefono, che le altre app non possono leggere. È esclusa dal backup automatico di Google, quindi non finisce su cloud.</li><li>La <b>copia automatica</b> giornaliera resta nella stessa memoria privata.</li><li>Il <b>backup in file</b> è cifrato (AES-256) con la password che scegli tu: senza password nessuno può leggerlo.</li><li>I dati restano finché li tieni tu. Quando un rapporto di lavoro finisce, conserva i dati solo per il tempo necessario e poi elimina la persona (Dipendenti → Modifica → cestino). Se disinstalli l'app, tutti i dati vengono cancellati.</li></ul><h4>6. Sicurezza</h4><p>Proteggi il telefono con blocco schermo (PIN, impronta o volto), usa una password robusta per i backup e manda i file solo a chi deve riceverli, per esempio al consulente del lavoro (art. 32 GDPR). Excel, PDF e immagini che condividi <b>non sono cifrati</b>: chi li riceve può leggerli.</p><h4>Blocco con PIN</h4><p>Puoi proteggere l'apertura dell'app con un <b>PIN di 4 cifre</b> (Info → Blocco con PIN): viene chiesto ogni volta che apri l'app e ogni volta che ci torni. Quando lo scegli ricevi un <b>codice di ripristino</b> di 12 caratteri: se dimentichi il PIN, con il codice ne scegli uno nuovo senza perdere i dati. Il PIN e il codice non vengono salvati: sul telefono resta solo un'impronta cifrata (PBKDF2-SHA256 con sale casuale), da cui non si può risalire a loro. Lo sviluppatore <b>non può sbloccare l'app</b> né recuperare il PIN, perché non vede i tuoi dati: se perdi sia il PIN sia il codice di ripristino devi cancellare i dati dell'app e ricaricare un backup con la sua password.</p><h4>7. Trasferimenti e comunicazioni</h4><p>L'app non trasferisce dati a nessuno, né in Italia né all'estero. Sei tu a decidere se mandare un file e a chi (per esempio al consulente del lavoro, che riceve i dati come tuo responsabile o come titolare autonomo, secondo l'incarico).</p><h4>8. Diritti delle persone</h4><p>I dipendenti hanno diritto di accesso, rettifica, cancellazione, limitazione, portabilità e opposizione (artt. 15-22 GDPR). Le richieste vanno fatte al datore di lavoro, che con l'app può:</p><ul><li>mostrare o consegnare i dati: Excel dei turni e della giornaliera;</li><li>correggerli: Turni, Giornaliera e Dipendenti → Modifica;</li><li>cancellarli: Dipendenti → Modifica → cestino.</li></ul><p>Chiunque ritenga che i propri dati siano trattati in modo non corretto può presentare reclamo al <b>Garante per la protezione dei dati personali</b> (www.garanteprivacy.it), o all'autorità di controllo del proprio paese nell'Unione Europea.</p><h4>9. Informativa ai dipendenti</h4><p>Come datore di lavoro devi dare ai tuoi dipendenti l'informativa sul trattamento dei loro dati (art. 13 GDPR). Puoi citare l'uso di ${NOME} per turni e giornaliera, che i dati restano sul telefono aziendale o del titolare e che vengono mandati solo al consulente del lavoro. Se hai dubbi, chiedi al tuo consulente del lavoro.</p><h4>10. Permessi del telefono</h4><ul><li><b>Notifiche</b>: solo per il promemoria di fine mese, che puoi spegnere in Info.</li><li><b>File</b>: per salvare Excel, PDF, immagini e backup nella cartella Download.</li><li><b>Internet</b>: <b>non richiesto</b>.</li></ul><h4>11. Modifiche</h4><p>Se questa informativa cambia, l'app te lo mostra alla prima apertura dopo l'aggiornamento e ti chiede di leggerla di nuovo.</p>`;
  const CONDIZIONI = `<p class="agg">Versione del 1° novembre 2026.</p><h4>1. Cosa fa l'app</h4><p>${NOME} serve a organizzare i turni del personale e del titolare, a contare le ore e a preparare la giornaliera da mandare al consulente del lavoro. È uno strumento di annotazione e di calcolo.</p><h4>2. Cosa non fa</h4><p>L'app <b>non sostituisce</b> il Libro Unico del Lavoro, le buste paga, il contratto collettivo (CCNL) né il parere del consulente del lavoro. Ore, ferie, ROL, banca ore e festività vengono calcolati <b>solo dai dati che inserisci tu</b> e dalle regole semplici spiegate nel Manuale. Controllali sempre con il contratto e con il tuo consulente.</p><h4>3. La tua responsabilità</h4><p>Sei responsabile dei dati che inserisci, della loro correttezza, dell'uso che fai di calcoli e riepiloghi, degli adempimenti verso i tuoi dipendenti (compresa la privacy), della custodia del telefono, del PIN, dei backup e della loro password.</p><h4>4. Limiti di responsabilità</h4><p>L'app è fornita «così com'è». Nei limiti consentiti dalla legge (art. 1229 c.c.), lo sviluppatore non risponde di errori di inserimento, perdite di dati (per esempio per guasto, smarrimento o disinstallazione), sanzioni o danni derivanti dall'uso dei calcoli. Restano salvi i casi di dolo o colpa grave e i diritti che la legge riconosce ai consumatori (D.Lgs. 206/2005, Codice del Consumo).</p><h4>5. Dati e backup</h4><p>I dati sono solo sul tuo telefono: lo sviluppatore non può recuperarli. Fai backup regolari (Info → Salva backup) e conservane una copia fuori dal telefono.</p><h4>6. Uso consentito</h4><p>Puoi usare l'app per la tua attività. Non è consentito copiarla, modificarla o rivenderla.</p><h4>7. Aggiornamenti</h4><p>Gli aggiornamenti possono aggiungere o cambiare funzioni. Se cambiano queste condizioni, l'app te le mostra di nuovo alla prima apertura.</p><h4>8. Legge applicabile</h4><p>Si applica la legge italiana. Se sei un consumatore, è competente il tribunale del luogo in cui risiedi.</p>`;
  const MANUALE = [["Per iniziare", "<p>1. Vai in <b>Dipendenti</b> e tocca <b>Aggiungi dipendente</b>. Aggiungi anche te stesso, il titolare, se fai i turni.</p><p>2. Per ogni persona scrivi il nome, il tipo di contratto, i <b>giorni di lavoro da contratto</b> (per esempio lun–sab) e le <b>ore a settimana</b>: le ore al giorno le calcola l'app (30 ore su 6 giorni = 5 ore al giorno). Se vuoi le puoi cambiare a mano.</p><p>3. Se vuoi tenere il conto di ferie e ROL, scrivi quelli che la persona ha a inizio anno, residui compresi.</p><p>4. Scegli il colore con cui la persona compare nei turni e nel calendario.</p><p>5. Vai in <b>Turni</b> e comincia a mettere i turni della settimana.</p>"], ["Ferie e ROL che maturano", "<p>In <b>Dipendenti → Modifica</b>, alla voce <b>Contratto nazionale</b>, scegli il contratto della persona: commercio e terziario (fino a 15 o oltre 15 dipendenti), turismo e pubblici esercizi, telecomunicazioni, industria metalmeccanica e alimentare, edilizia, scuola (docenti e ATA), sanità pubblica, comuni ed enti locali, ministeri, il minimo di legge oppure «Altro contratto». L’app mette da sola le ferie all’anno (in giorni), i ROL e le ex festività o festività soppresse (in ore): puoi correggerli se il tuo contratto dice altro.</p><p>Ogni mese matura 1/12: per il part-time ROL ed ex festività sono in proporzione all’orario; le ferie sono contate sui giorni in cui la persona lavora. Se scrivi la <b>data di assunzione</b>, il mese di ingresso conta se si entra entro il 15 e, per commercio e turismo, si applica la regola dei nuovi assunti (i primi anni maturano meno ROL).</p><p>Scrivi poi i <b>residui dell’ultima busta paga</b> (ferie e ROL rimasti) e il mese a cui si riferisce. Da lì l’app aggiunge quello che matura e toglie le ferie e i ROL che segni nella giornaliera. Nella <b>Giornaliera</b> trovi il riquadro <b>Ferie e ROL</b>: residui, maturati, goduti, rimasti oggi e quanto matura ancora entro dicembre. Quando arriva una busta paga nuova, tocca «Aggiorna i residui dalla busta paga».</p><p>I valori dei contratti sono indicativi: controlla sempre con il tuo contratto e con il consulente del lavoro.</p>"], ["Turni della settimana", "<p>La tabella ha una riga per persona e, per ogni giorno, due caselle: <b>mattina</b> e <b>sera</b>. Con le frecce ‹ › cambi settimana; tocca la data in mezzo per tornare alla settimana di oggi.</p><p>Tocca una casella per mettere il turno:</p><ul><li>i <b>tasti veloci</b> in alto mettono subito un orario preimpostato;</li><li>oppure scrivi <b>Dalle ore</b> e <b>Alle ore</b>, l'eventuale <b>pausa</b> in minuti e una nota, poi <b>Salva</b>;</li><li><b>Libero</b> segna la mezza giornata come riposo;</li><li>il <b>cestino</b> toglie il turno.</li></ul><p>«7 13» vuol dire dalle 7 alle 13; «17 20,30» dalle 17 alle 20:30. Sotto ogni persona c'è la riga <b>ore</b> con le ore del giorno, e a destra il totale della settimana.</p>"], ["Orari preimpostati", "<p>Sono i tasti veloci che compaiono quando metti un turno (per esempio mattina 8–13, sera inverno 16:30–20, sera estate 17–20:30). Li cambi da <b>Turni → Orari preimpostati</b> o dal collegamento dentro la finestra del turno: puoi rinominarli, cambiarne gli orari, aggiungerne o toglierne.</p>"], ["Copiare i turni", "<p><b>Copia settimana precedente</b>: riporta nella settimana che stai guardando i turni della settimana prima.</p><p><b>Copia questa settimana su tutto il mese</b>: copia i turni della settimana su tutte le altre settimane del mese (il lunedì sui lunedì, il martedì sui martedì…). I turni già messi in quelle caselle vengono sostituiti; prima di copiare l'app ti chiede conferma.</p>"], ["Avvisi sui riposi", "<p>Sotto la tabella compaiono gli avvisi se un dipendente:</p><ul><li>lavora <b>7 giorni di fila</b> senza un giorno di riposo;</li><li>ha meno di <b>11 ore di riposo</b> tra la fine di un giorno e l'inizio del successivo.</li></ul><p>Il titolare (contratto «Titolare») non viene controllato. Sono solo promemoria: le regole precise sono quelle del tuo contratto collettivo.</p>"], ["Ore in più, in meno e banca ore", "<p>Per chi ha le ore di contratto, la tabella <b>Ore in più / in meno</b> confronta le ore fatte nella settimana con quelle del contratto.</p><p>La <b>banca ore</b> somma da gennaio la differenza tra ore fatte e ore da contratto, contando solo i mesi in cui hai messo dei turni. La trovi sotto la tabella e nella Giornaliera interna.</p>"], ["Mandare i turni", "<p><b>Manda i turni ai dipendenti</b>: per ogni persona scegli <b>Messaggio</b> (testo con i turni della settimana, da mandare su WhatsApp, SMS o e-mail) oppure <b>Immagine</b> (una tabella da mandare come foto).</p><p><b>PDF della settimana</b>: tutti i turni della settimana in un PDF da stampare o appendere.</p><p>Il tasto <b>condividi</b> in alto a destra nella barra Turni crea l'<b>Excel dei turni del mese</b>.</p>"], ["Riepilogo e storico", "<p><b>Riepilogo ore</b>: le ore di ogni persona nel mese. <b>Storico turni</b>: un riquadro per ogni mese con turni; toccalo per aprire l'elenco giorno per giorno. Da lì puoi andare a quel mese (<b>Apri</b>) o farne l'Excel.</p>"], ["Calendario", "<p>Mostra il mese intero. In ogni giorno c'è una barra colorata per ogni persona che lavora: <b>barra piena</b> = mattina e sera, con la scritta «mattina» o «sera» = solo quel turno. Le etichette <b>ferie</b>, <b>ROL</b> e <b>malat.</b> indicano le assenze. Domeniche e feste sono in grigio, oggi è cerchiato.</p><p>Tocca un giorno per vedere chi lavora e cambiare i turni di ognuno.</p>"], ["Giornaliera interna (ore reali)", "<p>In <b>Giornaliera → Ore reali (interna)</b> trovi, per la persona e il mese scelti, le <b>ore realmente fatte</b> giorno per giorno, prese dai turni.</p><p>In alto c'è il riepilogo: ore fatte, ore previste dal contratto, ore in più o in meno, ferie, ROL, quante ne restano nell'anno e la banca ore.</p><p>Tocca un giorno per correggerlo: scegli <b>Lavoro, Libero, Ferie, ROL o Malattia</b>, cambia le ore se serve e salva. <b>Come dai turni</b> annulla la correzione. Quello che segni qui vale anche per la giornaliera del consulente.</p>"], ["Giornaliera per il consulente", "<p>In <b>Giornaliera → Per il consulente</b> ogni giorno di contratto vale le <b>ore al giorno del contratto</b> (per esempio 5 ore da lunedì a sabato), qualunque turno la persona abbia fatto davvero.</p><ul><li>Domeniche e giorni fuori contratto: <b>Riposo</b>.</li><li>Feste nazionali e festa del patrono: <b>Festività</b>.</li><li>Ferie, ROL e malattia: arrivano da quello che segni nella giornaliera.</li></ul><p>Per usarla servono le ore del contratto: impostale in <b>Dipendenti → Modifica</b>. La festa del patrono si imposta in <b>Info</b>.</p>"], ["Ferie, ROL e malattia", "<p>Le segni nella Giornaliera toccando il giorno. Per le ferie l'app propone le ore di una giornata di contratto. Se hai scritto in Dipendenti le ferie e i ROL di inizio anno, l'app ti mostra quanti ne restano.</p><p><b>Malattia</b>: scrivi solo che la persona era in malattia, mai la diagnosi o la causa, perché è un dato sulla salute protetto dal GDPR.</p>"], ["Excel della giornaliera", "<p>In fondo alla Giornaliera: <b>Giornaliera in Excel</b> crea il file della persona scelta, <b>Excel di tutti i dipendenti</b> crea un file con tutti. Il telefono ti fa scegliere come mandarlo (WhatsApp, e-mail…). Il file è nella versione che stai guardando: ore reali o per il consulente.</p>"], ["Calcolatrice e Cerca", "<p><b>Calcolatrice</b>, tasto in alto: si apre sopra l'app e puoi continuare a guardare i turni mentre fai i conti. <b>Copia</b> copia il risultato, <b>Riduci</b> la chiude lasciando il risultato scritto nel tasto, <b>✕</b> la chiude e la azzera.</p><p><b>Cerca</b>, tasto in alto: scrivi una parola (per esempio ferie, Excel, backup o il nome di un dipendente) e tocca il risultato per andarci.</p>"], ["Promemoria e festa del patrono", "<p>In <b>Info → Impostazioni</b>:</p><ul><li><b>Festa del patrono</b>: scegli il giorno (l'anno non conta, vale tutti gli anni) e il nome. Diventa festività nel calendario e nella giornaliera del consulente.</li><li><b>Promemoria a fine mese</b>: l'ultimo giorno del mese, all'ora che scegli, il telefono ti ricorda di mandare la giornaliera al consulente. Negli ultimi due giorni del mese compare anche un avviso giallo nella Giornaliera.</li></ul>"], ["Backup e cambio telefono", "<p><b>Salva backup</b> (Info): crea un file con dipendenti, turni e giornaliere, <b>cifrato con una password</b> che scegli tu (almeno 8 caratteri). Senza la password nessuno può aprirlo, nemmeno tu: segnatela. Conserva il file fuori dal telefono, per esempio mandandolo a te stesso per e-mail o salvandolo sul computer.</p><p><b>Carica backup</b>: scegli il file e scrivi la password. Sostituisce i dati che ci sono.</p><p><b>Backup automatico</b>: una copia al giorno nella memoria privata dell'app, da ripristinare se sbagli qualcosa. Attenzione: se disinstalli l'app o perdi il telefono la copia automatica si perde, il backup in file no.</p><p><b>Cambio telefono</b>: sul vecchio fai Salva backup, sul nuovo installa l'app e fai Carica backup.</p>"], ["Privacy in breve", "<p>Tutti i dati restano sul telefono: l'app non usa Internet e lo sviluppatore non vede niente. Tu, come datore di lavoro, sei il titolare del trattamento dei dati dei tuoi dipendenti. Leggi l'informativa completa in <b>Info → Privacy e GDPR</b>.</p>"], ["Blocco con PIN", "<p>In <b>Info → Blocco con PIN</b> tocca <b>Imposta PIN</b>, scegli 4 cifre e ripetile. Da quel momento l'app chiede il PIN ogni volta che la apri o ci torni. Ti viene dato anche un <b>codice di ripristino</b> di 12 caratteri: scrivilo su un foglio e tienilo lontano dal telefono.</p><p>Dopo 5 tentativi sbagliati bisogna aspettare 30 secondi. Da Info puoi <b>cambiare</b> o <b>togliere</b> il PIN (serve quello attuale).</p><p><b>PIN dimenticato?</b> Tocca «PIN dimenticato?», scrivi il codice di ripristino e scegli un PIN nuovo: i dati restano. Se hai perso anche il codice, lo sviluppatore non può sbloccare l'app: devi cancellare tutti i dati e ricaricare un backup con la sua password. Per questo fai backup regolari.</p>"], ["Domande frequenti", "<p><b>Ho messo un turno sbagliato.</b> Tocca la casella e correggilo, oppure usa il cestino.</p><p><b>La giornaliera del consulente è tutta a zero.</b> Mancano le ore del contratto: Dipendenti → Modifica → Ore a settimana.</p><p><b>Le ore in più non tornano.</b> Controlla le pause dei turni e i giorni di lavoro da contratto in Dipendenti.</p><p><b>Ho perso i dati.</b> Info → Ripristina la copia automatica, oppure Carica backup se hai un file.</p><p><b>Non arriva il promemoria.</b> Controlla che le notifiche di ContabilyWork siano permesse nelle impostazioni del telefono.</p>"]];
  const doc = (titolo, html, open) => h('details', { class: 'doc', open: open ? true : null }, h('summary', null, titolo, h('span', { class: 'chev', 'aria-hidden': 'true' }, '›')), h('div', { class: 'prosa', html }));

  }

  const fineMeseVicina = () => { const d = toDate(oggi()); return giorniNelMese(ymOf(oggi())) - d.getDate() <= 1; };
  async function programmaPromemoria(richiediPermesso) {

      const ids = Array.from({ length: 12 }, (_, i) => 500 + i); await LN.cancel({ notifications: ids.map((id) => ({ id })) }).catch(() => {});
      if (!(db.promemoria || {}).attivo) return;
      let perm = LN.checkPermissions ? await LN.checkPermissions().catch(() => null) : null;

  // backup automatico: una copia al giorno (nell'app installata in Download/ContabilyWork, qui nella memoria del browser)

  const copiaDove = () => (db.ultimaCopiaDove || '');

    if (!forza && db.ultimaCopia && Date.now() - new Date(db.ultimaCopia).getTime() < 20 * 3600 * 1000) return;

      } catch (e) { toast('File non leggibile'); }
