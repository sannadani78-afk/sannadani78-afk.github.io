<script>
/* Blocco con PIN di 4 cifre (Contabily). Il PIN non viene mai salvato: si salva solo un'impronta (PBKDF2-SHA256, 150.000 giri, con sale casuale).
   Si chiede all'apertura dell'app e ogni volta che ci si torna dopo averla chiusa o messa in secondo piano. 5 tentativi sbagliati → attesa di 30 secondi.
   Codice di ripristino di 12 caratteri (anch'esso salvato solo come impronta) per scegliere un PIN nuovo senza perdere i dati. */
(function () {
  'use strict';

<script>
(function () {

    Object.entries(attrs || {}).forEach(([k, v]) => {

  // ---------- info: privacy, condizioni, backup ----------
  const CONDIZIONI = `<p class="agg">Versione del 1° novembre 2026.</p><h4>1. Cosa fa l'app</h4><p>${NOME} serve a contare il denaro contante (banconote e monete), a confrontarlo con il fondo cassa e a tenere lo storico delle conte. È uno strumento di calcolo.</p><h4>2. Cosa non fa</h4><p>L'app <b>non sostituisce</b> il registratore telematico, i corrispettivi, i registri e i documenti fiscali o contabili, né il commercialista. I risultati dipendono <b>solo dai dati che inserisci tu</b>: controllali sempre.</p><h4>3. La tua responsabilità</h4><p>Sei l'<b>unico responsabile</b> dei dati che inserisci, della loro correttezza, dell'uso che fai di conte e totali, degli adempimenti fiscali e contabili della tua attività, della custodia del telefono, del PIN, dei backup e della loro password.</p><h4>4. Limiti di responsabilità</h4><p>L'app è fornita «così com'è». Nei limiti consentiti dalla legge (art. 1229 c.c.), lo sviluppatore non risponde di errori di conteggio o di inserimento, differenze di cassa, perdite di dati (per esempio per guasto, smarrimento o disinstallazione), sanzioni o danni derivanti dall'uso dell'app. Restano salvi i casi di dolo o colpa grave e i diritti che la legge riconosce ai consumatori (D.Lgs. 206/2005, Codice del Consumo).</p><h4>5. Dati e backup</h4><p>I dati sono solo sul tuo telefono: lo sviluppatore non può vederli né recuperarli. Fai backup regolari (Info → Salva backup) e conservane una copia fuori dal telefono.</p><h4>6. Uso consentito</h4><p>Puoi usare l'app per la tua attività. Non è consentito copiarla, modificarla o rivenderla.</p><h4>7. Aggiornamenti</h4><p>Gli aggiornamenti possono aggiungere o cambiare funzioni. Se cambiano queste condizioni, l'app te le mostra di nuovo alla prima apertura.</p><h4>8. Legge applicabile</h4><p>Si applica la legge italiana. Se sei un consumatore, è competente il tribunale del luogo in cui risiedi.</p>`;
  const PRIVACY = `<p class="agg">Versione del 1° novembre 2026 · secondo il Regolamento (UE) 2016/679 («GDPR») e il Codice in materia di protezione dei dati personali (D.Lgs. 196/2003, aggiornato dal D.Lgs. 101/2018).</p><h4>1. In breve</h4><ul><li><b>I dati restano sul telefono.</b> ${NOME} non ha il permesso di usare Internet: Android stesso le impedisce di collegarsi alla rete.</li><li>Nessun server, nessun account, nessuna pubblicità, nessuna statistica, nessun cookie, nessuna profilazione.</li><li>Lo sviluppatore <b>non riceve e non può vedere</b> nessuno dei dati che inserisci: nessuno può accedere alle tue informazioni senza il tuo telefono.</li><li>I dati escono dal telefono solo quando li mandi tu (condivisione di una conta, backup).</li></ul><h4>2. Chi è il titolare del trattamento</h4><p>Le conte riguardano la tua attività. Se nelle note scrivi dati di altre persone (per esempio il nome di chi ha fatto la cassa), il <b>titolare del trattamento</b> (art. 4 n. 7 e art. 24 GDPR) sei <b>tu che usi l'app</b>. ${NOME} è solo uno strumento che lavora dentro il tuo telefono. Lo sviluppatore non tratta questi dati: non li raccoglie, non li conserva e non li riceve, quindi non è né titolare né responsabile del trattamento (art. 28 GDPR).</p><h4>3. Quali dati si possono inserire</h4><ul><li>Il numero di banconote e monete contate, il totale, il fondo cassa, la data e l'ora.</li><li>Una nota libera per ogni conta.</li></ul><p>Nelle note scrivi solo quello che serve (principio di minimizzazione, art. 5 GDPR): niente dati personali di clienti o dipendenti se non sono necessari.</p><h4>4. Dove sono e quanto restano</h4><ul><li>Nella memoria privata dell'app sul telefono, che le altre app non possono leggere. È esclusa dal backup automatico di Google, quindi non finisce su cloud.</li><li>Il <b>backup in file</b> è cifrato (AES-256) con la password che scegli tu: senza password nessuno può leggerlo, nemmeno lo sviluppatore. Se la dimentichi, il backup non si può aprire.</li><li>I dati restano finché li tieni tu: puoi eliminare ogni conta. Se disinstalli l'app, tutti i dati vengono cancellati.</li></ul><h4>5. Sicurezza</h4><p>Proteggi il telefono con il blocco schermo (PIN, impronta o volto), usa una password robusta per i backup e manda le conte solo a chi deve riceverle (art. 32 GDPR). Il testo di una conta che condividi <b>non è cifrato</b>: chi lo riceve può leggerlo.</p><h4>Blocco con PIN</h4><p>Puoi proteggere l'apertura dell'app con un <b>PIN di 4 cifre</b> (Info → Blocco con PIN): viene chiesto ogni volta che apri l'app e ogni volta che ci torni. Quando lo scegli ricevi un <b>codice di ripristino</b> di 12 caratteri: se dimentichi il PIN, con il codice ne scegli uno nuovo senza perdere i dati. Il PIN e il codice non vengono salvati: sul telefono resta solo un'impronta cifrata (PBKDF2-SHA256 con sale casuale), da cui non si può risalire a loro. Lo sviluppatore <b>non può sbloccare l'app</b> né recuperare il PIN, perché non vede i tuoi dati: se perdi sia il PIN sia il codice di ripristino devi cancellare i dati dell'app e ricaricare un backup con la sua password.</p><h4>6. Trasferimenti</h4><p>L'app non trasferisce dati a nessuno, né in Italia né all'estero. Sei tu a decidere se condividere una conta o salvare un backup, e con chi.</p><h4>7. Diritti</h4><p>Hai sempre il pieno controllo: puoi vedere, correggere ed eliminare ogni dato dall'app. Se nelle note hai scritto dati di altre persone, sei tu a dover rispondere alle loro richieste di accesso, rettifica o cancellazione (artt. 15-22 GDPR). Chiunque ritenga che i propri dati siano trattati in modo non corretto può presentare reclamo al <b>Garante per la protezione dei dati personali</b> (www.garanteprivacy.it), o all'autorità di controllo del proprio paese nell'Unione Europea.</p><h4>8. Permessi del telefono</h4><ul><li><b>File</b>: solo per salvare e caricare il backup nella cartella Download.</li><li><b>Internet</b>: <b>non richiesto</b>.</li></ul><h4>9. Modifiche</h4><p>Se questa informativa cambia, l'app te lo mostra alla prima apertura dopo l'aggiornamento e ti chiede di leggerla di nuovo.</p>`;
  const doc = (titolo, html) => h('details', { class: 'doc' }, h('summary', null, titolo, h('span', { class: 'chev', 'aria-hidden': 'true' }, '›')), h('div', { class: 'prosa', html }));
  function schermataInfo(main) {
    main.append(
      window.ContabilyPin ? ContabilyPin.pannello({ ridisegna: disegna }) : null,
      h('div', { class: 'panel' }, h('h3', null, 'Backup'), h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, 'Salva tutte le conte in un file protetto da password e ricaricale su questo o su un altro telefono.'),
        h('div', { class: 'tasti', style: { margin: 0 } },
          h('button', { class: 'btn ghost', onclick: esporta }, svg('giu'), 'Salva backup'),
          h('button', { class: 'btn ghost', onclick: importa }, svg('su'), 'Carica backup'))),
      h('div', { class: 'panel' }, h('h3', null, 'Privacy e condizioni'),
        h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, 'Nessun dato lascia il telefono: l’app non usa Internet e non ha server, lo sviluppatore non vede niente. Tocca un titolo per leggere il testo completo.'),
        h('div', { class: 'docs' }, doc('Informativa privacy e GDPR', PRIVACY), doc('Condizioni d’uso', CONDIZIONI + (db.accettatoIl ? '<p class="agg">Accettate il ' + new Date(db.accettatoIl).toLocaleDateString('it-IT') + '.</p>' : '')))),
      h('p', { class: 'muted small', style: { textAlign: 'center' } }, NOME + ' · versione ' + VERSIONE));
  }
  // ---------- file e backup cifrato (AES-256-GCM, chiave dalla password con PBKDF2) ----------
  const enc = new TextEncoder();
  const b64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  async function chiaveDa(password, salt) {
    const km = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 200000, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }
  async function cifra(obj, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, await chiaveDa(password, salt), enc.encode(JSON.stringify(obj)));
    return { app: NOME, encrypted: true, kdf: 'PBKDF2-SHA256-200000', cipher: 'AES-256-GCM', salt: b64(salt), iv: b64(iv), data: b64(new Uint8Array(ct)), exportedAt: new Date().toISOString() };
  }
  async function decifra(w, password) {
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(w.iv) }, await chiaveDa(password, unb64(w.salt)), unb64(w.data));
    return JSON.parse(new TextDecoder().decode(pt));
  }
  // salva un file: nell'app installata va in Download/ContabilyCassa e si apre il foglio «condividi»; nel browser viene scaricato
  async function salvaFile(nome, testo) {
    const Cap = window.Capacitor;
    if (Cap && Cap.isNativePlatform && Cap.isNativePlatform() && Cap.Plugins && Cap.Plugins.Filesystem) {
      const FS = Cap.Plugins.Filesystem; const dati = b64(enc.encode(testo)); let res, dove;
      try {
        try { if (FS.requestPermissions) await FS.requestPermissions(); res = await FS.writeFile({ path: 'Download/ContabilyCassa/' + nome, data: dati, directory: 'EXTERNAL_STORAGE', recursive: true }); dove = 'Download/ContabilyCassa'; }
        catch (e) { res = await FS.writeFile({ path: 'ContabilyCassa/' + nome, data: dati, directory: 'DOCUMENTS', recursive: true }); dove = 'Documenti/ContabilyCassa'; }
        toast('Salvato in ' + dove, 3000);
        if (Cap.Plugins.Share) { try { await Cap.Plugins.Share.share({ title: nome, url: res.uri, dialogTitle: 'Condividi ' + nome }); } catch (e) { /* condivisione annullata: il file resta salvato */ } }
        return true;
      } catch (e) { toast('Non riesco a salvare il file'); return false; }
    }
    const a = h('a', { href: URL.createObjectURL(new Blob([testo], { type: 'application/json' })), download: nome, style: { display: 'none' } });
    document.body.append(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); toast('Backup salvato'); return true;
  }
  const chiediPassword = (titolo, conferma) => new Promise((res) => {
    const p1 = h('input', { type: 'password', class: 'testo', autocomplete: 'new-password', placeholder: 'Almeno 8 caratteri', 'aria-label': 'Password' });
    const p2 = conferma ? h('input', { type: 'password', class: 'testo', autocomplete: 'new-password', placeholder: 'Scrivila di nuovo', 'aria-label': 'Ripeti la password' }) : null;
    const campo = (l, el) => h('div', { class: 'campo' }, h('label', null, l), el);
    let fatto = false; const fine = (v) => { if (fatto) return; fatto = true; chiudi(); res(v); };
    const chiudi = foglio(titolo, [h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, conferma ? 'Il backup viene cifrato: senza questa password nessuno può leggerlo, nemmeno tu. Segnatela in un posto sicuro.' : 'Scrivi la password con cui hai salvato il backup.'), campo('Password', p1), p2 ? campo('Ripeti la password', p2) : null],
      () => [h('button', { class: 'btn ghost', onclick: () => fine(null) }, 'Annulla'), h('button', { class: 'btn', onclick: () => { if (p1.value.length < 8) return toast('La password deve avere almeno 8 caratteri'); if (p2 && p2.value !== p1.value) return toast('Le due password non sono uguali'); fine(p1.value); } }, svg('salva'), 'Conferma')]);
    setTimeout(() => p1.focus(), 60);
  });
  async function esporta() {
    const pw = await chiediPassword('Backup protetto da password', true); if (!pw) return;
    const w = await cifra({ app: NOME, tipo: 'backup', data: new Date().toISOString(), conte: db.conte, fondo: db.fondo }, pw);
    salvaFile('ContabilyCassa_backup_' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(w));
  }
  function importa() {
    const inp = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' } });
    inp.addEventListener('change', async () => {
      const f = inp.files && inp.files[0]; inp.remove(); if (!f) return;
      try {
        let o = JSON.parse(await f.text());
        if (o && o.encrypted) { const pw = await chiediPassword('Backup protetto', false); if (!pw) return; try { o = await decifra(o, pw); } catch (e) { return toast('Password sbagliata'); } }
        if (!o || o.app !== NOME || !Array.isArray(o.conte)) return toast('Non è un backup di ' + NOME);
        const ids = new Set(db.conte.map((c) => c.id)); const nuove = o.conte.filter((c) => c && c.id && !ids.has(c.id) && c.pezzi && typeof c.totale === 'number');
        db.conte = [...db.conte, ...nuove].sort((a, b) => (a.quando < b.quando ? 1 : -1)); salvaDb(); toast(nuove.length + ' conte caricate'); disegna();
      } catch (e) { toast('File non leggibile'); }
    });
    document.body.append(inp); inp.click();
  }

  // ---------- primo avvio: accettazione delle condizioni ----------
  if (db.accettato < TERMINI_VER) {
    const spunta = h('input', { type: 'checkbox', id: 'accetto', class: 'spunta' });
    const ok = h('button', { class: 'btn', disabled: true, onclick: () => { if (!spunta.checked) return; db.accettato = TERMINI_VER; db.accettatoIl = new Date().toISOString(); salvaDb(); chiudi(); disegna(); if (window.ContabilyPin) ContabilyPin.proponi(); } }, svg('salva'), 'Accetto e inizio');
    spunta.addEventListener('change', () => { ok.disabled = !spunta.checked; });
    const chiudi = foglio(db.accettato ? 'Privacy e condizioni aggiornate' : 'Benvenuto in ' + NOME, [
      h('p', { style: { margin: '0 0 8px' } }, db.accettato ? 'Abbiamo aggiornato l’informativa privacy (GDPR) e le condizioni d’uso. Prima di continuare, quattro cose chiare:' : 'Prima di iniziare, quattro cose chiare:'),
      h('ul', { class: 'punti' },
        h('li', null, h('b', null, 'I dati restano sul telefono.'), ' L’app non usa Internet e non ha server: nessuno, nemmeno lo sviluppatore, riceve o vede i tuoi dati.'),
        h('li', null, h('b', null, 'Sei tu il responsabile'), ' dei dati che inserisci e dell’uso che ne fai.'),
        h('li', null, h('b', null, 'L’app è uno strumento di calcolo:'), ' non sostituisce registratore telematico, registri e commercialista. Controlla sempre i conti.'),
        h('li', null, h('b', null, 'Fai backup regolari:'), ' se perdi il telefono o disinstalli l’app, i dati non si possono recuperare. I backup sono protetti dalla password che scegli tu.')),
      h('p', { class: 'muted small', style: { margin: '0 0 10px' } }, 'Subito dopo potrai scegliere un PIN di 4 cifre che verrà chiesto ogni volta che apri l’app.'),
      h('div', { class: 'docs' }, doc('Leggi l’informativa privacy e GDPR', PRIVACY), doc('Leggi le condizioni d’uso', CONDIZIONI))],
    () => [h('label', { class: 'riga-spunta', for: 'accetto', style: { width: '100%', padding: '2px 2px 4px', fontWeight: '600' } }, h('span', null, 'Ho letto l’informativa privacy e accetto le condizioni d’uso.'), spunta), ok]);
    document.querySelector('.foglio-ov').onclick = null; document.querySelector('.foglio .fh button').remove();
  }
  disegna();
})();
</script>
